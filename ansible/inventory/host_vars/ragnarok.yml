# The ARR apps' web ports (Sonarr, Radarr, Prowlarr, Jackett, qBittorrent): their own logins
# are off because the gateway's single sign-on stands in front of them, so only the gateway,
# Pulse and this VM's containers may reach them (role port_guard). qBittorrent's torrent port
# stays open.
port_guard_ports: [8989, 7878, 9696, 9117, 8080]
