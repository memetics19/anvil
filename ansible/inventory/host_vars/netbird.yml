# PHP was purged by hand on 2026-10-21 (php2shell, CVE-2026-109618/109619); nothing on this
# VM needs it. guest_base keeps these absent (make vm HOST=netbird ARGS="--tags packages_absent").
guest_base_absent_packages:
  - "php*"
  - composer
  - jsonlint
# The self-hosted NetBird server's metrics (role netbird_server, netbird_server_metrics_port)
# answer only the monitoring VM, the gateway and this VM. Caddy's port (8443) is not listed:
# NetBird clients reach it from anywhere.
port_guard_ports: [9095]
port_guard_extra_sources: ["{{ site.hosts.monitoring.ip }}"]
