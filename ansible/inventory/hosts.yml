# Hosts by name only. Addresses come from the `site` dict (group_vars/all/site.yml).
all:
  children:
    proxmox:
      hosts:
        pve:
          ansible_host: "{{ site.pve.ip }}"
    guests:
      hosts:
        frigate:
          ansible_host: "{{ site.hosts.frigate.ip }}"
        netbird:
          ansible_host: "{{ site.hosts.netbird.ip }}"
        ragnarok:
          ansible_host: "{{ site.hosts.ragnarok.ip }}"
    vault_servers:
      hosts:
        vault:
          # Its lab address while it keeps that NIC (group_vars/vault_servers.yml).
          ansible_host: >-
            {{ site.hosts.vault.lab_ip
               if (site.hosts.vault.lab_ip is defined and not (site.hosts.vault.lab_nic_retired | default(false) | bool))
               else site.hosts.vault.ip }}
    # Small always-on services shared on one VM (Pi-hole, Homepage, Vaultwarden, the gateway).
    apps_servers:
      hosts:
        apps:
          ansible_host: "{{ site.hosts.apps.ip }}"
    # Vaultwarden, in the secrets enclave (Terraform vm_vaultwarden.tf).
    vaultwarden_servers:
      hosts:
        vaultwarden:
          ansible_host: "{{ site.hosts.vaultwarden.ip }}"
    # The secrets enclave (no internet, role pve_enclave): Ansible reaches these VMs through
    # the Proxmox host (group_vars/enclave.yml), apt through its cache.
    enclave:
      children:
        vault_servers:
        vaultwarden_servers:
    # Hosts that run node_exporter (installed by hand before this repo; kept at that version).
    node_exporter:
      hosts:
        frigate:
        ragnarok:
