# Common roles for the guest VMs: guest_base (timezone, qemu-guest-agent, fstrim.timer,
# static netplan on the adopted guests), docker, cloudflared (token from Vault) and
# node_exporter (group node_exporter in the inventory).
# Run: make vms ARGS="--check --diff"   or one VM: make vm HOST=frigate
# Tags: base, docker, cloudflared, node_exporter, frigate, arr, iptv_epg, filestash, iptv,
# netbird_peer, redis, ntfy, pulse, pihole.
- name: Guest base
  hosts: guests:vault_servers:apps_servers
  pre_tasks:
    - name: Resolve the site dict once for this run
      ansible.builtin.import_tasks: tasks/site.yml
      tags: [always]
  roles:
    - role: guest_base
      tags: [base]

- name: Docker and the Cloudflare tunnel
  hosts: guests
  roles:
    - role: docker
      tags: [docker]
    - role: cloudflared
      tags: [cloudflared]

- name: Node exporter
  hosts: node_exporter
  roles:
    - role: node_exporter
      tags: [node_exporter]

# Workload: the Frigate NVR stack (compose project "home"), nginx in front of it.
- name: Frigate stack
  hosts: frigate
  # A failed task must not drop a pending restart: the next run would not see the change.
  force_handlers: true
  roles:
    - role: frigate_stack
      tags: [frigate]

# Workloads on ragnarok, one compose project each: the ARR stack, the IPTV EPG web,
# Filestash and IPTV (Threadfin and the stream helper; after iptv_epg, whose directory
# its guide grabber fills). Only services whose container differs from the file are brought up. Nothing
# touches the media library (tests/test_media_untouched.sh).
- name: Ragnarok workloads
  hosts: ragnarok
  force_handlers: true
  roles:
    - role: arr_stack
      tags: [arr]
    - role: iptv_epg
      tags: [iptv_epg]
    - role: filestash
      tags: [filestash]
    - role: iptv
      tags: [iptv]

# Workloads on the netbird VM: the NetBird routing peer (the emergency VPN path; never
# restarted, re-enrolled or upgraded here), Redis, ntfy and Pulse. Never run in the same
# Ansible run as playbooks/host-network.yml (make host-network).
- name: Netbird workloads
  hosts: netbird
  force_handlers: true
  roles:
    - role: netbird_peer
      tags: [netbird_peer]
    - role: redis
      tags: [redis]
    - role: ntfy
      tags: [ntfy]
    - role: pulse
      tags: [pulse]
  post_tasks:
    - name: The NetBird client is still connected
      ansible.builtin.include_role:
        name: netbird_peer
        tasks_from: verify.yml
        apply:
          tags: [always]
      when: netbird_peer_state_start | default('') == 'connected'
      tags: [always]

# Workloads on the apps VM (shared, small always-on services): Pi-hole with Unbound, DNS
# for the home and lab networks. No Cloudflare tunnel here.
- name: Apps workloads
  hosts: apps_servers
  force_handlers: true
  roles:
    - role: docker
      tags: [docker]
    - role: pihole
      tags: [pihole]
