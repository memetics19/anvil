# Common roles for the guest VMs: guest_base (timezone, qemu-guest-agent, fstrim.timer,
# static netplan on the adopted guests), docker, cloudflared (token from Vault) and
# node_exporter (group node_exporter in the inventory).
# Run: make vms ARGS="--check --diff"   or one VM: make vm HOST=frigate
# Tags: base, docker, cloudflared, node_exporter, frigate, docmost, arr, iptv_epg, filestash, iptv,
# netbird_peer, netbird_home, redis, ntfy, pulse, pulse_agent, grow_disk and rotate (only when named), nfs_media, apt_repo, netbird_server, pihole, homepage,
# vaultwarden, authentik, caddy, docs, firewall, tcp_options_guard. The tag docs alone copies only the static sites Caddy
# serves (make docs-publish). The tag homepage alone also runs the pieces other roles keep
# for the dashboard (ARR API keys into Vault on ragnarok, the Frigate viewer login, Pi-hole's
# app password).
# The secrets enclave's VMs have no internet: apt and time through the Proxmox host first.
- name: Enclave guests (apt cache, time)
  hosts: enclave
  pre_tasks:
    - name: Resolve the site dict once for this run
      ansible.builtin.import_tasks: tasks/site.yml
      tags: [always]
  roles:
    - role: enclave_guest
      tags: [base, enclave]

- name: Guest base
  hosts: guests:vault_servers:apps_servers:vaultwarden_servers:identity_servers:llm_servers
  pre_tasks:
    - name: Resolve the site dict once for this run
      ansible.builtin.import_tasks: tasks/site.yml
      tags: [always]
  roles:
    - role: guest_base
      tags: [base]

# Every VM, the enclave's too: drop IPv4 TCP with IP options (CVE-2026-98432).
- name: TCP options guard
  hosts: guests:vault_servers:apps_servers:vaultwarden_servers:identity_servers:llm_servers
  roles:
    - role: tcp_options_guard
      tags: [tcp_options_guard]

- name: Docker
  hosts: guests:identity_servers:llm_servers
  roles:
    - role: docker
      tags: [docker]

# One connector at a time: the next is touched only when this one is back and ready at
# Cloudflare's edge, so the tunnel's public names stay up. Any failure stops the rest.
- name: The Cloudflare tunnel connectors
  hosts: guests
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: cloudflared
      tags: [cloudflared]

- name: Node exporter
  hosts: node_exporter
  roles:
    - role: node_exporter
      tags: [node_exporter]

# The media library for a Jellyfin in another home: ragnarok joins NetBird cloud as a plain
# peer (no routes) when site.nfs.clients is set, then serves movies and tv read-only over
# NFSv4: to the operator's own devices on the lab network (site.admin_sources, for a player
# like VLC) and, when set, to the NetBird IPs in site.nfs.clients. NetBird is enrolled only
# for the remote-home case. Nothing runs until there is at least one reader.
- name: Media over NFS and SMB
  hosts: ragnarok
  roles:
    - role: netbird_peer
      tags: [netbird_peer, nfs_media]
      when: site.nfs.clients | default([]) | length > 0
    - role: nfs_media
      tags: [nfs_media]
      when: (site.nfs.clients | default([]) | length > 0) or (site.admin_sources | default([]) | length > 0)
    # SMB too: a phone or Fire TV finds the library in VLC's Local Network, which NFS on
    # Android often will not. Read-only, same folders and readers.
    - role: smb_media
      tags: [smb_media]
      when: site.admin_sources | default([]) | length > 0

# After Proxmox made a VM's disk bigger (make grow-disk): grow the partition and filesystem
# at its end, online. Only with --tags grow_disk.
- name: Grow disk
  hosts: guests:apps_servers:vault_servers:vaultwarden_servers:identity_servers:llm_servers
  roles:
    - role: grow_disk
      tags: [never, grow_disk]

# Host metrics for Pulse, on every VM that reaches it. The enclave has no route to Pulse.
- name: Pulse agent
  hosts: guests:apps_servers:identity_servers:llm_servers
  roles:
    - role: pulse_agent
      tags: [pulse_agent]

# Workload: the Frigate NVR stack (compose project "home"), nginx in front of it.
- name: Frigate stack
  hosts: frigate
  # A failed task must not drop a pending restart: the next run would not see the change.
  force_handlers: true
  roles:
    - role: frigate_stack
      tags: [frigate]
    # The wiki, its own compose project next to the camera stack.
    - role: docmost
      tags: [docmost]

# Workloads on ragnarok, one compose project each, behind the port guard: the ARR stack, the IPTV EPG web,
# Filestash and IPTV (Threadfin and the stream helper; after iptv_epg, whose directory
# its guide grabber fills). Only services whose container differs from the file are brought up. Nothing
# touches the media library (tests/unit/test_media_untouched.sh).
- name: Ragnarok workloads
  hosts: ragnarok
  force_handlers: true
  roles:
    # Before the apps: a port whose app login is off is closed to the LAN first.
    - role: port_guard
      tags: [port_guard, arr]
    - role: arr_stack
      tags: [arr]
    - role: iptv_epg
      tags: [iptv_epg]
    - role: filestash
      tags: [filestash]
    - role: iptv
      tags: [iptv]

# Workloads on the netbird VM: the NetBird routing peer (the emergency VPN path; never
# restarted, re-enrolled or upgraded here), Redis, ntfy, Pulse, the anvil apt repository
# and the self-hosted NetBird server (when site.netbird_domain is set). Never run in the
# same Ansible run as playbooks/host-network.yml (make host-network).
- name: Netbird workloads
  hosts: netbird
  force_handlers: true
  roles:
    - role: netbird_peer
      tags: [netbird_peer]
    - role: redis
      tags: [redis]
    - role: ntfy
      tags: [ntfy]
    - role: pulse
      tags: [pulse]
    - role: apt_repo
      tags: [apt_repo]
    - role: netbird_server
      tags: [netbird_server]
  tasks:
    # After the server: the routing peer of the self-hosted network, a second client service.
    - name: The netbird-home client
      ansible.builtin.include_role:
        name: netbird_peer
        tasks_from: home.yml
        apply:
          tags: [netbird_peer, netbird_home]
      when: site.netbird_domain | default('', true) | length > 0
      tags: [netbird_peer, netbird_home]
  post_tasks:
    - name: The NetBird client is still connected
      ansible.builtin.include_role:
        name: netbird_peer
        tasks_from: verify.yml
        apply:
          tags: [always]
      when: netbird_peer_state_start | default('') == 'connected'
      tags: [always]

# Workloads on the apps VM (shared, small always-on services): Pi-hole with Unbound, DNS
# for the home and lab networks, the Homepage dashboard and the service gateway (Caddy:
# https://<name>.<gateway domain> for every entry of site.services; its image is built on
# ragnarok). No Cloudflare tunnel here.
- name: Apps workloads
  hosts: apps_servers
  force_handlers: true
  # The gateway's service list feeds both Pi-hole and Caddy: a bad entry stops the run
  # before Pi-hole is touched.
  pre_tasks:
    - name: Check site.services
      ansible.builtin.include_role:
        name: caddy
        tasks_from: services.yml
        apply:
          tags: [always]
      tags: [always]

    - name: Check the dashboard fields of site.services
      ansible.builtin.include_role:
        name: homepage
        tasks_from: entries.yml
        apply:
          tags: [always]
      tags: [always]
  roles:
    - role: docker
      tags: [docker]
    - role: pihole
      tags: [pihole]
    # After pihole (its network and app password); before caddy, which joins its network.
    - role: homepage
      tags: [homepage]
    # After pihole: it joins Pi-hole's network and takes port 80 from its web UI.
    - role: caddy
      tags: [caddy]
    # After the services it lets in, so its checks can reach them.
    - role: host_firewall
      tags: [firewall]

# Vaultwarden on its own VM in the secrets enclave (no internet): Docker from Ubuntu's
# archive through the apt cache, the image through ragnarok, published on the VM's address
# where the enclave firewall lets only Caddy (apps) in; nightly encrypted backups to the
# Ceph S3 gateway.
- name: Vaultwarden
  hosts: vaultwarden_servers
  force_handlers: true
  roles:
    - role: docker
      tags: [docker]
    - role: vaultwarden
      tags: [vaultwarden]

# Single sign-on on the identity VM (Docker from the Docker play above): Authentik, compose
# project "authentik", published on the VM's lab address, where the gateway proxies
# auth.<gateway domain> to it.
- name: Identity workloads
  hosts: identity_servers
  force_handlers: true
  roles:
    - role: authentik
      tags: [authentik]

# Workload: the local language model (Ollama + Open WebUI, compose project "llm").
- name: LLM workloads
  hosts: llm_servers
  force_handlers: true
  roles:
    - role: llm
      tags: [llm]
