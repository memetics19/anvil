# Vaultwarden restore drill: the newest backup (copied to ~/homelab-backups by make backup)
# is restored into a temporary container on the vaultwarden VM (no network, no gateway route, no
# admin page), checked (/alive 200, users equal to the live database) and removed again.
# Run: make vaultwarden-drill
- name: Vaultwarden restore drill
  hosts: vaultwarden_servers
  pre_tasks:
    - name: Resolve the site dict once for this run
      ansible.builtin.import_tasks: tasks/site.yml
  tasks:
    - name: Restore the newest backup into a temporary container
      ansible.builtin.include_role:
        name: vaultwarden
        tasks_from: restore_drill.yml
