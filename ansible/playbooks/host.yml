- name: Proxmox host base configuration
  hosts: proxmox
  pre_tasks:
    - name: Resolve the site dict once for this run
      ansible.builtin.import_tasks: tasks/site.yml
      tags: [always]
  roles:
    # Debian's and Proxmox's apt repositories, by the node's release (docs/upgrade-pve9.md).
    - role: pve_repos
      tags: [repos]
    - pve_host
    # No msr module, no rpcbind (no NFS here), Debian security updates by themselves.
    - role: host_hardening
      tags: [host_hardening]
      vars: &node_hardening
        host_hardening_rpcbind_off: true
        host_hardening_auto_security_updates: true
    # Drop IPv4 TCP with IP options (CVE-2026-98432).
    - role: tcp_options_guard
      tags: [tcp_options_guard]
    # SSH by key only (root by key too: the nodes and Ansible use it).
    - role: ssh_hardening
      tags: [ssh_hardening]
    # Host metrics for the monitoring stack (docs/monitoring.md), on the host's lab address.
    - role: node_exporter
      tags: [node_exporter]
    # Disk health (SMART) for the monitoring stack (docs/monitoring.md, Disks).
    - role: smartctl_exporter
      tags: [smartctl_exporter]

# The other cluster members (site.cluster.members, provisioned machines reached at their
# static address as root, as in cluster.yml) get the TCP options guard too. Not pve_host:
# that one is the main host's configuration.
- name: The cluster members
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Add them
      tags: [always]
      run_once: true
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: cluster_members
        ansible_host: "{{ site.provision.machines[item].network.cidr | split('/') | first }}"
        ansible_user: root
      loop: "{{ site.cluster.members | default([]) }}"
      # Only the inventory of this run: nothing on a host changes.
      changed_when: false

- name: Cluster members' TCP options guard and SSH
  hosts: cluster_members
  roles:
    # Their apt repositories first: without them a member gets no Proxmox updates, and the
    # roles below install packages.
    - role: pve_repos
      tags: [repos]
    - role: host_hardening
      tags: [host_hardening]
      vars: *node_hardening
    # Drop IPv4 TCP with IP options (CVE-2026-98432).
    - role: tcp_options_guard
      tags: [tcp_options_guard]
    - role: ssh_hardening
      tags: [ssh_hardening]

# Disk health on the other members. The monitoring VM's scrapes reach them from the main
# host's home address (lab traffic to the home network is SNATed there). Their controller
# passes the disks through, so a scan finds each disk twice: as /dev/sdX and as
# /dev/bus/N;megaraid,M (labelled bus_N_megaraid_M). Only the first is kept.
- name: Cluster members' disk health
  hosts: cluster_members
  vars:
    smartctl_exporter_device_exclude: "^bus_"
    smartctl_exporter_allow:
      - "{{ hostvars[groups['proxmox'][0]].site.hosts.monitoring.ip }}"
      - "{{ hostvars[groups['proxmox'][0]].site.pve.uplink_ip }}"
  roles:
    - role: smartctl_exporter
      tags: [smartctl_exporter]

# Wazuh agents on the nodes (docs/services.md, Wazuh). The cluster members have no site dict
# of their own: the manager's address comes from the main host's.
- name: Wazuh agent, Proxmox host
  hosts: proxmox
  roles:
    - role: wazuh_agent
      tags: [wazuh_agent]

- name: Wazuh agent, cluster members
  hosts: cluster_members
  vars:
    wazuh_agent_manager: "{{ hostvars[groups['proxmox'][0]].site.hosts.wazuh.ip }}"
  roles:
    - role: wazuh_agent
      tags: [wazuh_agent]

# The cameras use the Proxmox host's home address as their gateway: everything they send
# beyond the home network is dropped here, except replies to Frigate and NTP
# (docs/services.md, Frigate).
- name: Camera egress guard
  hosts: proxmox
  roles:
    - role: camera_egress_guard
      tags: [camera_egress_guard]
