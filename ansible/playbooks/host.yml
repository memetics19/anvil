- name: Proxmox host base configuration
  hosts: proxmox
  pre_tasks:
    - name: Resolve the site dict once for this run
      ansible.builtin.import_tasks: tasks/site.yml
      tags: [always]
  roles:
    - pve_host
    # Host metrics for the monitoring stack (docs/monitoring.md), on the host's lab address.
    - role: node_exporter
      tags: [node_exporter]
