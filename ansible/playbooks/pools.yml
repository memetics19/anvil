# ZFS data pools on a provisioned Proxmox host (role zfs_pools): make pools HOST=<machine>.
# The host is an entry of site.provision.machines, reached at its static address as root.
# On the main host's inventory entry (implicit localhost has no inventory_dir, which the
# site dict lookup needs). These tasks do not connect to it.
- name: The machine
  hosts: proxmox
  gather_facts: false
  pre_tasks:
    - name: Resolve the site dict once for this run
      ansible.builtin.import_tasks: tasks/site.yml
      tags: [always]
  tasks:
    - name: A machine of site.provision.machines with a static address
      ansible.builtin.assert:
        that:
          - pools_host | default('') | length > 0
          - pools_host in (site.provision.machines | default({}))
          - site.provision.machines[pools_host].network.cidr is defined
        fail_msg: >-
          pools_host must name an entry of site.provision.machines with network.cidr
          (one of: {{ (site.provision.machines | default({})).keys() | join(', ') }})
        quiet: true

    - name: Add it
      run_once: true
      ansible.builtin.add_host:
        name: "{{ pools_host }}"
        groups: provisioned
        ansible_host: "{{ site.provision.machines[pools_host].network.cidr | split('/') | first }}"
        ansible_user: root

- name: ZFS data pools
  hosts: provisioned
  gather_facts: false
  pre_tasks:
    # Hosts added at run time have no inventory_dir for the site lookup: they take the dict
    # the first play resolved on the main host.
    - name: The site dict from the first play
      ansible.builtin.set_fact:
        site: "{{ hostvars[groups['proxmox'] | first].site }}"
      no_log: true
      tags: [always]
  roles:
    - role: zfs_pools
