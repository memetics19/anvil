# Pi-hole (DNS filtering for the home and lab networks) with Unbound as its only upstream,
# one compose project "pihole" in /opt/pihole on the apps VM.
pihole_dir: /opt/pihole
# Pinned by tag and digest (2026-10-21).
pihole_image: pihole/pihole:2026.10.0@sha256:d34134716fc32038b052a8674c7c6879e0ff21f0e6d8af345166fffa2c27c113
pihole_unbound_image: klutchell/unbound:1.26.1@sha256:9a3939ca33d6d3b42b81a70391bb8e43f0a08d2bd7a3fdffb43d427493345c36

# DNS (53 tcp/udp) and the web UI are published on these addresses only: the VM's lab and
# home-network addresses (site.hosts.<host>.ip / home_ip).
pihole_listen_ips:
  - "{{ site.hosts[inventory_hostname].ip }}"
  - "{{ site.hosts[inventory_hostname].home_ip }}"
pihole_web_port: 80
# The web UI is reached through the service gateway (role caddy, https://dns.<domain>),
# which shares the project's network; port 80 on the VM belongs to the gateway. true
# publishes it again on pihole_web_port (only with no gateway on this host).
pihole_web_published: false

# Unbound has a fixed address on the project's network (site values: a private subnet not
# used elsewhere); it is never published. Pi-hole forwards only to it. Unbound resolves
# recursively and validates DNSSEC.
pihole_dns_subnet: "{{ site.hosts[inventory_hostname].dns_subnet }}"
pihole_unbound_ip: "{{ site.hosts[inventory_hostname].dns_unbound_ip }}"
pihole_unbound_msg_cache: 16m
pihole_unbound_rrset_cache: 32m

pihole_tz: Asia/Kolkata
# Pi-hole's uid/gid inside the container and so the owner of its state on the host: not
# the image default 1000, which is the VM's first user.
pihole_uid: 10002

# Per-client limit: at most `count` queries per `interval` seconds (Pi-hole's dns.rateLimit).
# Docker publishes the ports with DNAT, so Pi-hole sees each client's own address.
pihole_rate_limit_count: 1000
pihole_rate_limit_interval: 60

# Local DNS records from site.dns.local_records (Vault): a list of {name, ref} or
# {name, ip}. `name` is a label under pihole_local_zone; `ref` is a dotted path into the
# site dict (e.g. hosts.vault.ip), so an address lives in one place only. The records sit
# in their own sub-zone so they never shadow a public hostname of the domain (Cloudflare
# tunnel names).
pihole_local_records: "{{ site.dns.local_records }}"
pihole_local_zone: "lan.{{ site.domain }}"
# Gateway names: every enabled entry of site.services is served as <name>.<domain> at the
# gateway's home address (records.yml adds them as fqdn records). For home clients this
# overrides a public name of the same label (a Cloudflare tunnel name), on purpose: the
# gateway serves the same app locally. Other names are untouched.
pihole_gateway_services: "{{ site.services | default([]) }}"
pihole_gateway_ref: "hosts.{{ inventory_hostname }}.home_ip"

# Blocklists the role keeps present and enabled. Lists added in the web UI are left alone
# (counted in the run output). A change runs a gravity update.
pihole_blocklists:
  - url: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    comment: StevenBlack unified hosts (Pi-hole default)
  - url: https://v.firebog.net/hosts/AdguardDNS.txt
    comment: AdGuard DNS filter (ads)
  - url: https://v.firebog.net/hosts/Easyprivacy.txt
    comment: EasyPrivacy (tracking)
  - url: https://v.firebog.net/hosts/Prigent-Crypto.txt
    comment: Prigent crypto (cryptojacking)
  - url: https://urlhaus.abuse.ch/downloads/hostfile/
    comment: URLhaus (malware)

# Hard caps, swap included. The apps VM is shared with Vaultwarden.
pihole_mem_limit: 384m
pihole_unbound_mem_limit: 128m

# Secret: Vault KV v2, mount kv. web_password is generated by this role straight into Vault.
pihole_vault_mount: kv
pihole_vault_path: "homelab/{{ inventory_hostname }}/pihole"
pihole_repo_scripts: "{{ playbook_dir }}/../../scripts"
