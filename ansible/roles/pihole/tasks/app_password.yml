# Pi-hole application password (webserver.api.app_pwhash) for the Homepage dashboard's
# Pi-hole widget: a second login, separate from the web password and without config
# rights (webserver.api.app_sudo stays false). Pi-hole makes it (GET /api/auth/app, one
# session opened with the web password and closed again); its hash is set live with
# pihole-FTL --config (no restart) and the password goes on stdin straight into Vault
# (kv/<pihole_vault_path>, key app_password). Every run checks that it still logs in; a
# missing or rejected one is replaced. Values never reach argv, the log or the screen.
- name: App password | key digests in Vault
  ansible.builtin.command:
    argv: ["{{ pihole_repo_scripts }}/vault-kv-digests.sh", "{{ pihole_vault_path }}"]
  delegate_to: localhost
  become: false
  register: pihole_app_vault
  changed_when: false
  check_mode: false

- name: App password | keys in Vault
  ansible.builtin.set_fact:
    pihole_app_keys: "{{ pihole_app_vault.stdout_lines | map('split', ' ') | map('first') | list }}"

- name: App password | read the passwords from Vault
  ansible.builtin.set_fact:
    pihole_app_secrets: >-
      {{ lookup('community.hashi_vault.vault_kv2_get', pihole_vault_path,
                engine_mount_point=pihole_vault_mount,
                url=lookup('env', 'VAULT_ADDR'),
                token=lookup('env', 'VAULT_TOKEN'),
                ca_cert=lookup('env', 'VAULT_CACERT')).secret }}
  no_log: true
  when: "'web_password' in pihole_app_keys"

# Exit 0: it logs in (the test session is closed again); 1: Pi-hole rejects it (HTTP 401);
# 3: no usable answer (no response, busy, rate limited), which stops the run instead of
# replacing a password that may be fine.
- name: App password | does the stored one log in
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - pihole
      - sh
      - -c
      - |
        set -u
        IFS= read -r pw || exit 2
        out=$(printf '%s' "$pw" | jq -Rc '{password: .}' |
          curl -s --max-time 10 -w '\n%{http_code}' -X POST -H 'Content-Type: application/json' \
            --data-binary @- http://127.0.0.1/api/auth)
        code=$(printf '%s\n' "$out" | tail -n 1)
        sid=$(printf '%s\n' "$out" | sed '$d' | jq -r '.session.sid // empty' 2>/dev/null)
        if [ "$code" = 200 ] && [ -n "$sid" ]; then
          printf 'X-FTL-SID: %s\n' "$sid" | curl -s --max-time 10 -o /dev/null -X DELETE -H @- http://127.0.0.1/api/auth
          exit 0
        fi
        [ "$code" = 401 ] && exit 1
        echo "Pi-hole API login check: HTTP ${code:-none}" >&2
        exit 3
    stdin: "{{ pihole_app_secrets.app_password }}"
  register: pihole_app_login
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when: "'app_password' in pihole_app_keys"

- name: App password | the check got an answer (accepted or rejected)
  ansible.builtin.assert:
    that: pihole_app_login.rc in [0, 1]
    fail_msg: >-
      Pi-hole's API gave no usable answer to the application password check
      ({{ pihole_app_login.stderr | default('') | regex_search('HTTP [0-9a-z]+') | default('no response', true) }},
      rc {{ pihole_app_login.rc }}); not replacing it. Check that Pi-hole is up and not busy, then rerun.
    quiet: true
  when: pihole_app_login is not skipped

- name: App password | make a new one
  ansible.builtin.set_fact:
    pihole_app_new: "{{ 'app_password' not in pihole_app_keys or pihole_app_login.rc | default(1) != 0 }}"

- name: App password | to make
  ansible.builtin.debug:
    msg: "pihole: make the application password (Homepage widget) and store it in Vault"
  changed_when: true
  when: pihole_app_new | bool and ansible_check_mode

- name: App password | make it and store it
  when: pihole_app_new | bool and not ansible_check_mode
  block:
    # stdin: the web password; stdout: the new application password only.
    - name: App password | let Pi-hole make one and set its hash
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -i
          - pihole
          - sh
          - -c
          - |
            set -u
            IFS= read -r pw || exit 2
            sid=$(printf '%s' "$pw" | jq -Rc '{password: .}' |
              curl -s -X POST -H 'Content-Type: application/json' --data-binary @- http://127.0.0.1/api/auth |
              jq -r '.session.sid // empty')
            [ -n "$sid" ] || { echo "web password login failed" >&2; exit 3; }
            out=$(printf 'X-FTL-SID: %s\n' "$sid" | curl -s -H @- http://127.0.0.1/api/auth/app)
            printf 'X-FTL-SID: %s\n' "$sid" | curl -s -o /dev/null -X DELETE -H @- http://127.0.0.1/api/auth
            hash=$(printf '%s' "$out" | jq -r '.app.hash // empty')
            app=$(printf '%s' "$out" | jq -r '.app.password // empty')
            [ -n "$hash" ] && [ -n "$app" ] || { echo "no application password returned" >&2; exit 4; }
            pihole-FTL --config webserver.api.app_pwhash "$hash" >/dev/null || exit 5
            printf '%s' "$app"
        stdin: "{{ pihole_app_secrets.web_password }}"
      register: pihole_app_made
      changed_when: true
      no_log: true

    - name: App password | into Vault (stdin)
      ansible.builtin.command:
        argv: [vault, kv, patch, "-mount={{ pihole_vault_mount }}", "{{ pihole_vault_path }}", "-"]
        stdin: "{{ {'app_password': pihole_app_made.stdout} | to_json }}"
      delegate_to: localhost
      become: false
      changed_when: true
      no_log: true

    - name: App password | read the digest back
      ansible.builtin.command:
        argv: ["{{ pihole_repo_scripts }}/vault-kv-digests.sh", "{{ pihole_vault_path }}"]
      delegate_to: localhost
      become: false
      register: pihole_app_vault_after
      changed_when: false

    - name: App password | Vault holds it
      ansible.builtin.assert:
        that: >-
          (dict(pihole_app_vault_after.stdout_lines | map('split', ' '))).app_password | default('')
          == pihole_app_made.stdout | hash('sha256')
        fail_msg: "kv/{{ pihole_vault_path }}: app_password read back differs (digest check)"
        quiet: true

    - name: App password | the new one logs in
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -i
          - pihole
          - sh
          - -c
          - |
            IFS= read -r pw || exit 2
            sid=$(printf '%s' "$pw" | jq -Rc '{password: .}' |
              curl -s -X POST -H 'Content-Type: application/json' --data-binary @- http://127.0.0.1/api/auth |
              jq -r '.session.sid // empty')
            [ -n "$sid" ] || exit 1
            printf 'X-FTL-SID: %s\n' "$sid" | curl -s -o /dev/null -X DELETE -H @- http://127.0.0.1/api/auth
        stdin: "{{ pihole_app_made.stdout }}"
      changed_when: false
      no_log: true
