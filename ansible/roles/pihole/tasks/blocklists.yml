# Blocklists live in Pi-hole's gravity database, not in its config file. The role keeps
# pihole_blocklists present and enabled (type 0 = block list), switches off the ones in
# pihole_blocklists_retired, and runs a gravity update when it changed one, or when one has
# never been downloaded (an interrupted run).
# Lists added in the web UI are left alone and only counted. The container's own weekly
# job refreshes the lists after that.
- name: Block lists in gravity (address|enabled|downloaded)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - pihole
      - pihole-FTL
      - sqlite3
      - -separator
      - "|"
      - /etc/pihole/gravity.db
      - SELECT address, enabled, date_updated IS NOT NULL FROM adlist WHERE type = 0
  register: pihole_adlist_now
  changed_when: false
  check_mode: false

- name: Work out which lists to add or enable
  ansible.builtin.set_fact:
    pihole_adlist: >-
      {%- set have = {} -%}
      {%- for l in pihole_adlist_now.stdout_lines if l.split('|') | length == 3 -%}
      {%- set f = l.split('|') -%}
      {%- set _ = have.update({f[0]: {'enabled': f[1] == '1', 'downloaded': f[2] == '1'}}) -%}
      {%- endfor -%}
      {%- set want = pihole_blocklists | map(attribute='url') | list -%}
      {{ {'fix': pihole_blocklists | rejectattr('url', 'in', have | dict2items | selectattr('value.enabled') | map(attribute='key') | list) | list,
          'never_downloaded': want | select('in', have | dict2items | rejectattr('value.downloaded') | map(attribute='key') | list) | list,
          'retire': pihole_blocklists_retired | select('in', have | dict2items | selectattr('value.enabled') | map(attribute='key') | list) | list,
          'unmanaged': have | dict2items | rejectattr('key', 'in', want + pihole_blocklists_retired) | list | length} }}

- name: Report the block lists
  ansible.builtin.debug:
    msg: >-
      block lists: {{ pihole_blocklists | length }} managed, add or enable {{ pihole_adlist.fix | length }}{{
      ', switch off ' ~ pihole_adlist.retire | length ~ ' retired' if pihole_adlist.retire else '' }}{{
      ', ' ~ pihole_adlist.never_downloaded | length ~ ' never downloaded' if pihole_adlist.never_downloaded else '' }}{{
      '; ' ~ pihole_adlist.unmanaged ~ ' added by hand (left alone)' if pihole_adlist.unmanaged else '' }}

# Check mode skips the commands below, so it reports their change here instead: anvil check
# and apply see it.
- name: Would change the block lists
  ansible.builtin.debug:
    msg: "would add or enable {{ pihole_adlist.fix | length }}, switch off {{ pihole_adlist.retire | length }}, then update gravity"
  changed_when: true
  when: ansible_check_mode and (pihole_adlist.fix | length > 0 or pihole_adlist.retire | length > 0)

- name: Add or enable the managed lists
  ansible.builtin.command:
    argv: [docker, exec, -i, pihole, pihole-FTL, sqlite3, /etc/pihole/gravity.db]
    stdin: |
      {% for l in pihole_adlist.fix %}
      INSERT INTO adlist (address, enabled, comment, type)
        VALUES ('{{ l.url | replace("'", "''") }}', 1, '{{ l.comment | replace("'", "''") }}', 0)
        ON CONFLICT(address, type) DO UPDATE SET enabled = 1;
      {% endfor %}
  changed_when: true
  when: pihole_adlist.fix | length > 0

- name: Switch off the retired lists
  ansible.builtin.command:
    argv: [docker, exec, -i, pihole, pihole-FTL, sqlite3, /etc/pihole/gravity.db]
    stdin: |
      {% for u in pihole_adlist.retire %}
      UPDATE adlist SET enabled = 0 WHERE type = 0 AND address = '{{ u | replace("'", "''") }}';
      {% endfor %}
  changed_when: true
  when: pihole_adlist.retire | length > 0

# Downloads every list and rebuilds the gravity table; FTL reloads it.
- name: Gravity update
  ansible.builtin.command:
    argv: [docker, exec, pihole, pihole, -g]
  register: pihole_gravity
  changed_when: true
  when: pihole_adlist.fix | length > 0 or pihole_adlist.never_downloaded | length > 0 or pihole_adlist.retire | length > 0

- name: Gravity holds domains
  ansible.builtin.command:
    argv: [docker, exec, pihole, pihole-FTL, sqlite3, /etc/pihole/gravity.db, SELECT COUNT(*) FROM gravity]
  register: pihole_gravity_count
  changed_when: false
  check_mode: false
  failed_when: pihole_gravity_count.rc != 0 or (pihole_gravity_count.stdout | int) == 0

# --- deny regexes (domainlist, type 3) -------------------------------------------------------
- name: Deny regexes in gravity (domain|enabled)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - pihole
      - pihole-FTL
      - sqlite3
      - /etc/pihole/gravity.db
      - SELECT domain, enabled FROM domainlist WHERE type = 3
  register: pihole_regex_now
  changed_when: false
  check_mode: false

- name: Work out which deny regexes to add or enable
  ansible.builtin.set_fact:
    pihole_regex_fix: >-
      {%- set have = {} -%}
      {%- for l in pihole_regex_now.stdout_lines if '|' in l -%}
      {%-   set _ = have.update({l.rsplit('|', 1)[0]: l.rsplit('|', 1)[1] == '1'}) -%}
      {%- endfor -%}
      {{ pihole_deny_regex | rejectattr('regex', 'in', have | dict2items | selectattr('value') | map(attribute='key') | list) | list }}
    pihole_regex_unmanaged: >-
      {{ pihole_regex_now.stdout_lines | map('regex_replace', '\|[01]$', '')
         | reject('in', pihole_deny_regex | map(attribute='regex') | list) | list | length }}

- name: Report the deny regexes
  ansible.builtin.debug:
    msg: >-
      deny regexes: {{ pihole_deny_regex | length }} managed, add or enable {{ pihole_regex_fix | length }}{{
      '; ' ~ pihole_regex_unmanaged ~ ' added by hand (left alone)' if pihole_regex_unmanaged | int > 0 else '' }}

- name: Add or enable the managed deny regexes
  ansible.builtin.command:
    argv: [docker, exec, -i, pihole, pihole-FTL, sqlite3, /etc/pihole/gravity.db]
    stdin: |
      {% for r in pihole_regex_fix %}
      INSERT INTO domainlist (type, domain, enabled, comment)
        VALUES (3, '{{ r.regex | replace("'", "''") }}', 1, '{{ r.comment | replace("'", "''") }}')
        ON CONFLICT(domain, type) DO UPDATE SET enabled = 1;
      {% endfor %}
  changed_when: true
  when: pihole_regex_fix | length > 0

# FTL reads the domain list on a reload, without a gravity update.
- name: Reload Pi-hole's lists
  ansible.builtin.command:
    argv: [docker, exec, pihole, pihole, reloadlists]
  changed_when: true
  when: pihole_regex_fix | length > 0 and pihole_adlist.fix | length == 0
