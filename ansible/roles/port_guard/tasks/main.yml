# The guard is checked with nft -c before it is loaded, and it can only drop new connections
# to its own ports, so it cannot cut SSH or this VM's other services off.
- name: The ports and sources are plain values
  ansible.builtin.assert:
    that:
      - port_guard_ports | map('string') | reject('match', '^[0-9]{1,5}$') | list | length == 0
      - port_guard_sources | reject('match', '^([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?$') | list | length == 0
      - port_guard_address is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
    fail_msg: "port_guard: ports are numbers, sources and the address IPv4 (a.b.c.d or a.b.c.d/n)"
    quiet: true

- name: Guard on
  when: port_guard_ports | length > 0
  block:
    - name: Config directory
      ansible.builtin.file:
        path: "{{ port_guard_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      register: port_guard_dir

    - name: Render and check the guard in a staging directory
      block:
        - name: Staging directory
          ansible.builtin.tempfile:
            state: directory
            prefix: port-guard.
          register: port_guard_stage
          changed_when: false
          check_mode: false

        - name: Render the guard
          ansible.builtin.template:
            src: port-guard.nft.j2
            dest: "{{ port_guard_stage.path }}/port-guard.nft"
            owner: root
            group: root
            mode: "0644"
          changed_when: false
          check_mode: false

        - name: The guard parses (nft -c)
          ansible.builtin.command:
            argv: [nft, -c, -f, "{{ port_guard_stage.path }}/port-guard.nft"]
          changed_when: false
          check_mode: false

        - name: Install the guard
          ansible.builtin.copy:
            src: "{{ port_guard_stage.path }}/port-guard.nft"
            dest: "{{ port_guard_file }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          register: port_guard_installed
          # In check mode on a new host the directory is not there yet.
          when: not (ansible_check_mode and port_guard_dir is changed)
      always:
        - name: Remove the staging directory
          ansible.builtin.file:
            path: "{{ port_guard_stage.path }}"
            state: absent
          changed_when: false
          check_mode: false
          when: port_guard_stage.path is defined

    - name: Boot unit
      ansible.builtin.template:
        src: port-guard.service.j2
        dest: /etc/systemd/system/port-guard.service
        owner: root
        group: root
        mode: "0644"
      register: port_guard_unit

    - name: Enable the unit
      ansible.builtin.systemd_service:
        name: port-guard
        enabled: true
        daemon_reload: "{{ port_guard_unit is changed }}"
      when: not (ansible_check_mode and port_guard_unit is changed)

    - name: Is the guard loaded
      ansible.builtin.command:
        argv: [nft, list, table, inet, "{{ port_guard_table }}"]
      register: port_guard_loaded
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Load the guard (one transaction)
      ansible.builtin.command:
        argv: [nft, -f, "{{ port_guard_file }}"]
      changed_when: true
      when: not ansible_check_mode and (port_guard_installed is changed or port_guard_loaded.rc != 0)

    # The gateway still reaches every guarded port.
    - name: The gateway reaches the guarded ports
      ansible.builtin.wait_for:
        host: "{{ port_guard_address }}"
        port: "{{ item }}"
        timeout: 10
      loop: "{{ port_guard_ports }}"
      delegate_to: "{{ port_guard_gateway_host }}"
      when: not ansible_check_mode

- name: Guard off
  when: port_guard_ports | length == 0
  block:
    - name: Is a guard loaded
      ansible.builtin.command:
        argv: [nft, list, table, inet, "{{ port_guard_table }}"]
      register: port_guard_off_loaded
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Unload it
      ansible.builtin.command:
        argv: [nft, delete, table, inet, "{{ port_guard_table }}"]
      changed_when: true
      when: port_guard_off_loaded.rc == 0 and not ansible_check_mode

    - name: Is its unit there
      ansible.builtin.stat:
        path: /etc/systemd/system/port-guard.service
      register: port_guard_off_unit

    - name: Disable its unit
      ansible.builtin.systemd_service:
        name: port-guard
        enabled: false
      when: port_guard_off_unit.stat.exists

    - name: Remove its files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/etc/systemd/system/port-guard.service, "{{ port_guard_file }}"]
