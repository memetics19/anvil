# Authentik (single sign-on) on the identity VM: its own compose project "authentik" in
# /opt/authentik, with the server, the worker and Postgres. Reached only through the
# gateway, at auth.<gateway domain> on the LAN and the VPN. Nothing public.
# Authentik needs no Redis since 2025.10: its cache, task queue and websockets use Postgres.
authentik_dir: /opt/authentik
# Pinned by tag and digest (2026-10-29): the current stable release, and the Postgres major
# its compose file documents (postgres:16-alpine).
authentik_image: ghcr.io/goauthentik/server:2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
authentik_postgres_image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
authentik_port: 9000
# Published on the VM's lab address only: the gateway proxies auth.<domain> to it.
authentik_bind_ip: "{{ site.hosts[inventory_hostname].ip }}"
# The gateway's VM. Authentik trusts X-Forwarded-For and X-Forwarded-Proto only from its lab
# address, so it logs the real client and knows the page was opened over https.
authentik_gateway_host: apps
authentik_trusted_proxies: ["{{ site.hosts[authentik_gateway_host].ip }}/32"]
# Hard caps, swap included. Together 2 GB of the VM's 3 GB, which leaves room for the OS,
# Docker, the Pulse agent and the LDAP outpost that comes later.
authentik_server_mem_limit: 1024m
authentik_worker_mem_limit: 768m
authentik_postgres_mem_limit: 256m
# The akadmin account's email, set on the first start only. A site value, never a real
# address in the repo.
authentik_bootstrap_email: "{{ site.email }}"
# Secrets: Vault KV v2. secret_key (cookie and token signing), postgres_password,
# bootstrap_password (the first password of akadmin), bootstrap_token (an API token for
# akadmin, for configuring Authentik from code) and proxmox_client_secret (the Proxmox
# realm's OpenID Connect client) are generated by this role, straight into Vault, and never
# replaced.
authentik_vault_mount: kv
authentik_vault_path: "homelab/{{ inventory_hostname }}/authentik"
authentik_secret_keys: [secret_key, postgres_password, bootstrap_password, bootstrap_token, proxmox_client_secret]
authentik_repo_scripts: "{{ playbook_dir }}/../../scripts"

# --- single sign-on --------------------------------------------------------------------------
# templates/anvil-sso.yaml.j2, a blueprint in <authentik_dir>/blueprints (the worker's
# /blueprints/anvil): the group whose members may open every app, the gateway's forward auth
# (one proxy provider in domain mode, served by the embedded outpost) and the Proxmox client.
# Nobody is put in the group by code: add your own user to it.
authentik_sso_group: lab-admins
# Every login needs a second factor (TOTP, WebAuthn or a recovery code). configure: a user
# without one sets it up at the next login. skip: Authentik's default, no second factor
# needed. deny: a user without one cannot log in.
authentik_mfa_not_configured_action: configure
# Authentik's own gateway name (site.services) and the address browsers use.
authentik_auth_name: auth
authentik_external_url: "https://{{ authentik_auth_name }}.{{ gateway_domain }}"
# The Proxmox client: its id, and the gateway names of the Proxmox web UIs (the enabled
# site.services entries on port 8006), the only redirects it accepts. None: no client.
authentik_proxmox_client_id: proxmox
authentik_proxmox_names: >-
  {%- set out = [] -%}
  {%- for s in site.services | default([])
      if s.enabled | default(true) | bool and s.port | default('') | string == '8006' -%}
  {%- set _ = out.append(s.name | string) -%}
  {%- endfor -%}
  {{ out }}

# The Ceph dashboard (SAML 2.0, app slug ceph): its gateway name in site.services. The
# dashboard side is role pve_sso. Not in site.services: no Ceph app.
authentik_ceph_name: ceph
authentik_ceph_enabled: >-
  {%- set ns = namespace(on=false) -%}
  {%- for e in site.services | default([]) if e.name | default('') == authentik_ceph_name -%}
  {%- set ns.on = e.enabled | default(true) | bool -%}
  {%- endfor -%}
  {{ ns.on }}
authentik_ceph_url: "https://{{ authentik_ceph_name }}.{{ gateway_domain }}"

# App tiles in Authentik's library (My applications): one link per site.services entry,
# for members of the SSO group, with the title, group, icon and description of Homepage's
# catalog (role homepage, homepage_catalog). Not Authentik itself, and not the Proxmox name
# the Proxmox app already opens. A disabled entry's tile is removed.
authentik_tiles_skip: ["{{ authentik_auth_name }}", "{{ authentik_ceph_name }}"]
authentik_tiles_catalog: >-
  {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../roles/homepage/defaults/main.yml')
      | from_yaml).homepage_catalog | combine(authentik_tiles_extra) }}
# Names Homepage's catalog leaves out (the dashboard itself).
authentik_tiles_extra:
  home: {title: Homepage, group: Home, icon: homepage.png, description: Dashboard}
# Icons named <name>.png in the catalog come from the dashboard-icons set, as on Homepage.
authentik_tiles_icon_base: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/

# --- backups ---------------------------------------------------------------------------------
# A systemd timer runs authentik-backup nightly: pg_dump of Authentik's database (users,
# groups, applications, tokens, the whole configuration) streamed into age, encrypted to the
# operator's backup recipient, uploaded to the Ceph S3 bucket below, keeping the newest
# authentik_backup_keep of the objects it wrote. `make backup` copies the newest to
# ~/homelab-backups. The data volume (uploaded icons) is not backed up.
authentik_backup_bucket: authentik-backups
authentik_backup_keep: 14
authentik_backup_calendar: "*-*-* 03:45:00"
authentik_backup_etc: /etc/authentik-backup
authentik_backup_packages: [age, rclone]
authentik_backup_container: authentik-db
# The RGW user's keys (made by `make ceph`, ceph_single tasks/authentik.yml).
authentik_backup_vault_path: homelab/identity/authentik-backup
authentik_backup_endpoint: "http://{{ site.pve.ip }}:7480"
# The public key the tfstate and Vaultwarden backups use (Keychain backup-age-recipient on
# the controller, scripts/backup-key-init.sh): only the operator's identity can read a
# backup, and the VM holds nothing that can decrypt one.
authentik_backup_age_recipient: >-
  {{ lookup('ansible.builtin.pipe',
            'security find-generic-password -s homelab -a backup-age-recipient -w 2>/dev/null || true') }}
