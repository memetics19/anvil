- name: Cloudflare apt signing key
  ansible.builtin.get_url:
    url: "{{ cloudflared_apt_key_url }}"
    dest: "{{ cloudflared_apt_keyring }}"
    checksum: "sha256:{{ cloudflared_gpg_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Cloudflare apt repository
  ansible.builtin.template:
    src: cloudflared.list.j2
    dest: /etc/apt/sources.list.d/cloudflared.list
    owner: root
    group: root
    mode: "0644"
  notify: Update apt cache

- name: Refresh apt cache before installing
  ansible.builtin.meta: flush_handlers

# Held at cloudflared_version: release the hold, install that version (an upgrade or a
# downgrade), hold it again. A changed package restarts the connector below.
- name: Installed cloudflared version
  ansible.builtin.command:
    argv: [dpkg-query, -W, -f, "${Version}", cloudflared]
  register: cloudflared_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install cloudflared {{ cloudflared_version }}
  when: cloudflared_installed.stdout | default('') != cloudflared_version
  block:
    - name: Release the hold
      ansible.builtin.dpkg_selections:
        name: cloudflared
        selection: install
      when: cloudflared_installed.rc == 0

    - name: Install the pinned version
      ansible.builtin.apt:
        name: "cloudflared={{ cloudflared_version }}"
        state: present
        allow_downgrade: true
      notify: Restart cloudflared

- name: Hold cloudflared at its version
  ansible.builtin.dpkg_selections:
    name: cloudflared
    selection: hold
  when: not (ansible_check_mode and cloudflared_installed.rc != 0)

# The token is never logged or diffed: every task that holds it has no_log.
- name: Read the tunnel token from Vault
  ansible.builtin.set_fact:
    cloudflared_token: >-
      {{ (lookup('community.hashi_vault.vault_kv2_get', cloudflared_vault_path,
                 engine_mount_point=cloudflared_vault_mount,
                 url=lookup('env', 'VAULT_ADDR'),
                 token=lookup('env', 'VAULT_TOKEN'),
                 ca_cert=lookup('env', 'VAULT_CACERT')).secret)[cloudflared_vault_key] }}
  no_log: true

- name: The tunnel token is present
  ansible.builtin.assert:
    that: cloudflared_token | length > 0
    fail_msg: "{{ cloudflared_vault_mount }}/{{ cloudflared_vault_path }} has no {{ cloudflared_vault_key }}"
    quiet: true
  no_log: true

- name: Token directory (root only)
  ansible.builtin.file:
    path: "{{ cloudflared_token_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Token file (root only)
  ansible.builtin.copy:
    content: "{{ cloudflared_token }}"
    dest: "{{ cloudflared_token_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart cloudflared

- name: Render the unit
  ansible.builtin.set_fact:
    cloudflared_unit: "{{ lookup('ansible.builtin.template', 'cloudflared.service.j2') }}"
  no_log: true

- name: Read the installed unit
  ansible.builtin.stat:
    path: "{{ cloudflared_unit_path }}"
    checksum_algorithm: sha256
  register: cloudflared_unit_stat

# Content and mode are handled apart: tightening the mode alone must not restart the tunnel.
# The unit used to hold the token, so it stays 0600.
- name: Unit content (token from Vault)
  ansible.builtin.copy:
    content: "{{ cloudflared_unit }}"
    dest: "{{ cloudflared_unit_path }}"
    owner: root
    group: root
    mode: "0600"
  when: >-
    not cloudflared_unit_stat.stat.exists
    or cloudflared_unit_stat.stat.checksum != (cloudflared_unit | hash('sha256'))
  no_log: true
  diff: false
  notify:
    - Reload systemd
    - Restart cloudflared

- name: Unit file mode
  ansible.builtin.file:
    path: "{{ cloudflared_unit_path }}"
    owner: root
    group: root
    mode: "0600"
  when: cloudflared_unit_stat.stat.exists or not ansible_check_mode

- name: Apply unit changes before starting
  ansible.builtin.meta: flush_handlers

- name: Cloudflared running and enabled
  ansible.builtin.systemd_service:
    name: cloudflared
    enabled: true
    state: started

- name: Apply a new package or token
  ansible.builtin.meta: flush_handlers

# The play runs one VM at a time and stops on a failure: the next connector is touched
# only once this one is connected again.
- name: The connector is ready at Cloudflare's edge
  ansible.builtin.uri:
    url: "http://{{ cloudflared_metrics }}/ready"
  register: cloudflared_ready
  retries: 30
  delay: 2
  until: cloudflared_ready.status == 200
  when: not ansible_check_mode

- name: The running connector is the pinned version
  ansible.builtin.command:
    argv: [cloudflared, --version]
  register: cloudflared_running
  changed_when: false
  failed_when: cloudflared_version not in cloudflared_running.stdout
  check_mode: false
  when: not (ansible_check_mode and cloudflared_installed.stdout | default('') != cloudflared_version)
