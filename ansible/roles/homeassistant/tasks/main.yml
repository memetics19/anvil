- name: Config folder
  ansible.builtin.file:
    path: "{{ homeassistant_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Read the Gotify token from Vault (for code-defined notifications)
  ansible.builtin.set_fact:
    homeassistant_gotify_token: >-
      {{ (lookup('community.hashi_vault.vault_kv2_get', 'homelab/frigate/frigate-notify',
                 engine_mount_point='kv', url=lookup('env', 'VAULT_ADDR'),
                 token=lookup('env', 'VAULT_TOKEN'), ca_cert=lookup('env', 'VAULT_CACERT')).secret
         ).gotify_token | default('') }}
  no_log: true

- name: Secrets for code-defined config (referenced with !secret)
  ansible.builtin.template:
    src: secrets.yaml.j2
    dest: "{{ homeassistant_config_dir }}/secrets.yaml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart homeassistant

- name: Our managed config (the UI writes its own state under .storage, which we never touch)
  ansible.builtin.template:
    src: configuration.yaml.j2
    dest: "{{ homeassistant_config_dir }}/configuration.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart homeassistant

- name: The include files exist (HA needs them, and leaves them for UI-authored automations)
  ansible.builtin.copy:
    content: "[]\n"
    dest: "{{ homeassistant_config_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
    force: false
  loop:
    - automations.yaml
    - scripts.yaml
    - scenes.yaml

- name: Is the Switchy integration on the operator's machine
  ansible.builtin.stat:
    path: "{{ homeassistant_switchy_src }}/manifest.json"
  delegate_to: localhost
  become: false
  register: homeassistant_switchy_src_stat

- name: Install the Switchy custom integration
  ansible.builtin.copy:
    src: "{{ homeassistant_switchy_src }}/"
    dest: "{{ homeassistant_config_dir }}/custom_components/switchy/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  when: homeassistant_switchy_src_stat.stat.exists
  notify: Restart homeassistant

- name: The packages folder (code-defined config, rebuilt from anvil)
  ansible.builtin.file:
    path: "{{ homeassistant_config_dir }}/packages"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Code-defined automations (a Home Assistant package)
  ansible.builtin.copy:
    src: packages/anvil_automations.yaml
    dest: "{{ homeassistant_config_dir }}/packages/anvil_automations.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart homeassistant

- name: Intrusion alert (Frigate front door -> Gotify, a Home Assistant package)
  ansible.builtin.copy:
    src: packages/intrusion.yaml
    dest: "{{ homeassistant_config_dir }}/packages/intrusion.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart homeassistant

- name: The dashboards folder
  ansible.builtin.file:
    path: "{{ homeassistant_config_dir }}/dashboards"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Code-defined dashboard (the informational pane)
  ansible.builtin.copy:
    src: dashboards/anvil_home.yaml
    dest: "{{ homeassistant_config_dir }}/dashboards/anvil_home.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart homeassistant

- name: Home Assistant compose project
  ansible.builtin.include_role:
    name: compose_project
  vars:
    compose_project_dir: "{{ homeassistant_dir }}"
    compose_project_content: "{{ lookup('ansible.builtin.template', 'docker-compose.yaml.j2') }}"

- name: Apply a config change now
  ansible.builtin.meta: flush_handlers
