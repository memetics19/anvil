# Whole disk that becomes the only OSD, as a /dev/disk/by-id/ path. The playbook sets
# ceph_osd_device (Vault site.pve.ceph_osd_disk_id, else Keychain ceph-osd-disk-id).
ceph_single_osd_device: "{{ ceph_osd_device }}"
# Ceph node / mon / mgr id: the Proxmox node name.
ceph_single_node: "{{ ansible_facts['hostname'] }}"
ceph_single_network: "{{ site.lan_cidr }}"
ceph_single_conf: /etc/pve/ceph.conf
# Ceph release for pveceph install (empty = the default this PVE version offers). Only the
# first run installs, so this must be right before then.
ceph_single_release: squid

# Settings for a one-disk cluster, written to [global] before the first monitor exists.
ceph_single_global_settings:
  osd_pool_default_size: "1"
  osd_pool_default_min_size: "1"
  mon_allow_pool_size_one: "true"
  osd_crush_chooseleaf_type: "0"
  osd_pool_default_pg_num: "8"
  # 2 GiB per OSD: the host's RAM is mostly for VMs.
  osd_memory_target: "2147483648"
  # Daemons advertise the host address, never the gateway alias on the same bridge.
  public_addr: "{{ site.pve.ip }}"

ceph_single_rgw_id: "{{ ceph_single_node }}"
ceph_single_rgw_port: 7480
ceph_single_rgw_address: "{{ site.pve.ip }}"
ceph_single_rgw_keyring: /var/lib/ceph/radosgw/ceph-rgw.{{ ceph_single_rgw_id }}/keyring
ceph_single_rgw_endpoint: http://{{ ceph_single_rgw_address }}:{{ ceph_single_rgw_port }}

ceph_single_s3_user: terraform
ceph_single_s3_bucket: tfstate
# Root-only file on the host holding the S3 user's keys; the operator copies them into
# the Keychain (README: "Ceph S3 keys").
ceph_single_s3_keys_file: /root/.ceph-rgw-terraform.json

# Read-only S3 user for Filestash on ragnarok (tasks/filestash.yml): read access to these
# buckets through bucket policies; its keys go straight into Vault at this kv path.
ceph_single_filestash_user: filestash
ceph_single_filestash_buckets:
  - "{{ ceph_single_s3_bucket }}"
ceph_single_filestash_vault_path: homelab/ragnarok/filestash
# Repo scripts run on the controller (vault-kv-digests.sh).
ceph_single_repo_scripts: "{{ playbook_dir }}/../../scripts"

ceph_single_dash_address: "{{ site.pve.ip }}"
ceph_single_dash_port: 8443
ceph_single_dash_user: admin
# Root-only file on the host holding the dashboard password; the operator copies it into
# the Keychain (README: "Ceph dashboard").
ceph_single_dash_password_file: /root/.ceph-dashboard-admin
ceph_single_dash_rgw_user: dashboard

# One OSD: let the autoscaler size every pool to fit it (the RGW pools start at 32/128 PGs).
ceph_single_pg_settings:
  mon_target_pg_per_osd: "100"
  osd_pool_default_pg_autoscale_mode: "on"
