- name: Safety checks on the OSD disk (before any change)
  ansible.builtin.import_tasks: safety.yml
  tags: [always]

- name: Ceph cluster, monitor, manager and OSD
  ansible.builtin.import_tasks: cluster.yml
  tags: [ceph]

- name: RADOS Gateway, S3 user and bucket
  ansible.builtin.import_tasks: rgw.yml
  tags: [rgw]

- name: Read-only S3 user and bucket policies for Filestash
  ansible.builtin.import_tasks: filestash.yml
  tags: [rgw]

- name: Ceph dashboard
  ansible.builtin.import_tasks: dashboard.yml
  tags: [dashboard]

- name: Placement-group autoscaling for a one-OSD cluster
  ansible.builtin.import_tasks: pgs.yml
  tags: [ceph, pgs]
