# IPTV EPG web on ragnarok: compose project "iptv-epg", nginx serving ./output on port 8899.
# The iptv role's guide grabber (systemd timer iptv-epg-grab) writes ./output/guide.xml,
# which Threadfin reads. The service itself is kept as it runs today.
iptv_epg_dir: /home/ubuntu/iptv-epg
iptv_epg_port: 8899
