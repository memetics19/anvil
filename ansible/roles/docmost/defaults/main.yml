# Docmost (wiki) on frigate: its own compose project "docmost" in /opt/docmost, with its
# Postgres and Redis. Reached only through the gateway, at wiki.<gateway domain> on the LAN
# and the VPN. Nothing public. Uploads use the local storage driver (the "storage" volume).
docmost_dir: /opt/docmost
docmost_image: docmost/docmost:0.96.0@sha256:b56947fcfd08aab8fae12a377e1792784786adbf8b96e4281f14ef4fc072685a
docmost_postgres_image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
docmost_redis_image: redis:8.10.2-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
docmost_port: 3000
# Published on the VM's lab address only: the gateway proxies wiki.<domain> to it.
docmost_bind_ip: "{{ site.hosts[inventory_hostname].ip }}"
# The address people open. Docmost builds links and the collaboration socket from it.
docmost_url: "https://wiki.{{ gateway_domain }}"
# Hard caps, swap included, so the wiki never pushes the camera VM into swap.
docmost_mem_limit: 768m
docmost_postgres_mem_limit: 256m
docmost_redis_mem_limit: 96m
# Secrets: Vault KV v2. app_secret (session signing) and db_password are generated by this
# role, straight into Vault.
docmost_vault_mount: kv
docmost_vault_path: "homelab/{{ inventory_hostname }}/docmost"
docmost_repo_scripts: "{{ playbook_dir }}/../../scripts"
