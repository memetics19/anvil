# OpenCanary, the tripwire (docs/services.md, Tripwire). Nothing legitimate talks to this VM,
# so every connection, login attempt and port scan is an alarm, sent to ntfy at once.
# Installed with pip into a venv and run by systemd. Not in a container: its port scan
# detection adds iptables LOG rules on the host and reads the kernel log.
canary_version: 0.9.10
canary_dir: /opt/opencanary
canary_conf_dir: /etc/opencanaryd
canary_packages: [python3-venv, python3-dev, build-essential, libssl-dev, libffi-dev, libpcap-dev, iptables, rsyslog]
# What it pretends to be: a name and banners an intruder would want to look at.
canary_node_id: nas-backup
# The fake services and their ports. The real sshd keeps 22, for canary_ssh_sources only, so
# the fake SSH listens on 2222.
canary_services:
  ftp: 21
  telnet: 23
  http: 80
  ssh: 2222
  mysql: 3306
  mssql: 1433
  rdp: 3389
  vnc: 5900
  redis: 6379
  tftp: 69
  snmp: 161
# Alerts go to an ntfy topic with a publish token, from Vault: kv/homelab/canary/ntfy with the
# keys url (the topic's URL) and token (docs/services.md, Tripwire, sets them up).
canary_vault_mount: kv
canary_vault_path: homelab/canary/ntfy
# The real SSH: only the admin sources, and the hosts a connection may come through (the
# Proxmox host and the netbird VM route the VPN). Anyone else gets no answer on 22.
canary_ssh_sources: "{{ site.admin_sources + [site.pve.ip, site.hosts.netbird.ip] }}"
canary_ssh_guard_file: /etc/anvil/canary-ssh.nft
canary_ssh_guard_table: anvil_canary_ssh
# A changed guard is taken back after this many seconds unless Ansible gets in again first.
canary_ssh_rollback_after: 120
