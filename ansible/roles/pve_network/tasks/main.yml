- name: Install the rollback script
  ansible.builtin.copy:
    src: net-rollback.sh
    dest: "{{ pve_network_rollback_script }}"
    mode: "0755"
    owner: root
    group: root

- name: Read the live interfaces file
  ansible.builtin.slurp:
    src: "{{ pve_network_interfaces_path }}"
  register: pve_network_live
  check_mode: false

- name: Compare with the rendered template
  ansible.builtin.set_fact:
    pve_network_changed: "{{ (pve_network_live.content | b64decode) != lookup('ansible.builtin.template', 'interfaces.j2') }}"

- name: Read the controller address as the host sees it
  ansible.builtin.command: printenv SSH_CLIENT
  register: pve_network_ssh_client
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Pick the rollback ping target
  ansible.builtin.set_fact:
    pve_network_target: >-
      {{ pve_network_rollback_target
         or (pve_network_ssh_client.stdout | default('') | trim).split(' ')[0] }}
  no_log: true

- name: The rollback ping target is known
  ansible.builtin.assert:
    that: pve_network_target | length > 0
    fail_msg: >-
      Could not read the controller address (SSH_CLIENT) on {{ inventory_hostname }}; set
      pve_network_rollback_target explicitly. No fallback to the uplink gateway.
    quiet: true

- name: Report the rollback ping target (address not shown)
  ansible.builtin.debug:
    msg: >-
      network rollback target resolved: yes ({{ 'override' if pve_network_rollback_target else 'SSH_CLIENT' }});
      in the lab network: {{ 'yes' if pve_network_target_in_lan | bool else 'no' }}
  vars:
    pve_network_t: "{{ (pve_network_target ~ '.x.x.x.x').split('.')[:4] | map('int') | list }}"
    pve_network_n: "{{ site.lan_cidr.split('/')[0].split('.') | map('int') | list }}"
    pve_network_div: "{{ 2 ** (32 - (site.lan_cidr.split('/')[1] | int)) }}"
    pve_network_target_in_lan: >-
      {{ pve_network_target is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
         and ((pve_network_t[0] * 16777216 + pve_network_t[1] * 65536
               + pve_network_t[2] * 256 + pve_network_t[3]) // (pve_network_div | int))
          == ((pve_network_n[0] * 16777216 + pve_network_n[1] * 65536
               + pve_network_n[2] * 256 + pve_network_n[3]) // (pve_network_div | int)) }}

- name: Apply interfaces change with timed rollback
  when: pve_network_changed | bool
  block:
    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ pve_network_backup_dir }}"
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: Back up the live interfaces file
      ansible.builtin.copy:
        src: "{{ pve_network_interfaces_path }}"
        dest: "{{ pve_network_backup_dir }}/interfaces.{{ ansible_date_time.epoch }}"
        remote_src: true
        mode: "0600"
        owner: root
        group: root
      register: pve_network_backup
      # Check mode: the backup directory may not exist yet, and nothing is armed below.
      when: not ansible_check_mode

    # A unit left over from an earlier run (still armed, failed or finished) would make
    # systemd-run refuse the name.
    - name: Stop a leftover rollback timer
      ansible.builtin.systemd_service:
        name: net-rollback.timer
        state: stopped
      failed_when: false

    - name: Clear a stale rollback unit
      ansible.builtin.command: systemctl reset-failed net-rollback.service net-rollback.timer
      changed_when: false
      failed_when: false

    - name: Arm the timed rollback
      ansible.builtin.command:
        argv:
          - systemd-run
          - --unit=net-rollback
          - --on-active={{ pve_network_rollback_after }}
          - "{{ pve_network_rollback_script }}"
          - "{{ pve_network_backup.dest }}"
          - --wait
          - "0"
          - --target
          - "{{ pve_network_target }}"
      changed_when: true
      no_log: true  # the command line holds the controller address
      when: not ansible_check_mode

    - name: Write, reload and confirm
      block:
        - name: Write the new interfaces file
          ansible.builtin.template:
            src: interfaces.j2
            dest: "{{ pve_network_interfaces_path }}"
            mode: "0644"
            owner: root
            group: root

        - name: Reload network
          ansible.builtin.command: ifreload -a
          changed_when: true
          async: 60
          poll: 0
          register: pve_network_reload

        - name: Wait for the host to answer again
          ansible.builtin.wait_for_connection:
            delay: 5
            timeout: 60
          when: not ansible_check_mode

        - name: Wait for ifreload to finish successfully
          ansible.builtin.async_status:
            jid: "{{ pve_network_reload.ansible_job_id }}"
          register: pve_network_reload_job
          until: pve_network_reload_job.finished
          retries: 10
          delay: 3
          when: not ansible_check_mode

        - name: Confirm the host still answers after the reload finished
          ansible.builtin.wait_for_connection:
            delay: 0
            timeout: 20
          when: not ansible_check_mode

        - name: Disarm the rollback
          ansible.builtin.systemd:
            name: net-rollback.timer
            state: stopped
          when: not ansible_check_mode
      rescue:
        # In check mode there is no backup (and nothing was written).
        - name: Restore the backed up interfaces file
          ansible.builtin.copy:
            src: "{{ pve_network_backup.dest }}"
            dest: "{{ pve_network_interfaces_path }}"
            remote_src: true
            mode: "0644"
            owner: root
            group: root
          when: pve_network_backup.dest is defined

        - name: Reload the restored network configuration
          ansible.builtin.command: ifreload -a
          changed_when: true
          when: pve_network_backup.dest is defined

        - name: Stop the rollback timer
          ansible.builtin.systemd:
            name: net-rollback.timer
            state: stopped
          failed_when: false

        - name: Fail the play after rolling back
          ansible.builtin.fail:
            msg: Network change failed and the previous interfaces file was restored
