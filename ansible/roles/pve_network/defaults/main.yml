pve_network_interfaces_path: /etc/network/interfaces
pve_network_rollback_script: /usr/local/sbin/net-rollback.sh
pve_network_backup_dir: /var/backups/pve-network
# Seconds before the timed rollback fires if the host stops answering.
pve_network_rollback_after: 120
# Address the host pings to decide whether the change broke connectivity. Empty means the
# Ansible controller as the host sees it over SSH (SSH_CLIENT). There is no fallback to the
# uplink gateway: a change that keeps the gateway reachable but cuts off the controller must
# still roll back.
pve_network_rollback_target: ""
# The interfaces template also forwards the IPTV ports (inventory/group_vars/all/iptv.yml)
# from the uplink address to the IPTV host, so home devices reach it without router
# changes. Every iptables post-up line checks before adding, because Proxmox's ifreload
# (ifreload_down_changed=0) runs post-up again without post-down; post-down removes every
# copy of a rule.

# VLAN IDs the uplink port (eno1) carries tagged, for the switch trunk (inventory
# group_vars/proxmox.yml `vlans`, docs/cisco-switch.md). The lab and home networks stay
# untagged (PVID 1). Empty: no bridge-vids line.
pve_network_trunk_vids: "{{ vlans | default([]) | map(attribute='tag') | list }}"
