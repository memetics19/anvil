pve_network_interfaces_path: /etc/network/interfaces
pve_network_rollback_script: /usr/local/sbin/net-rollback.sh
pve_network_backup_dir: /var/backups/pve-network
# Seconds before the timed rollback fires if the host stops answering.
pve_network_rollback_after: 120
# Address the host pings to decide whether the change broke connectivity. Empty means the
# Ansible controller as the host sees it over SSH (SSH_CLIENT). There is no fallback to the
# uplink gateway: a change that keeps the gateway reachable but cuts off the controller must
# still roll back.
pve_network_rollback_target: ""
