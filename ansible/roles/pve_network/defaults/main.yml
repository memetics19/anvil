pve_network_interfaces_path: /etc/network/interfaces
pve_network_rollback_script: /usr/local/sbin/net-rollback.sh
pve_network_backup_dir: /var/backups/pve-network
# Seconds before the timed rollback fires if the host stops answering.
pve_network_rollback_after: 120
# Address the host pings to decide whether the change broke connectivity: the Ansible
# controller as seen over SSH (a local address would always answer), else the uplink gateway.
pve_network_rollback_target: "{{ (ansible_env.SSH_CLIENT | default('')).split(' ')[0] | default(site.pve.uplink_gw, true) }}"
