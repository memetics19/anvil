# DNS-fed sets (pve_segments_sets entries with `refresh`): a config file and a timer each.
# A set is filled at once when it is empty (after a ruleset reload) or its settings changed.
- name: Refresh units (templates, one instance per set)
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [segments-set-refresh@.service, segments-set-refresh@.timer]
  register: pve_segments_refresh_units
  notify: Reload systemd

- name: Apply a pending systemd reload
  ansible.builtin.meta: flush_handlers

- name: Refresh settings per set
  ansible.builtin.template:
    src: set.conf.j2
    dest: "{{ pve_segments_etc }}/sets/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ pve_segments_sets | selectattr('refresh', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: pve_segments_set_confs

- name: Refresh timers
  ansible.builtin.systemd_service:
    name: "segments-set-refresh@{{ item.name }}.timer"
    enabled: true
    state: started
  loop: "{{ pve_segments_sets | selectattr('refresh', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (ansible_check_mode and pve_segments_refresh_units is changed)

- name: Addresses in each DNS-fed set
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      nft list set inet {{ pve_segments_table | quote }} {{ item.name | quote }}
      | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | wc -l
    executable: /bin/bash
  loop: "{{ pve_segments_sets | selectattr('refresh', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: pve_segments_set_counts
  changed_when: false
  failed_when: false
  check_mode: false

- name: Fill a set now (empty, or new settings)
  ansible.builtin.systemd_service:
    name: "segments-set-refresh@{{ item.0.item.name }}.service"
    state: started
  loop: "{{ pve_segments_set_counts.results | zip(pve_segments_set_confs.results) | list }}"
  loop_control:
    label: "{{ item.0.item.name }}"
  when:
    - not ansible_check_mode
    - (item.0.stdout | default('0') | trim | int == 0) or item.1 is changed

- name: Every DNS-fed set holds addresses
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      nft list set inet {{ pve_segments_table | quote }} {{ item.name | quote }}
      | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | wc -l
    executable: /bin/bash
  loop: "{{ pve_segments_sets | selectattr('refresh', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: pve_segments_set_after
  changed_when: false
  failed_when: pve_segments_set_after.stdout | trim | int == 0
  when: not ansible_check_mode

# A set that is no longer DNS-fed (or gone) keeps no refresh timer.
- name: Refresh timers present
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      systemctl list-units --all --plain --no-legend 'segments-set-refresh@*.timer'
      | awk '{print $1}' | sed -n 's/^segments-set-refresh@\(.*\)[.]timer$/\1/p'
    executable: /bin/bash
  register: pve_segments_timers_present
  changed_when: false
  check_mode: false

- name: Stop the timers of sets no longer DNS-fed
  ansible.builtin.systemd_service:
    name: "segments-set-refresh@{{ item }}.timer"
    enabled: false
    state: stopped
  loop: >-
    {{ pve_segments_timers_present.stdout_lines
       | reject('in', pve_segments_sets | selectattr('refresh', 'defined') | map(attribute='name') | list) | list }}

- name: Remove their settings
  ansible.builtin.file:
    path: "{{ pve_segments_etc }}/sets/{{ item }}.conf"
    state: absent
  loop: >-
    {{ pve_segments_timers_present.stdout_lines
       | reject('in', pve_segments_sets | selectattr('refresh', 'defined') | map(attribute='name') | list) | list }}
