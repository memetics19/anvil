# Compose reads .env when it creates the container. The play sets force_handlers, so a
# failed task later in the run does not drop a pending recreate.
- name: Recreate pulse
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ pulse_project }}"
      - --project-directory
      - "{{ pulse_dir }}"
      - --file
      - "{{ pulse_dir }}/{{ pulse_compose_file }}"
      - up
      - --detach
      - --no-deps
      - --force-recreate
      - pulse
    chdir: "{{ pulse_dir }}"
  changed_when: true
  when: not ansible_check_mode and not pulse_up_now | default(false) | bool
