# Pulse (status page) on the netbird VM, kept current by the VM itself: pulse-update (a
# systemd timer) deploys the newest release of the public repository and rebuilds the docs
# site from its main branch. Nothing on GitHub can reach this host. The role writes the
# compose project, Caddy, the settings and the timer, then runs pulse-update once.
pulse_repo: https://github.com/memetics19/pulse
# Which release pulse-update deploys. A major version such as "3" follows the newest 3.x.y
# and never moves to 4.0 by itself (a major can break things). "latest" follows the newest
# tag of any major. A tag such as v3.0.0 pins that release.
pulse_track: "3"
# The docs site follows this branch.
pulse_docs_ref: main
# The release workflow pushes IMAGE:X.Y.Z for each tag vX.Y.Z (the package is public).
pulse_image: ghcr.io/memetics19/pulse
pulse_dir: /opt/pulse
# The project name the box has always used: its volumes (pulse_pulse_data and the Caddy
# volumes) carry over.
pulse_project: pulse
pulse_update_interval: 10min
# Seconds a new release has to answer /healthz before it is rolled back.
pulse_health_timeout: 90
# Data copies taken before each upgrade. The newest are kept, also after a failed one.
pulse_backups_keep: 5
pulse_memory_limit: 256m
# Role caddy's patched build, loaded by this role's tasks (caddy_image_resolved).
pulse_caddy_image: "{{ caddy_image_resolved }}"
pulse_mkdocs_image: squidfunk/mkdocs-material:9.7.7@sha256:51b87149d227691486b5f08993d28c65ca7e4990010664b697265b8e6fcd5287
# For the data copies (cp in a throwaway container with the volume mounted).
pulse_base_image: alpine:3.24@sha256:71e9b7bae160ba167fa17414401b94cbcdaf3c32feeab9298bd794a2a0614c35
# Settings in .env, passed to the container. RESEND_API_KEY and SLACK_WEBHOOK_URL are unset
# today. Secret: Vault kv/homelab/<host>/pulse admin_token (a placeholder today, not passed
# to the container).
pulse_vault_mount: kv
pulse_vault_path: "homelab/{{ inventory_hostname }}/pulse"
pulse_env:
  # Pulse 3 name (SQLITE_PATH before). A 2.x image ignores it and uses /data/pulse.db,
  # the same file, so a rollback is safe.
  PULSE_DB: /data/pulse.db
  RESEND_API_KEY: ""
  SLACK_WEBHOOK_URL: ""
  PULSE_SECURE_COOKIES: "true"
  PULSE_ALLOW_PRIVATE_MONITORS: "true"
# Caddy publishes the status page here.
pulse_url: "http://{{ site.hosts[inventory_hostname].ip }}/healthz"
