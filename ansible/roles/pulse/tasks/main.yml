# Pulse on the netbird VM: the compose project, Caddy, .env from Vault and pulse-update
# with its timer. Releases and docs are deployed by pulse-update (on the timer, and once
# here), not by Ansible. Nothing here runs `docker compose down` or removes a volume.

# --- secret ------------------------------------------------------------------------------------
# The setup token (PULSE_SETUP_TOKEN): a fresh Pulse finishes its /setup wizard only for
# someone who has it, so nobody who reaches the page first can claim the instance. It goes
# from openssl straight into Vault, never displayed, logged or written to a local file.
- name: Keys stored in Vault for Pulse
  ansible.builtin.command:
    argv: ["{{ pulse_repo_scripts }}/vault-kv-digests.sh", "{{ pulse_vault_path }}"]
  delegate_to: localhost
  become: false
  register: pulse_vault_digests
  changed_when: false
  check_mode: false

- name: Keys stored in Vault for Pulse, by name
  ansible.builtin.set_fact:
    pulse_vault_keys: "{{ pulse_vault_digests.stdout_lines | map('split', ' ') | map('first') | list }}"

- name: Generate the setup token into Vault
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      openssl rand -base64 48 | tr -d '\n' |
      vault kv {{ 'patch' if pulse_vault_keys else 'put' }} -mount={{ pulse_vault_mount }}
      {{ pulse_vault_path }} setup_token=- >/dev/null
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: true
  when: "'setup_token' not in pulse_vault_keys"

# In check mode a token that would be generated above does not exist yet: a stand-in is used.
- name: Read the setup token from Vault
  ansible.builtin.set_fact:
    pulse_setup_token: >-
      {{ (lookup('community.hashi_vault.vault_kv2_get', pulse_vault_path,
                 engine_mount_point=pulse_vault_mount,
                 url=lookup('env', 'VAULT_ADDR'),
                 token=lookup('env', 'VAULT_TOKEN'),
                 ca_cert=lookup('env', 'VAULT_CACERT')).secret.setup_token) | default('') }}
  no_log: true
  when: not (ansible_check_mode and 'setup_token' not in pulse_vault_keys)

- name: The setup token is present
  ansible.builtin.assert:
    that: pulse_setup_token | default('') | length >= 32
    fail_msg: "kv/{{ pulse_vault_path }}: setup_token is missing or shorter than 32 characters"
    quiet: true
  when: not (ansible_check_mode and 'setup_token' not in pulse_vault_keys)

- name: The update settings are valid
  ansible.builtin.assert:
    that:
      - pulse_track | string is match('^(latest|[0-9]+|v[0-9]+\\.[0-9]+\\.[0-9]+)$')
      - pulse_backups_keep | int >= 1
    fail_msg: "pulse_track must be latest, a major version such as 3, or a tag such as v3.0.0, and pulse_backups_keep at least 1"
    quiet: true

# --- files -------------------------------------------------------------------------------------
- name: Install git and curl
  ansible.builtin.apt:
    name: [git, curl]
    state: present

- name: Pulse directory
  ansible.builtin.file:
    path: "{{ pulse_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The patched Caddy that role caddy builds (current Go and golang.org/x/net), not upstream's
# binary: built once on the build host, loaded here if this host does not have it yet.
- name: The patched Caddy image
  ansible.builtin.include_role:
    name: caddy
    tasks_from: image.yml
    public: true
  vars:
    caddy_dir: "{{ pulse_dir }}"

- name: Compose file, Caddyfile and pulse-update settings
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ pulse_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: compose.yaml.j2, dest: compose.yaml}
    - {src: Caddyfile.j2, dest: Caddyfile}
    - {src: update.conf.j2, dest: update.conf}
  register: pulse_files

- name: Pulse .env (setup token from Vault)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ pulse_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  register: pulse_env_file
  no_log: true
  diff: false

- name: The pulse-compose and pulse-update scripts
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/usr/local/sbin/{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - {src: pulse-compose.j2, dest: pulse-compose}
    - {src: pulse-update.sh.j2, dest: pulse-update}

- name: Units of pulse-update
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [pulse-update.service, pulse-update.timer]
  register: pulse_units

# --- deploy ------------------------------------------------------------------------------------
- name: What pulse-update would do
  ansible.builtin.command:
    argv: [/usr/local/sbin/pulse-update, --check]
  register: pulse_plan
  changed_when: "'would' in pulse_plan.stdout"
  check_mode: false
  # In check mode on a new host the script is not there yet.
  when: not (ansible_check_mode and pulse_files.changed)

- name: Report it
  ansible.builtin.debug:
    msg: "{{ pulse_plan.stdout_lines }}"
  when: pulse_plan.stdout_lines is defined

- name: Deploy the newest release and docs
  ansible.builtin.command:
    argv: [/usr/local/sbin/pulse-update]
  register: pulse_update
  changed_when: "'deployed' in pulse_update.stdout or 'docs built' in pulse_update.stdout"
  when: not ansible_check_mode

# A settings change with no new release: compose recreates what changed.
- name: Apply a compose or .env change
  ansible.builtin.command:
    argv: [/usr/local/sbin/pulse-compose, up, --detach, pulse, caddy]
  changed_when: true
  when:
    - not ansible_check_mode
    - pulse_files.results[0].changed or pulse_env_file.changed
    - "'deployed' not in pulse_update.stdout"

# Caddy reads its Caddyfile only at start.
- name: Restart Caddy for a new Caddyfile
  ansible.builtin.command:
    argv: [/usr/local/sbin/pulse-compose, restart, caddy]
  changed_when: true
  when: not ansible_check_mode and pulse_files.results[1].changed

- name: Timer of pulse-update
  ansible.builtin.systemd_service:
    name: pulse-update.timer
    enabled: true
    state: started
    daemon_reload: "{{ pulse_units.changed }}"
  when: not (ansible_check_mode and pulse_units.changed)

- name: Pulse answers through Caddy
  ansible.builtin.uri:
    url: "{{ pulse_url }}"
  register: pulse_health
  retries: 20
  delay: 3
  until: pulse_health.status == 200
  when: not ansible_check_mode
