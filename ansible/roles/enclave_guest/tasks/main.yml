- name: The enclave gateway is known
  ansible.builtin.assert:
    that: enclave_guest_gateway is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
    fail_msg: enclave_guest_gateway (site.sdn.enclave.gateway) is not set
    quiet: true

- name: Apt through the host's apt cache
  ansible.builtin.copy:
    content: |
      // Managed by Ansible (role enclave_guest). No internet: the host's apt cache.
      Acquire::http::Proxy "http://{{ enclave_guest_gateway }}:{{ enclave_guest_aptcache_port }}";
    dest: "{{ enclave_guest_apt_proxy_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Timesyncd drop-in directory
  ansible.builtin.file:
    path: "{{ enclave_guest_timesyncd_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Time from the host's chrony only (no fallback servers)
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (role enclave_guest).
      [Time]
      NTP={{ enclave_guest_gateway }}
      FallbackNTP=
    dest: "{{ enclave_guest_timesyncd_file }}"
    owner: root
    group: root
    mode: "0644"
  register: enclave_guest_timesyncd

- name: Timesyncd running (restarted for a new server)
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: "{{ 'restarted' if enclave_guest_timesyncd is changed else 'started' }}"
  changed_when: enclave_guest_timesyncd is changed

# fwupd's metadata refresh downloads from the internet, which the enclave has none of. It
# retries, fails and shows as a failed unit (tests/smoke/test_hosts.sh). The timer and the
# service are stopped and masked, and a last failure is cleared.
- name: Is fwupd's refresh timer installed
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/fwupd-refresh.timer
  register: enclave_guest_fwupd

- name: No fwupd metadata refresh (it needs the internet)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    masked: true
  loop: [fwupd-refresh.timer, fwupd-refresh.service]
  when: enclave_guest_fwupd.stat.exists

# Masking a running timer leaves it failed (result "resources"), so each unit is checked
# and cleared on its own: reset-failed refuses a unit that is not loaded.
- name: Which fwupd units have failed
  ansible.builtin.command:
    argv: [systemctl, is-failed, --quiet, "{{ item }}"]
  loop: [fwupd-refresh.timer, fwupd-refresh.service]
  register: enclave_guest_fwupd_failed
  changed_when: false
  failed_when: false
  check_mode: false
  when: enclave_guest_fwupd.stat.exists

- name: Clear those failures
  ansible.builtin.command:
    argv: [systemctl, reset-failed, "{{ item.item }}"]
  loop: "{{ enclave_guest_fwupd_failed.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

# Check mode skips the command above, so it reports the change here instead.
- name: Would clear a failed fwupd unit
  ansible.builtin.debug:
    msg: "{{ item.item }} would be cleared"
  loop: "{{ enclave_guest_fwupd_failed.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
  when: ansible_check_mode
