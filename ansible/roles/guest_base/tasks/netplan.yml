- name: Validate and compare the netplan
  block:
    - name: Validate the rendered netplan
      ansible.builtin.include_tasks: netplan_validate.yml

    - name: Read the controller address as the guest sees it (no become, sudo drops SSH_CLIENT)
      ansible.builtin.command: printenv SSH_CLIENT
      # ansible_become in group_vars outranks the `become` keyword, so override the variable.
      vars:
        ansible_become: false
      register: guest_base_netplan_ssh_client
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Pick the rollback ping target
      ansible.builtin.set_fact:
        guest_base_netplan_target: >-
          {{ guest_base_netplan_rollback_target
             or (guest_base_netplan_ssh_client.stdout | default('') | trim).split(' ')[0] }}
      no_log: true

    - name: The rollback ping target is known
      ansible.builtin.assert:
        that: guest_base_netplan_target | length > 0
        fail_msg: >-
          Could not read the controller address (SSH_CLIENT) on {{ inventory_hostname }}; set
          guest_base_netplan_rollback_target explicitly. No fallback to the gateway.
        quiet: true

    - name: Report the rollback ping target (address not shown)
      ansible.builtin.debug:
        msg: >-
          netplan rollback target resolved: yes ({{ 'override' if guest_base_netplan_rollback_target else 'SSH_CLIENT' }});
          in the lab network: {{ 'yes' if guest_base_netplan_target_in_lan | bool else 'no' }}
      vars:
        guest_base_netplan_t: "{{ (guest_base_netplan_target ~ '.x.x.x.x').split('.')[:4] | map('int') | list }}"
        guest_base_netplan_n: "{{ site.lan_cidr.split('/')[0].split('.') | map('int') | list }}"
        guest_base_netplan_div: "{{ 2 ** (32 - (site.lan_cidr.split('/')[1] | int)) }}"
        guest_base_netplan_target_in_lan: >-
          {{ guest_base_netplan_target is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
             and ((guest_base_netplan_t[0] * 16777216 + guest_base_netplan_t[1] * 65536
                   + guest_base_netplan_t[2] * 256 + guest_base_netplan_t[3]) // (guest_base_netplan_div | int))
              == ((guest_base_netplan_n[0] * 16777216 + guest_base_netplan_n[1] * 65536
                   + guest_base_netplan_n[2] * 256 + guest_base_netplan_n[3]) // (guest_base_netplan_div | int)) }}

    - name: Checksum of the rendered file
      ansible.builtin.stat:
        path: "{{ guest_base_netplan_stage.path }}/etc/netplan/{{ guest_base_netplan_file }}"
      register: guest_base_netplan_new

    - name: Checksum of the live file
      ansible.builtin.stat:
        path: "/etc/netplan/{{ guest_base_netplan_file }}"
      register: guest_base_netplan_live

    # The managed file owns the guest's network: any other file (an old name after a
    # rename, a cloud-init leftover) is removed in the same guarded apply.
    - name: Other netplan files
      ansible.builtin.find:
        paths: /etc/netplan
        patterns: ["*.yaml", "*.yml"]
        excludes: ["{{ guest_base_netplan_file }}"]
      register: guest_base_netplan_others

    - name: Note whether netplan would change
      ansible.builtin.set_fact:
        guest_base_netplan_pending: >-
          {{ not guest_base_netplan_live.stat.exists
             or guest_base_netplan_live.stat.checksum != guest_base_netplan_new.stat.checksum
             or guest_base_netplan_live.stat.mode != '0600'
             or guest_base_netplan_others.files | length > 0 }}

    - name: Refuse an unguarded netplan change
      ansible.builtin.fail:
        msg: >-
          The netplan on {{ inventory_hostname }} would change (/etc/netplan/{{ guest_base_netplan_file }}{{
          ', remove ' ~ (guest_base_netplan_others.files | map(attribute='path') | join(', '))
          if guest_base_netplan_others.files else '' }}). Look at the rendered file first, then apply
          this one VM with: make vm HOST={{ inventory_hostname }} ARGS="-e guest_base_netplan_apply=true".
          That arms a {{ guest_base_netplan_rollback_after }}s rollback before applying. For the netbird VM,
          never in the same run as a Proxmox host network change.
      when:
        - guest_base_netplan_pending | bool
        - not guest_base_netplan_apply | bool

    - name: Apply netplan with timed rollback
      ansible.builtin.include_tasks: netplan_apply.yml
      when: guest_base_netplan_pending | bool
  always:
    - name: Remove the temporary root
      ansible.builtin.file:
        path: "{{ guest_base_netplan_stage.path }}"
        state: absent
      changed_when: false
      check_mode: false
      when: guest_base_netplan_stage.path is defined
