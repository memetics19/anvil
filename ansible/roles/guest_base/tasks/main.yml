# The network first: on a VM moving into the secrets enclave, apt works only once the
# enclave NIC carries the default route (through the host's apt cache).
- name: Static netplan
  ansible.builtin.include_tasks: netplan.yml
  when: guest_base_manage_netplan | bool

# Cloud-init deletes and remakes the SSH host keys when it sees a new instance, which
# happens whenever the VM's cloud-init config changes. Keep them: a new key makes every
# SSH client refuse the host.
- name: Is cloud-init installed
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg.d
  register: guest_base_cloud_cfg_d

- name: Cloud-init keeps the SSH host keys
  ansible.builtin.copy:
    content: |
      # Managed by anvil (role guest_base). Keep the SSH host keys on a new instance.
      ssh_deletekeys: false
    dest: /etc/cloud/cloud.cfg.d/99-anvil-keep-host-keys.cfg
    owner: root
    group: root
    mode: "0644"
  when: guest_base_cloud_cfg_d.stat.isdir | default(false)

- name: Timezone
  community.general.timezone:
    name: "{{ guest_base_timezone }}"

# The unit is static: it starts from udev once the VM has the agent's virtio-serial device
# (Terraform agent.enabled), so "enabled" here only records the intent.
- name: Install qemu-guest-agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: guest_base_agent_package

# In check mode on a new VM the package is not really installed, so its unit does not
# exist yet: skip this step then (a real run installs it first).
- name: Enable qemu-guest-agent at boot
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    enabled: true
  when: not (ansible_check_mode and guest_base_agent_package is changed)

- name: Weekly fstrim (frees thin-pool space; the VM disks have discard on)
  ansible.builtin.systemd_service:
    name: fstrim.timer
    enabled: true
    state: started

- name: Packages that must stay absent
  ansible.builtin.apt:
    name: "{{ guest_base_absent_packages }}"
    state: absent
    purge: true
    autoremove: false
  when: guest_base_absent_packages | length > 0
  tags: [packages_absent]
