guest_base_timezone: Asia/Kolkata

# Static netplan file. Only for the adopted guests (group_vars/guests.yml); the vault VM keeps
# the netplan that cloud-init wrote. The file name is the one the guests use today, so the
# first run changes nothing; renaming it is a later, deliberate change (set netplan_file).
guest_base_manage_netplan: false
guest_base_netplan_file: "{{ netplan_file | default('60-opnsense.yaml') }}"
guest_base_netplan_interface: ens18
# Addresses come from the site dict (Vault), never from this repo.
guest_base_ip: "{{ site.hosts[inventory_hostname].ip }}"
guest_base_prefix: "{{ site.lan_cidr.split('/')[1] }}"
guest_base_gateway: "{{ site.pve.gateway_alias_ip }}"
guest_base_dns: "{{ site.guest_dns }}"

# A netplan change is never applied silently: a run that would change it fails unless
# -e guest_base_netplan_apply=true, and then it applies with a timed rollback.
guest_base_netplan_apply: false
guest_base_netplan_backup_dir: /var/backups/guest-netplan
guest_base_netplan_rollback_script: /usr/local/sbin/netplan-rollback.sh
# Seconds before the rollback fires if the guest stops answering.
guest_base_netplan_rollback_after: 120
# Address the guest pings to decide whether the change broke connectivity: the Ansible
# controller as seen over SSH, else the gateway.
guest_base_netplan_rollback_target: >-
  {{ (ansible_env.SSH_CLIENT | default('')).split(' ')[0] | default(guest_base_gateway, true) }}
