# NFS for the media library: read-only, NFSv4 and (for macOS and VLC) NFSv3. The firewall table is loaded before the
# export exists, and the library itself is only ever read.

- name: The client addresses are single addresses or /32s
  ansible.builtin.assert:
    that:
      - (nfs_media_lan_clients + nfs_media_netbird_clients) | length > 0
      - (nfs_media_lan_clients + nfs_media_netbird_clients)
        | reject('match', '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(/32)?$') | list | length == 0
    fail_msg: >-
      set nfs_media_lan_clients (site.admin_sources) or nfs_media_netbird_clients
      (site.nfs.clients); each is a single IPv4 address or /32
    quiet: true

- name: Is the NetBird interface up (role netbird_peer)
  ansible.builtin.stat:
    path: "/sys/class/net/{{ nfs_media_interface }}"
  register: nfs_media_iface

# NetBird export only when its clients are set and the interface is there, so a lab-only
# setup needs no NetBird.
- name: Whether NetBird clients are exported to
  ansible.builtin.set_fact:
    nfs_media_netbird_active: "{{ nfs_media_netbird_clients | length > 0 and (nfs_media_iface.stat.exists | default(false)) }}"

- name: The NetBird interface is missing but clients are set
  ansible.builtin.assert:
    that: nfs_media_netbird_clients | length == 0 or nfs_media_iface.stat.exists or ansible_check_mode
    fail_msg: "{{ nfs_media_interface }} is missing: enrol this VM in NetBird (--tags netbird_peer) or clear site.nfs.clients"
    quiet: true

- name: The local (insecure) readers and the full reader list
  ansible.builtin.set_fact:
    # Lab devices and, when a home address is set, any device on the home Wi-Fi. These use
    # high source ports (insecure), unlike the NetBird clients (secure).
    nfs_media_insecure_clients: >-
      {{ (nfs_media_lan_clients + ([nfs_media_home_subnet] if nfs_media_home_ip | length > 0 else [])) | unique }}
    nfs_media_readers: >-
      {{ (nfs_media_lan_clients + ([nfs_media_home_subnet] if nfs_media_home_ip | length > 0 else [])
          + (nfs_media_netbird_clients if nfs_media_netbird_active | bool else [])) | unique }}

# A home-network address on the lab NIC so home devices reach the library (no gateway, so the
# default route is untouched). Done before the NFS server.
- name: Home-network address unit
  ansible.builtin.template:
    src: home-addr.service.j2
    dest: /etc/systemd/system/{{ nfs_media_home_addr_unit }}.service
    mode: "0644"
  register: nfs_media_home_addr_unit_file
  when: nfs_media_home_ip | length > 0

- name: The home-network address is up and set at boot
  ansible.builtin.systemd_service:
    name: "{{ nfs_media_home_addr_unit }}"
    enabled: true
    state: "{{ 'restarted' if nfs_media_home_addr_unit_file is changed else 'started' }}"
    daemon_reload: "{{ nfs_media_home_addr_unit_file is changed }}"
  when: nfs_media_home_ip | length > 0 and not ansible_check_mode

- name: The library folders exist (read only, never created here)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ nfs_media_exports }}"
  register: nfs_media_paths

- name: Every exported folder is there
  ansible.builtin.assert:
    that: nfs_media_paths.results | rejectattr('stat.isdir', 'defined') | list | length == 0
          and nfs_media_paths.results | selectattr('stat.isdir', 'defined') | rejectattr('stat.isdir') | list | length == 0
    fail_msg: "a folder in nfs_media_exports is missing or not a directory"
    quiet: true

# --- firewall first ------------------------------------------------------------------------
- name: Config directory
  ansible.builtin.file:
    path: "{{ nfs_media_guard_file | dirname }}"
    state: directory
    mode: "0755"

- name: NFS guard (checked with nft -c before it is installed)
  ansible.builtin.template:
    src: nfs-guard.nft.j2
    dest: "{{ nfs_media_guard_file }}"
    mode: "0644"
    validate: nft -c -f %s
  register: nfs_media_guard

- name: Boot unit for the guard
  ansible.builtin.template:
    src: nfs-guard.service.j2
    dest: /etc/systemd/system/nfs-guard.service
    mode: "0644"
  register: nfs_media_guard_unit

- name: The guard is loaded at boot
  ansible.builtin.systemd_service:
    name: nfs-guard
    enabled: true
    daemon_reload: "{{ nfs_media_guard_unit is changed }}"

- name: Is the guard loaded
  ansible.builtin.command:
    argv: [nft, list, table, inet, anvil_nfs_guard]
  register: nfs_media_guard_live
  changed_when: false
  failed_when: false
  check_mode: false

- name: Load the guard (one transaction)
  ansible.builtin.command:
    argv: [nft, -f, "{{ nfs_media_guard_file }}"]
  changed_when: true
  when: nfs_media_guard is changed or nfs_media_guard_live.rc != 0

# --- the NFS server ------------------------------------------------------------------------
- name: The NFS server
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present

- name: NFS versions and ports
  ansible.builtin.template:
    src: nfs.conf.j2
    dest: /etc/nfs.conf.d/anvil.conf
    mode: "0644"
  notify: Restart nfs-server

- name: The exports directory
  ansible.builtin.file:
    path: /etc/exports.d
    state: directory
    mode: "0755"

- name: Read-only exports for the allowed readers
  ansible.builtin.template:
    src: media.exports.j2
    dest: /etc/exports.d/anvil-media.exports
    mode: "0644"
  notify: Reexport

- name: The NFS server runs
  ansible.builtin.systemd_service:
    name: nfs-server
    enabled: true
    state: started
