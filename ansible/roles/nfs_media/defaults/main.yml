# The media library over NFS, read-only, NFSv4 only (one TCP port, 2049). Two kinds of
# reader, either or both:
#   - the operator's own devices on the lab network (nfs_media_lan_clients): for a player
#     like VLC at home. Exported "insecure" so a player's high source port is allowed.
#   - machines in another home over NetBird (nfs_media_netbird_clients): their Jellyfin
#     reads it. Only when NetBird is enrolled here (the wt0 interface) and the clients are set.
# An nftables guard admits NFS only from those addresses and drops it from everyone else; the
# library itself is only ever read (the role checks the folders are there, never changes them).
nfs_media_exports:
  - /home/ubuntu/media/movies
  - /home/ubuntu/media/tv
# The operator's devices (site.admin_sources: single /32s). Empty turns LAN access off.
nfs_media_lan_clients: "{{ site.admin_sources | default([]) }}"
# The NetBird clients (site.nfs.clients: their NetBird IPs). Empty turns NetBird access off.
nfs_media_netbird_clients: "{{ site.nfs.clients | default([]) }}"
nfs_media_interface: wt0
# Every client reads as the library's owner (the VM's first user): read-only, so it can read
# every file whatever its mode, and change nothing.
nfs_media_anon_uid: 1000
nfs_media_anon_gid: 1000
# Serve NFSv3 as well as NFSv4: macOS Finder and VLC's built-in NFS (libnfs) use v3. v3
# needs rpcbind (111) and mountd/statd; their ports are fixed so the guard can admit them.
nfs_media_v3: true
nfs_media_mountd_port: 20048
nfs_media_statd_port: 32765
# A home-network address on this VM (site.hosts.<vm>.home_ip), so devices on the home Wi-Fi
# (a phone, a Fire TV) can reach the library at all: the VM is otherwise on the lab network
# only. Added as a second address on the lab NIC by a boot unit (ip addr replace, idempotent,
# no gateway, so the default route is untouched). Empty: no home address, no home export.
nfs_media_home_ip: "{{ site.hosts[inventory_hostname].home_ip | default('') }}"
nfs_media_home_iface: "{{ ansible_default_ipv4.interface | default('ens18') }}"
nfs_media_home_prefix: "{{ site.pve.uplink_prefix | default('24') }}"
# The home subnet, a reader when home_ip is set: any device on the home Wi-Fi may mount
# read-only (derived from the home network, e.g. 192.0.2.0/24).
nfs_media_home_subnet: >-
  {{ (site.pve.uplink_ip | default('')).split('.')[:3] | join('.') }}.0/{{ site.pve.uplink_prefix | default('24') }}
nfs_media_home_addr_unit: anvil-nfs-home-addr
# VPN access. Both NetBird routing peers for the lab's /16, the netbird VM and the Proxmox
# host, masquerade: a phone on the VPN arrives as the lab address of whichever its NetBird
# picked (site.hosts.netbird.ip, site.pve.ip), not as its own. Those addresses are readers.
# That also lets in what the Proxmox host masquerades from its VLANs, home devices like the
# home Wi-Fi, which reads the library already. The operator's own peers
# (site.admin_vpn_sources) are readers too, for a route without masquerade. Empty: no VPN
# access.
nfs_media_vpn_routers: "{{ [site.hosts.netbird.ip | default(''), site.pve.ip | default('')] | select | list }}"
nfs_media_vpn_clients: >-
  {{ (site.admin_vpn_sources | default([])) + (nfs_media_vpn_routers | map('regex_replace', '$', '/32') | list) }}
# The readers that connect from high source ports (exported "insecure"): the lab devices,
# the VPN (masqueraded), and the home Wi-Fi when there is a home address. Then every reader,
# the NetBird clients (secure) included when active (nfs_media_netbird_active, from the run).
nfs_media_insecure_clients: >-
  {{ (nfs_media_lan_clients + nfs_media_vpn_clients
      + ([nfs_media_home_subnet] if nfs_media_home_ip | length > 0 else [])) | unique }}
nfs_media_readers: >-
  {{ (nfs_media_insecure_clients
      + (nfs_media_netbird_clients if nfs_media_netbird_active | default(false) | bool else [])) | unique }}
nfs_media_guard_file: /etc/anvil/nfs-guard.nft
