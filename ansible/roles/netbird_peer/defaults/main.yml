# NetBird client on the netbird VM: the routing peer for the lab and home networks, managed
# by NetBird's cloud service. Routes, groups and ACLs are hand-managed in the NetBird
# dashboard (README, "Not managed here"). This VM is the emergency VPN path, so the role
# never restarts, upgrades, logs out or re-enrols a running client (see tasks/main.yml).
netbird_peer_apt_key_url: https://pkgs.netbird.io/debian/public.key
# Pinned so a changed key is refused instead of trusted. The first is the ASCII key as
# downloaded, the second the dearmored keyring apt reads.
netbird_peer_key_asc_sha256: 6bd434c07e7c3a71211de79ca287e93b45deadedc4b74f1a2e83e11abe6e0bf5
netbird_peer_keyring_sha256: f6a7d72e0b3d9e009d5554374ff4b8b2212ca350811ed288798255fab9a81c71
netbird_peer_apt_keyring: /usr/share/keyrings/netbird-archive-keyring.gpg
# Client version (apt, held). Bumping it upgrades and restarts the client on the next run.
netbird_peer_version: 0.66.4
netbird_peer_management_url: https://api.netbird.io:443
# Setup key (only read to enrol a client that has never logged in): Vault KV v2, mount kv.
netbird_peer_vault_mount: kv
netbird_peer_vault_path: "homelab/{{ inventory_hostname }}/netbird"
netbird_peer_repo_scripts: "{{ playbook_dir }}/../../scripts"

# --- netbird-home: the routing peer of the self-hosted network (Task 13c, tasks/home.yml) ---
# A second client service next to the cloud one: its own state directory, socket, log,
# interface and WireGuard port, and its own nftables table. Only when site.netbird_domain
# is set (role netbird_server).
netbird_peer_home_enabled: "{{ site.netbird_domain | default('', true) | length > 0 }}"
netbird_peer_home_service: netbird-home
netbird_peer_home_state_dir: /var/lib/netbird-home
netbird_peer_home_log_dir: /var/log/netbird-home
netbird_peer_home_daemon_addr: unix:///var/run/netbird-home.sock
netbird_peer_home_interface: wt1
netbird_peer_home_wg_port: 51821
netbird_peer_home_nftables_table: netbird_home
netbird_peer_home_memory_max: 256M
netbird_peer_home_management_url: "https://{{ site.netbird_domain | default('') }}:443"
# Groups its setup key puts it in (role netbird_server: the routers of its networks).
netbird_peer_home_groups: [routers]

# The end-of-run check waits this many times 10 seconds for the client to reconnect to its
# management server before it fails the run (tasks/verify.yml).
netbird_peer_verify_retries: 18
