# The compose file is the whole role (plus the API keys): no app config written by default,
# and nothing under the media library.
- name: ARR compose project
  ansible.builtin.include_role:
    name: compose_project
  vars:
    compose_project_dir: "{{ arr_stack_dir }}"
    compose_project_file: "{{ arr_stack_compose_file }}"
    compose_project_content: "{{ lookup('ansible.builtin.template', 'docker-compose.yaml.j2') }}"

# New API keys, only when asked (anvil rotate). Before the copy into Vault, so a run with
# both tags stores the new keys.
- name: New API keys
  ansible.builtin.import_tasks: rotate.yml
  tags: [never, rotate]

# Read only: the apps' API keys into Vault for the Homepage widgets.
- name: API keys for the dashboard
  ansible.builtin.import_tasks: api_keys.yml
  tags: [homepage, rotate]

# Prowlarr's indexers, through its API on this host (files/arr-indexers.py).
- name: Indexers
  ansible.builtin.import_tasks: indexers.yml
  tags: [arr, arr_indexers]

# The quality policy, through each app's API on this host (files/arr-quality.py).
- name: Quality policy of Sonarr and Radarr
  ansible.builtin.import_tasks: quality.yml
  tags: [arr, arr_quality]

# The apps' own logins: off behind the gateway's single sign-on (arr_stack_app_logins).
- name: App logins
  ansible.builtin.import_tasks: logins.yml
  tags: [arr, arr_logins]
