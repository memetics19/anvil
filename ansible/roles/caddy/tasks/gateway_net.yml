# Caddy's own network, pinned: subnet from the site dict, fixed bridge name. Checked before
# anything is written; an existing network with another subnet or bridge is replaced (Caddy,
# its only member, is removed first and brought up again by the compose step).
- name: Docker's default bridge network
  ansible.builtin.command:
    argv: [docker, network, inspect, --format, "{{ caddy_bridge_format }}", bridge]
  vars:
    caddy_bridge_format: "{{ '{{range .IPAM.Config}}{{.Subnet}}{{end}}' }}"
  register: caddy_docker_bridge
  changed_when: false
  failed_when: false
  check_mode: false
  when: caddy_gateway_subnet | length > 0

- name: Addresses as numbers (for the overlap check)
  ansible.builtin.set_fact:
    caddy_net_ranges: >-
      {%- set out = {} -%}
      {%- for k, c in {'gateway': caddy_gateway_subnet, 'lab': site.lan_cidr,
                       'home': site.pve.uplink_ip ~ '/' ~ site.pve.uplink_prefix,
                       'dns': site.hosts[inventory_hostname].dns_subnet | default('192.0.2.0/32'),
                       'docker': caddy_docker_bridge.stdout | default('', true) | trim
                                 | default('192.0.2.0/32', true)}.items() -%}
      {%- set a = (c.split('/')[0] ~ '.x.x.x.x').split('.')[:4] | map('int') | list -%}
      {%- set n = a[0] * 16777216 + a[1] * 65536 + a[2] * 256 + a[3] -%}
      {%- set size = 2 ** (32 - (c.split('/')[1] | default(32) | int)) -%}
      {%- set start = (n // size) * size -%}
      {%- set _ = out.update({k: [start, start + size - 1]}) -%}
      {%- endfor -%}
      {{ out }}
  when: caddy_gateway_subnet | length > 0

- name: Caddy's network is private, /16 to /29, and overlaps no other network here
  ansible.builtin.assert:
    that:
      - >-
        caddy_gateway_subnet is match('^(10([.][0-9]{1,3}){3}|172[.](1[6-9]|2[0-9]|3[01])([.][0-9]{1,3}){2}|192[.]168([.][0-9]{1,3}){2})/(1[6-9]|2[0-9])$')
      - >-
        caddy_net_ranges | dict2items | rejectattr('key', 'equalto', 'gateway')
        | selectattr('value.0', 'le', caddy_net_ranges.gateway[1])
        | selectattr('value.1', 'ge', caddy_net_ranges.gateway[0]) | list | length == 0
    fail_msg: >-
      site.hosts.{{ inventory_hostname }}.gateway_subnet must be an RFC 1918 network, /16 to /29,
      overlapping neither the lab, the home network, the DNS network nor Docker's default bridge
    quiet: true
  when: caddy_gateway_subnet | length > 0

- name: The network as it is
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - --format
      - "{{ '{{' }}range .IPAM.Config{{ '}}{{' }}.Subnet{{ '}}{{' }}end{{ '}}' }}|{{ '{{' }}index .Options \"com.docker.network.bridge.name\"{{ '}}' }}"
      - "{{ caddy_gateway_network }}"
  register: caddy_gateway_net_live
  changed_when: false
  failed_when: false
  check_mode: false

- name: Replace a network with another subnet or bridge
  when:
    - caddy_gateway_subnet | length > 0
    - caddy_gateway_net_live.rc == 0
    - caddy_gateway_net_live.stdout | trim != caddy_gateway_subnet ~ '|' ~ caddy_gateway_bridge
  block:
    - name: The network to replace
      ansible.builtin.debug:
        msg: "{{ caddy_gateway_network }}: replaced (pinned subnet and bridge); Caddy is recreated once"
      changed_when: true

    - name: Remove Caddy (the network's only member; compose brings it up again)
      ansible.builtin.command:
        argv: [docker, rm, --force, caddy]
      changed_when: true
      when: not ansible_check_mode

    - name: Remove the old network
      ansible.builtin.command:
        argv: [docker, network, rm, "{{ caddy_gateway_network }}"]
      changed_when: true
      when: not ansible_check_mode
