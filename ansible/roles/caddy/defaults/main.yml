# Service gateway on the apps VM: Caddy (compose project "caddy" in /opt/caddy) answers
# https://<name>.<gateway domain> for every entry of site.services and proxies it to the
# service (gateway_domain, inventory group_vars/all/gateway.yml: site.domain or a private
# subdomain of it). One wildcard certificate, *.<gateway domain>, from Let's Encrypt by DNS-01 through
# Cloudflare, so no name is ever published in public DNS (only _acme-challenge TXT records,
# created and removed by Caddy) and Certificate Transparency logs show only the wildcard.
# The names exist only in Pi-hole (role pihole, from the same list), pointing at the apps
# home address.
caddy_dir: /opt/caddy

# Caddy with the caddy-dns/cloudflare module, built by xcaddy from pinned versions on the
# build host (not on the apps VM: 1.5 GB, no swap; a Go build of Caddy needs more than
# the VM has free) and then loaded into the apps VM's Docker. The tag carries both
# versions and a hash of the Dockerfile, so any change builds a new image.
# Go is pinned to 1.26 (GOTOOLCHAIN=local, no automatic toolchain switch): Go 1.27 removed
# the tlsrsakex setting (caddy_godebug), and the official caddy builder image already
# uses 1.27. Caddy 2.11.7 needs Go >= 1.26.0.
caddy_version: 2.11.7
caddy_cloudflare_version: v0.2.4
caddy_xcaddy_version: v0.4.7
caddy_builder_image: golang:1.26.10-alpine@sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca
caddy_go_version: go1.26.10
caddy_base_image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
caddy_dockerfile: "{{ lookup('ansible.builtin.template', 'Dockerfile.j2') }}"
caddy_image: >-
  anvil/caddy:{{ caddy_version }}-cloudflare-{{ caddy_cloudflare_version | regex_replace('^v', '') }}-{{
  (caddy_dockerfile | hash('sha256'))[:12] }}
# Where the image is built (an inventory host with Docker and memory to spare). Its build
# directory holds only the Dockerfile and, briefly, the exported image.
caddy_build_host: ragnarok
caddy_build_dir: /opt/caddy-build

# Published on these addresses only (the VM's lab and home addresses), never 0.0.0.0.
# Docker-published ports bypass ufw, so this binding is the boundary.
caddy_listen_ips:
  - "{{ site.hosts[inventory_hostname].ip }}"
  - "{{ site.hosts[inventory_hostname].home_ip }}"

# The service list (Vault, kv/homelab/site, key site.services). Each entry:
#   name               label: served as <name>.<gateway domain>
#   host | container   upstream address: `host` is a dotted path into the site dict to an
#                      IPv4 address (e.g. hosts.ragnarok.ip); `container` is a container
#                      on a Docker network Caddy shares (caddy_container_networks)
#   port, scheme       upstream port and http|https
#   insecure_upstream  true: do not verify the upstream's certificate (self-signed)
#   upstream_ca        verify the upstream against this CA (key of caddy_upstream_cas)
#   websocket          the app uses websockets: they survive a Caddy reload (5 minutes)
#   stream             long responses (live TV, event streams): flushed at once, no
#                      response timeout
#   host_header        original (default) or upstream: send Host = the upstream's
#                      address (apps that check Host, e.g. qBittorrent's CSRF check)
#   home               path to redirect "/" to (e.g. /admin/)
#   enabled            false: keep the slot, but no route and no DNS record
caddy_services: "{{ site.services | default([]) }}"
caddy_domain: "{{ gateway_domain }}"
caddy_email: "{{ site.email }}"

# CA certificates (public) for upstreams with `upstream_ca`, copied from the controller.
caddy_upstream_cas:
  vault: "{{ lookup('env', 'VAULT_CACERT') }}"

# Docker networks of other projects Caddy joins, for `container` upstreams, with the
# containers each one carries: Pi-hole's (web UI), Homepage's and Vaultwarden's (roles
# homepage and vaultwarden, which run before this one). A network that does not exist on
# the host (its role has not run there yet, e.g. `--tags caddy` on a new VM) is left out
# and its containers' routes are not checked (a warning names them); the next run that
# finds it joins it. A network joined or left recreates Caddy once.
caddy_container_networks:
  pihole_dns: [pihole]
  homepage_web: [homepage]
  vaultwarden_web: [vaultwarden]

# Routes only the operator's devices may use (the secrets enclave's: Vaultwarden and Vault):
# every other client gets 403. The sources are the enclave's operators (inventory
# group_vars/all/enclave.yml), matched on the real client address (no proxy in front of
# Caddy; Docker's DNAT keeps it).
caddy_admin_only_routes: [pass, vault]
caddy_admin_sources: "{{ enclave_admin_sources | default([]) }}"

# The secrets enclave, which only Caddy on this VM may reach (tasks/enclave_guard.yml): an
# nftables table here lets only Caddy's own network (gateway, its default route, no other
# container on it) open connections to Vault and Vaultwarden, and nothing else on this VM
# (other containers, the host) reach the enclave at all. Empty subnet: no guard.
caddy_enclave_subnet: "{{ (site.sdn | default({})).enclave.subnet | default('') }}"
caddy_enclave_targets:
  - {host: vault, port: 8200}
  - {host: vaultwarden, port: 8080}
caddy_enclave_guard_file: /etc/anvil/gateway-guard.nft

# DNS servers for the DNS-01 propagation check (public resolvers, so Pi-hole's split
# horizon does not interfere): site.dns.acme_resolvers.
caddy_dns_resolvers: "{{ site.dns.acme_resolvers }}"

# Hard cap, swap included; the Go runtime is told to stay below it.
caddy_mem_limit: 128m
caddy_gomemlimit: 100MiB
# Go's TLS client no longer offers RSA key exchange by default; old BMC firmware (iDRAC8)
# offers nothing else (no ECDHE). This re-enables it for every TLS client connection the
# process makes (upstreams, but also ACME and the Cloudflare API, whose servers pick
# ECDHE anyway). The server side is not affected: Caddy sets its own cipher list
# (ECDHE only), which the role checks (an RSA-key-exchange handshake to :443 must fail).
# Needs Go <= 1.26 (above).
caddy_godebug: tlsrsakex=1

# Secret: Vault KV v2, mount kv. cloudflare_dns_token: a Cloudflare API token limited to
# Zone.DNS edit on the site's zone.
caddy_vault_mount: kv
caddy_vault_path: "homelab/{{ inventory_hostname }}/caddy"
