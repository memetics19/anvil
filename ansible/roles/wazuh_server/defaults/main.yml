# Wazuh, the security monitor (docs/services.md, Wazuh): manager, indexer and dashboard in one
# compose project, as wazuh-docker's single-node deployment (v4.14.9) lays them out. Agents on
# the other hosts report to it (role wazuh_agent).
wazuh_server_version: 4.14.9
wazuh_server_dir: /opt/wazuh
wazuh_server_manager_image: wazuh/wazuh-manager:4.14.9@sha256:9d07740f780024600101d759ddab9a4413bdcb3412ccb81dccc143b3cdc702a2
wazuh_server_indexer_image: wazuh/wazuh-indexer:4.14.9@sha256:08a8d5a0f0416bdd97ca421b1b72fae97224c8fd99a143500b28b536ff6ac98c
wazuh_server_dashboard_image: wazuh/wazuh-dashboard:4.14.9@sha256:8c003c6e08151d962e2ed541a6a1a86ac723f01b5d5678fc53dcbe544e739e7a
wazuh_server_certs_image: wazuh/wazuh-certs-generator:0.0.4@sha256:369b4d58509aab074b188596870c81584f7120e653d9ef83c591f0f785dcf325
# The indexer's Java heap. Half of the VM's 8 GB goes to the indexer and its page cache.
wazuh_server_indexer_heap: 2g
# Published on the VM's lab address: agent events (1514) and enrollment (1515) for every
# host, and the dashboard (443) for the gateway only (port_guard). The API (55000) and the
# indexer (9200) stay inside the compose network.
wazuh_server_bind_ip: "{{ site.hosts[inventory_hostname].ip }}"
# Passwords, in Vault kv/homelab/wazuh. A missing one is generated and written there.
#   indexer_admin  the dashboard login (user admin) and the manager's indexer user
#   kibanaserver   the dashboard's own indexer user
#   api            the dashboard's API user (wazuh-wui)
#   enrollment     what an agent shows to enroll (role wazuh_agent reads it too)
wazuh_server_vault_mount: kv
wazuh_server_vault_path: homelab/wazuh
wazuh_server_secret_keys: [indexer_admin, kibanaserver, api, enrollment]
