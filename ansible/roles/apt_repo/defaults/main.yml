# The signed apt repository for the anvil .deb packages, on the netbird VM. apt-publish (a
# systemd timer) picks up each new vX.Y.Z release of the repository, checks its .deb files
# against the release's checksums.txt, rebuilds and signs the index, and swaps the new tree
# in. Caddy serves it read-only on apt_repo_port, which the Cloudflare tunnel publishes. The
# whole tree can be rebuilt from the releases and the key, so nothing here needs a backup.
apt_repo_github: memetics19/anvil
apt_repo_package: anvil
apt_repo_arches: [amd64, arm64]
apt_repo_suite: stable
apt_repo_component: main
apt_repo_dir: /opt/apt-repo
apt_repo_project: apt-repo
apt_repo_port: 8082
apt_repo_interval: 30min
# kv/<path>: private_key, public_key, fingerprint (scripts/apt-key-init.sh makes them).
apt_repo_vault_mount: kv
apt_repo_vault_path: homelab/apt/signing
# Role caddy's patched build, loaded by this role's tasks (caddy_image_resolved).
apt_repo_caddy_image: "{{ caddy_image_resolved }}"
