# Host metrics (CPU, memory, disks, network) for the monitoring stack
# (docs/monitoring.md). A release binary, pinned by version and checksum, run as its own
# user under a sandboxed systemd unit.
node_exporter_version: 1.12.1
node_exporter_arch: amd64
# sha256 of node_exporter-<version>.linux-<arch>.tar.gz (from the release's sha256sums.txt)
node_exporter_tarball_sha256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
# Listens on the host's lab address only, never on every address. Proxmox hosts set
# node_exporter_listen_ip in their group vars (their lab address is site.pve.ip).
node_exporter_listen_ip: "{{ site.hosts[inventory_hostname].ip }}"
node_exporter_port: 9100
node_exporter_binary: /usr/bin/node_exporter
node_exporter_unit_path: /usr/lib/systemd/system/node_exporter.service
node_exporter_unit_mode: "0644"
