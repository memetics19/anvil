# Filestash reads config.json only at start. The play sets force_handlers, so a failed task
# later in the run does not drop a pending restart.
- name: Restart filestash
  ansible.builtin.command:
    argv: [docker, compose, --project-name, filestash, --file, "{{ filestash_dir }}/docker-compose.yaml", restart, filestash]
    chdir: "{{ filestash_dir }}"
  changed_when: true
  when: not ansible_check_mode and 'filestash' not in filestash_compose_up | default([])

- name: Wait for filestash
  ansible.builtin.uri:
    url: "http://{{ filestash_bind_ip }}:{{ filestash_port }}/healthz"
    status_code: 200
  register: filestash_health_after
  retries: 20
  delay: 3
  until: filestash_health_after.status == 200
  when: not ansible_check_mode
