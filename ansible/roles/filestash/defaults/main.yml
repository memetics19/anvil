# Filestash (read-only S3 browser for the Ceph gateway) on ragnarok: its own compose
# project "filestash" in /opt/filestash, kept apart from the ARR project so a change here
# never touches the compose file that mounts the media library, and its state lives on the
# root disk (the media disk is nearly full).
filestash_dir: /opt/filestash
# Upstream publishes only "latest". The digest pins the build (2026-10-28).
filestash_image: machines/filestash:latest@sha256:724b1c058ffd615e3305689dcc12e838f67dd5c02da6a949a1630248e712ab57
# Filestash runs as its own host user (uid/gid 10001, created by the role), not as the
# image's uid 1000, which is the VM's first user (owner of the media library). Only that
# user can read the state directory (S3 keys and the admin hash in config.json).
filestash_uid: 10001
# The image's binary is mode 0730 for group 1000, so the process also gets that group to
# run it. It only sees its own state volume, owned by filestash_uid.
filestash_image_gid: 1000
filestash_port: 8334
# Published on the VM's LAN address only.
filestash_bind_ip: "{{ site.hosts[inventory_hostname].ip }}"
# Hard cap, swap included, so Filestash never pushes the VM into swap.
filestash_mem_limit: 256m
# Secrets: Vault KV v2, mount kv. admin_password is generated by this role (straight into
# Vault); s3_access_key/s3_secret_key are written by the ceph_single role.
filestash_vault_mount: kv
filestash_vault_path: "homelab/{{ inventory_hostname }}/filestash"
# S3 backend: the Ceph RADOS Gateway on the Proxmox host, read-only user "filestash".
filestash_s3_endpoint: "http://{{ site.pve.ip }}:7480"
filestash_s3_region: us-east-1
filestash_s3_path: /tfstate/
filestash_label: Ceph S3
# Login name on the Filestash login page (the password is admin_password).
filestash_admin_user: admin
filestash_repo_scripts: "{{ playbook_dir }}/../../scripts"
