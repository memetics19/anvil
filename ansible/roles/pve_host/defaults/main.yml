pve_host_packages: [netbird, nmap, tcpdump, chrony, ipmitool]
pve_host_netbird_key_url: https://pkgs.netbird.io/debian/public.key
pve_host_netbird_keyring: /usr/share/keyrings/netbird-archive-keyring.gpg
pve_host_api_role: TerraformProv
pve_host_api_user: terraform@pve
pve_host_api_token_id: iac
pve_host_api_keychain_account: pve-api-token
# Privileges for the bpg/proxmox provider: VMs, cloud-init, SDN, storage content, disk import.
pve_host_api_privs:
  - Datastore.Allocate
  - Datastore.AllocateSpace
  - Datastore.AllocateTemplate
  - Datastore.Audit
  - Pool.Allocate
  - Pool.Audit
  - SDN.Allocate
  - SDN.Audit
  - SDN.Use
  - Sys.Audit
  - Sys.Console
  - Sys.Modify
  - VM.Allocate
  - VM.Audit
  - VM.Clone
  - VM.Config.CDROM
  - VM.Config.CPU
  - VM.Config.Cloudinit
  - VM.Config.Disk
  - VM.Config.HWType
  - VM.Config.Memory
  - VM.Config.Network
  - VM.Config.Options
  - VM.Migrate
  - VM.Monitor
  - VM.PowerMgmt

# Read-only API token for the Homepage dashboard (role homepage): user homepage@pve (no
# password, so no login) and a privilege-separated token, each with PVEAuditor on /. The
# token's secret goes from pveum straight into Vault (stdin), key token_secret. Tag homepage.
pve_host_homepage_user: homepage@pve
pve_host_homepage_token_id: homepage
pve_host_homepage_role: PVEAuditor
pve_host_homepage_vault_mount: kv
pve_host_homepage_vault_path: homelab/pve/homepage
pve_host_repo_scripts: "{{ playbook_dir }}/../../scripts"
