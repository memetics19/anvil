- name: The allowed clients are addresses
  ansible.builtin.assert:
    that:
      - smartctl_exporter_allow | length > 0
      - smartctl_exporter_allow | reject('match', '^([0-9]{1,3}[.]){3}[0-9]{1,3}(/[0-9]{1,2})?$') | list | length == 0
    fail_msg: smartctl_exporter_allow must list the scraper's addresses
    quiet: true

- name: Smartmontools
  ansible.builtin.apt:
    name: smartmontools
    state: present

- name: Read the installed smartctl_exporter version
  ansible.builtin.command: "{{ smartctl_exporter_binary }} --version"
  register: smartctl_exporter_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install smartctl_exporter from the release tarball
  when: >-
    smartctl_exporter_installed.rc != 0
    or ('version ' ~ smartctl_exporter_version ~ ' ') not in (smartctl_exporter_installed.stdout ~ smartctl_exporter_installed.stderr)
  vars:
    smartctl_exporter_dist: "smartctl_exporter-{{ smartctl_exporter_version }}.linux-{{ smartctl_exporter_arch }}"
  block:
    - name: Download the release tarball
      ansible.builtin.get_url:
        url: "https://github.com/prometheus-community/smartctl_exporter/releases/download/v{{ smartctl_exporter_version }}/{{ smartctl_exporter_dist }}.tar.gz"
        dest: "/tmp/{{ smartctl_exporter_dist }}.tar.gz"
        checksum: "sha256:{{ smartctl_exporter_tarball_sha256 }}"
        mode: "0644"

    # A check run downloads nothing, so there is nothing to unpack or install yet.
    - name: Would install smartctl_exporter
      ansible.builtin.debug:
        msg: "would install smartctl_exporter {{ smartctl_exporter_version }}"
      changed_when: true
      when: ansible_check_mode

    - name: Unpack the tarball
      ansible.builtin.unarchive:
        src: "/tmp/{{ smartctl_exporter_dist }}.tar.gz"
        dest: /tmp
        remote_src: true
      when: not ansible_check_mode

    - name: Install the binary
      ansible.builtin.copy:
        src: "/tmp/{{ smartctl_exporter_dist }}/smartctl_exporter"
        dest: "{{ smartctl_exporter_binary }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart smartctl_exporter
      when: not ansible_check_mode

# The download is not left behind: an executable in /tmp is what the security smoke test
# looks for.
- name: No download left in /tmp
  ansible.builtin.file:
    path: "/tmp/smartctl_exporter-{{ smartctl_exporter_version }}.linux-{{ smartctl_exporter_arch }}{{ item }}"
    state: absent
  loop: ["", .tar.gz]

- name: Systemd unit for smartctl_exporter
  ansible.builtin.template:
    src: smartctl_exporter.service.j2
    dest: "{{ smartctl_exporter_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart smartctl_exporter

- name: Apply unit changes before starting
  ansible.builtin.meta: flush_handlers

- name: Smartctl_exporter running and enabled
  ansible.builtin.systemd_service:
    name: smartctl_exporter
    enabled: true
    state: started
  when: not (ansible_check_mode and smartctl_exporter_installed.rc != 0)

# From the node itself (localhost is allowed): it reports at least one disk.
- name: Smartctl_exporter reports the disks
  ansible.builtin.uri:
    url: "http://{{ smartctl_exporter_listen_ip }}:{{ smartctl_exporter_port }}/metrics"
    return_content: true
  register: smartctl_exporter_up
  retries: 15
  delay: 4
  until: smartctl_exporter_up.status == 200 and 'smartctl_device_smart_status{' in smartctl_exporter_up.content
  when: not ansible_check_mode
