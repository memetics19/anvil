# apt-cacher-ng for the enclave (see templates/acng.conf.j2). The config is written before
# the package is installed (apt keeps an existing conffile), so it never listens anywhere
# but the enclave gateway address.
- name: Apt cache config directory
  ansible.builtin.file:
    path: "{{ pve_enclave_aptcache_conf | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Apt cache config (gateway address only, Debian and Ubuntu archives only)
  ansible.builtin.template:
    src: acng.conf.j2
    dest: "{{ pve_enclave_aptcache_conf }}"
    owner: root
    group: root
    mode: "0644"
  register: pve_enclave_acng_conf

- name: Apt-cacher-ng
  ansible.builtin.apt:
    name: apt-cacher-ng
    state: present
    install_recommends: false
  environment:
    DEBIAN_FRONTEND: noninteractive

# After the package (it ships security.conf). The report page can start maintenance jobs:
# it needs a login. The password is generated
# straight into Vault (never displayed) and written only into security.conf (mode 640).
- name: Apt cache admin password in Vault (digests only)
  ansible.builtin.command:
    argv: ["{{ pve_enclave_repo_scripts }}/vault-kv-digests.sh", "{{ pve_enclave_aptcache_vault_path }}", "kv"]
  delegate_to: localhost
  become: false
  register: pve_enclave_acng_digests
  changed_when: false
  check_mode: false

- name: Generate the apt cache admin password into Vault
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail; openssl rand -hex 24 | tr -d '\n' |
      vault kv put -mount=kv {{ pve_enclave_aptcache_vault_path }} admin_password=- >/dev/null
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: true
  when: "'admin_password' not in (pve_enclave_acng_digests.stdout_lines | map('split', ' ') | map('first') | list)"

- name: Read the apt cache admin password
  ansible.builtin.set_fact:
    pve_enclave_acng_admin: >-
      {{ lookup('community.hashi_vault.vault_kv2_get', pve_enclave_aptcache_vault_path,
                engine_mount_point='kv',
                url=lookup('env', 'VAULT_ADDR'),
                token=lookup('env', 'VAULT_TOKEN'),
                ca_cert=lookup('env', 'VAULT_CACERT')).secret.admin_password | default('') }}
  no_log: true
  when: not ansible_check_mode or 'admin_password' in (pve_enclave_acng_digests.stdout_lines | map('split', ' ') | map('first') | list)

- name: The admin password is a plain token
  ansible.builtin.assert:
    that: pve_enclave_acng_admin is match('^[0-9a-f]{32,}$')
    fail_msg: "kv/{{ pve_enclave_aptcache_vault_path }}: admin_password must be 32+ hex characters"
    quiet: true
  when: pve_enclave_acng_admin is defined

- name: Apt cache admin login (report page and maintenance)
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (role pve_enclave). Login for the report page and maintenance
      # jobs; the password is in Vault (kv/{{ pve_enclave_aptcache_vault_path }}).
      AdminAuth: admin:{{ pve_enclave_acng_admin }}
    dest: /etc/apt-cacher-ng/security.conf
    owner: root
    group: apt-cacher-ng
    mode: "0640"
  register: pve_enclave_acng_security
  no_log: true
  diff: false
  when: pve_enclave_acng_admin is defined

- name: Apt cache running
  ansible.builtin.systemd_service:
    name: apt-cacher-ng
    enabled: true
    state: started
  when: not ansible_check_mode

# Without its own handler: restart only when the config changed in this run.
- name: Restart the apt cache for a new config
  ansible.builtin.systemd_service:
    name: apt-cacher-ng
    state: restarted
  when: (pve_enclave_acng_conf is changed or pve_enclave_acng_security is changed) and not ansible_check_mode

- name: Listening sockets of the apt cache
  ansible.builtin.shell:
    cmd: set -o pipefail; ss -Hltnp | grep -F '"apt-cacher-ng"' | awk '{print $4}' | sort -u
    executable: /bin/bash
  register: pve_enclave_acng_listen
  changed_when: false
  check_mode: false
  until: pve_enclave_acng_listen.stdout_lines | length > 0
  retries: 5
  delay: 2
  when: not ansible_check_mode

- name: The apt cache listens on the enclave gateway address only
  ansible.builtin.assert:
    that: pve_enclave_acng_listen.stdout_lines == [pve_enclave_gateway ~ ':' ~ pve_enclave_aptcache_port]
    fail_msg: "apt-cacher-ng listens on {{ pve_enclave_acng_listen.stdout_lines | length }} socket(s) other than the enclave gateway address"
    quiet: true
  when: not ansible_check_mode
