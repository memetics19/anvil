# The secrets enclave on the Proxmox host (make enclave, playbooks/enclave.yml): Vault and
# Vaultwarden on the SDN vnet `secrets` (simple zone `enclave`, Terraform sdn.tf), a bridge
# with no physical port. The host is its only router and does no NAT for it. This role:
#   - firewall (tag firewall): nftables table `inet enclave`, default drop for everything
#     to, from and through the vnet except the allow-list below; applied under a timed
#     rollback, loaded at boot before the guests start (enclave-firewall.service);
#   - smtp_relay (tag firewall): the named set of the SMTP relay's addresses, refreshed by
#     a timer (the one mail hole for Vaultwarden);
#   - sdn (tag sdn): applies the pending SDN config (pvesh set /cluster/sdn) under the
#     timed rollback of pve_network (net-rollback.sh on interfaces.d/sdn);
#   - apt cache, NTP and the cloud-init vendor data (tags aptcache, ntp, cloudinit).
# Addresses come from the site dict (Vault). A rule for a host that is not on the enclave
# (yet) never matches: every rule is tied to the vnet's interface.

pve_enclave_vnet: secrets
pve_enclave_subnet: "{{ site.sdn.enclave.subnet }}"
pve_enclave_gateway: "{{ site.sdn.enclave.gateway }}"
pve_enclave_prefix: "{{ pve_enclave_subnet.split('/')[1] }}"

# --- timed rollback (same pattern as pve_network) ---------------------------------------------
pve_enclave_rollback_after: 120
# Empty: the Ansible controller as the host sees it over SSH (SSH_CLIENT). No fallback.
pve_enclave_rollback_target: ""
pve_enclave_backup_dir: /var/backups/pve-network
pve_enclave_sdn_file: /etc/network/interfaces.d/sdn
# Installed by pve_network (make host-network).
pve_enclave_net_rollback_script: /usr/local/sbin/net-rollback.sh

# --- firewall ---------------------------------------------------------------------------------
pve_enclave_etc: /etc/enclave
pve_enclave_fw_rollback_script: /usr/local/sbin/enclave-fw-rollback.sh
# Who may reach the enclave as an operator (SSH, Vault's API): site.admin_sources, CIDRs (the
# lab network, the NetBird range, the operator's home Wi-Fi address). Lab VMs that run
# workloads (some with public tunnels) are not operators: their lab addresses are excluded.
# The netbird VM stays an admin source: NetBird clients reach the lab through it (masqueraded).
pve_enclave_admin_sources: "{{ site.admin_sources }}"
pve_enclave_admin_exclude_hosts: [apps, frigate, ragnarok]
# The enclave's VMs (site.hosts.<name>.ip) and the hosts it talks to.
pve_enclave_vault_host: vault
pve_enclave_vaultwarden_host: vaultwarden
# The service gateway (Caddy, published on its lab address; Docker masquerades its
# upstream connections to that address).
pve_enclave_gateway_host: apps
# Pi-hole (on apps): Vaultwarden's resolver, for the SMTP relay's name only.
pve_enclave_dns_host: apps
# Monitoring (Task 13f): site.hosts.<this>.ip, when present, may scrape both VMs.
pve_enclave_monitoring_host: monitoring
pve_enclave_vault_port: 8200
pve_enclave_vaultwarden_port: 8080
pve_enclave_node_exporter_port: 9100
pve_enclave_ssh_port: 22
# Ceph RGW (Vaultwarden's backups), on the host's lab address.
pve_enclave_rgw_port: 7480
pve_enclave_aptcache_port: 3142

# --- the mail hole ----------------------------------------------------------------------------
# Vaultwarden's SMTP login lives in Vault (role vaultwarden). The relay's host name (and port)
# is read from there at run time, with the same defaults as that role; the refresh timer
# resolves it through Pi-hole (the resolver Vaultwarden uses) and adds the A records to the
# set, each kept for pve_enclave_smtp_keep. A failed or empty lookup changes nothing; only
# public unicast addresses are taken, at most pve_enclave_smtp_max per lookup. Without an
# SMTP login in Vault the set stays empty and no mail leaves.
pve_enclave_smtp_vault_mount: kv
pve_enclave_smtp_vault_path: homelab/apps/vaultwarden
pve_enclave_smtp_default_host: smtp.gmail.com
pve_enclave_smtp_default_port: 587
pve_enclave_smtp_refresh: 10min
pve_enclave_smtp_keep: 24h
pve_enclave_smtp_max: 16
pve_enclave_repo_scripts: "{{ playbook_dir }}/../../scripts"
