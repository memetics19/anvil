# Managed by anvil (role monitoring). Alert rules for every host (node_exporter). Each one is
# something a person must act on, waits before it fires (for:) and links to its fix
# (docs/monitoring.md, Alerts). Two levels: critical (now) and warning (the morning digest).
groups:
  - name: hosts
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.host }} is down"
          description: "node_exporter on {{ $labels.host }} has not answered for 5 minutes. The host or its network is down."
          runbook: "https://memetics19.github.io/anvil/monitoring/#hostdown"

      - alert: DiskAlmostFull
        expr: |
          100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|efivarfs|ramfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|efivarfs|ramfs"} < 5
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.host }}: {{ $labels.mountpoint }} is almost full"
          description: "Less than 5% free on {{ $labels.mountpoint }} ({{ $value | printf \"%.1f\" }}% left)."
          runbook: "https://memetics19.github.io/anvil/monitoring/#diskalmostfull"

      - alert: DiskFillingUp
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|efivarfs|ramfs"}[6h], 3 * 86400) < 0
          and 100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|efivarfs|ramfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|efivarfs|ramfs"} < 25
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }}: {{ $labels.mountpoint }} will be full within 3 days"
          description: "At the rate of the last 6 hours, {{ $labels.mountpoint }} runs out of space in less than 3 days."
          runbook: "https://memetics19.github.io/anvil/monitoring/#diskfillingup"

      - alert: MemoryNearlyGone
        expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 5
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} is nearly out of memory"
          description: "Less than 5% of memory has been available for 15 minutes. The kernel may start killing processes."
          runbook: "https://memetics19.github.io/anvil/monitoring/#memorynearlygone"

  - name: monitoring
    rules:
      # When nothing arrives, every other rule is silent. This one is not.
      - alert: MonitoringBlind
        expr: absent(up{job="node"})
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "Monitoring receives no host metrics"
          description: "No node_exporter data has arrived for 10 minutes: vmagent or VictoriaMetrics is down, so no other alert can fire."
          runbook: "https://memetics19.github.io/anvil/monitoring/#monitoringblind"
