# Managed by anvil (role monitoring). Alert rules for the internet speed test (prometheus_speedtest,
# once an hour). Each one waits before it fires (for:) and links to its fix (docs/monitoring.md,
# Alerts). Slow is measured against the line's own usual speed (its 7-day median), so no plan
# speed is written here and the alert follows a plan change.
groups:
  - name: speedtest
    rules:
      - alert: SpeedtestFailing
        expr: up{job="speedtest"} == 0
        for: 3h
        labels: {severity: warning}
        annotations:
          summary: "The internet speed test has failed for 3 hours"
          description: >-
            The hourly speed test has not completed for 3 hours, so the speed panels are empty and
            InternetSlow cannot fire. The internet itself may be fine.
          runbook: "https://memetics19.github.io/anvil/monitoring/#speedtestfailing"

      - alert: InternetSlow
        expr: >-
          avg_over_time(speedtest_download_speed_bps[3h])
          < 0.4 * quantile_over_time(0.5, speedtest_download_speed_bps[7d])
          and count_over_time(speedtest_download_speed_bps[7d]) > 24
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "The internet is much slower than usual"
          description: >-
            Download speed over the last 3 hours is under 40% of the line's usual speed (its 7-day
            median). Check the router and other heavy downloads, then the ISP.
          runbook: "https://memetics19.github.io/anvil/monitoring/#internetslow"
