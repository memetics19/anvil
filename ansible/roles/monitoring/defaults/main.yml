# Metrics, dashboards and (next) alerts for the lab (docs/monitoring.md), on the monitoring
# VM: VictoriaMetrics stores, vmagent scrapes, Grafana shows. One compose project.
monitoring_dir: /opt/monitoring
monitoring_victoriametrics_image: victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
monitoring_vmagent_image: victoriametrics/vmagent:v1.155.0@sha256:8e3c03905be15bba8312d4868e8ae6f9fc2fefee0a41d544472034249ca42bb4
monitoring_grafana_image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
monitoring_vmalert_image: victoriametrics/vmalert:v1.155.0@sha256:3256cba5ddaca5974eae6141105cec4ce37871f1c213f0a5c267ec0111bc68e1
monitoring_alertmanager_image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
monitoring_blackbox_image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
# Grafana's plugins, installed at start at these versions: the OpenSearch data source reads
# Wazuh's alerts. Signed by Grafana Labs.
monitoring_grafana_plugins: [grafana-opensearch-datasource@2.34.6]
# How long the metrics are kept.
monitoring_retention: 90d
monitoring_scrape_interval: 30s
# Published on the VM's lab address, both guarded (port_guard, host_vars/monitoring.yml):
# Grafana, for the gateway, Pulse and the admin sources, and Alertmanager's API, for Wazuh's
# alerts. VictoriaMetrics, vmagent, vmalert and the blackbox exporter talk inside the compose
# network only.
monitoring_bind_ip: "{{ site.hosts[inventory_hostname].ip }}"
monitoring_grafana_port: 3000
monitoring_alertmanager_port: 9093
# Memory caps.
monitoring_victoriametrics_mem_limit: 1g
monitoring_vmagent_mem_limit: 256m
monitoring_grafana_mem_limit: 512m
monitoring_vmalert_mem_limit: 128m
monitoring_alertmanager_mem_limit: 128m
monitoring_blackbox_mem_limit: 64m

# --- Wazuh in Grafana (docs/monitoring.md, Security) --------------------------------------------
# Grafana reads Wazuh's alerts from its indexer, as the read-only user grafana (role
# wazuh_server; its password is grafana_reader in Wazuh's Vault path). TLS is checked against
# Wazuh's own CA, read from the Wazuh VM. Off when the lab has no Wazuh VM.
monitoring_wazuh_host: "{{ groups['wazuh_servers'] | default([]) | first | default('') }}"
monitoring_wazuh_vault_path: homelab/wazuh
monitoring_wazuh_ca: /opt/wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem

# --- The internet (docs/monitoring.md, Internet) ------------------------------------------------
# The blackbox exporter checks, every scrape: ping to the home router and to public resolvers,
# a lookup through Pi-hole, and two web pages. scope internet: the ISP's side.
monitoring_ping_targets:
  - {name: router, address: "{{ site.pve.uplink_gw | default('') }}", scope: local}
  - {name: cloudflare, address: 1.1.1.1, scope: internet}
  - {name: google, address: 8.8.8.8, scope: internet}
  - {name: quad9, address: 9.9.9.9, scope: internet}
monitoring_dns_targets:
  - {name: pihole, address: "{{ site.hosts.apps.ip | default('') }}"}
monitoring_dns_query: example.com
monitoring_http_targets:
  - {name: google, url: "https://www.google.com/generate_204"}
  - {name: cloudflare, url: "https://www.cloudflare.com/cdn-cgi/trace"}

# --- Alerts (docs/monitoring.md, Alerts) ------------------------------------------------------
# vmalert evaluates the rules in files/rules every minute. Alertmanager groups them and sends
# them to ntfy: critical at once on its own topic, warnings once a morning on another.
monitoring_rules_interval: 1m
# ntfy: Vault kv/<monitoring_ntfy_vault_path>, keys url (ntfy's base URL, no topic) and token
# (a publish token of a write-only ntfy user; docs/monitoring.md says how to make one).
monitoring_ntfy_vault_path: "homelab/{{ inventory_hostname }}/ntfy"
monitoring_ntfy_topic_critical: lab-critical
monitoring_ntfy_topic_warning: lab-warning
# Warnings are held and sent only in this window, as a morning digest. In UTC, so it needs
# no time zone data in the image: 02:30 to 03:30 UTC is 08:00 to 09:00 in India.
monitoring_warning_window_utc: {start: "02:30", end: "03:30"}

# What is scraped: node_exporter on every host of the inventory group node_exporter, and on
# the Proxmox host, by their lab addresses. The secrets enclave runs none: nothing may reach in.
monitoring_node_targets: >-
  {%- set out = [] -%}
  {%- for h in groups['node_exporter'] | default([]) if site.hosts[h].ip is defined -%}
  {%- set _ = out.append({'name': h, 'address': site.hosts[h].ip ~ ':9100'}) -%}
  {%- endfor -%}
  {%- set _ = out.append({'name': site.pve.hostname | default('pve'), 'address': site.pve.ip ~ ':9100'}) -%}
  {{ out }}

# Frigate's metrics: role frigate_stack serves /api/metrics on this port of its lab address
# (frigate_stack_metrics_port) to this VM only. None without a Frigate host.
monitoring_frigate_port: 9711
monitoring_frigate_target: "{{ (site.hosts.frigate.ip ~ ':' ~ monitoring_frigate_port) if site.hosts.frigate.ip is defined else '' }}"

# Pi-hole's exporter (role pihole, pihole_exporter_port) on the apps VM's lab address. None
# without an apps host.
monitoring_pihole_port: 9617
monitoring_pihole_target: "{{ (site.hosts.apps.ip ~ ':' ~ monitoring_pihole_port) if site.hosts.apps.ip is defined else '' }}"

# Disk health (role smartctl_exporter): the main Proxmox host on its lab address and each other
# cluster member on its static address (the exporters answer only this VM).
monitoring_smart_port: 9633
monitoring_smart_targets: >-
  {%- set out = [{'name': site.pve.hostname | default('pve'), 'address': site.pve.ip ~ ':' ~ monitoring_smart_port}] -%}
  {%- for m in site.cluster.members | default([]) if site.provision.machines[m].network.cidr is defined -%}
  {%- set _ = out.append({'name': m, 'address': (site.provision.machines[m].network.cidr | split('/') | first) ~ ':' ~ monitoring_smart_port}) -%}
  {%- endfor -%}
  {{ out }}

# Grafana's gateway name (site.services) and its login through Authentik (OpenID Connect).
# Authentik's client is role authentik (client id grafana). Its secret is in Vault next to
# Authentik's own, written by that role.
monitoring_grafana_name: grafana
monitoring_grafana_url: "https://{{ monitoring_grafana_name }}.{{ gateway_domain }}"
monitoring_authentik_url: "https://{{ authentik_auth_name | default('auth') }}.{{ gateway_domain }}"
# Grafana's server calls Authentik's token and userinfo URLs itself. The VMs resolve through
# site.guest_dns (public resolvers), which do not know the gateway names, so the Grafana
# container gets Authentik's name at the gateway's lab address. The gateway serves the
# wildcard certificate, so TLS still checks the name.
monitoring_gateway_ip: "{{ site.hosts[groups['apps_servers'] | first].ip }}"
monitoring_oidc_client_id: grafana
monitoring_authentik_vault_path: "homelab/{{ groups['identity_servers'] | first | default('identity') }}/authentik"
# Grafana's own admin login, for when Authentik is down: Vault kv/<path>, key admin_password,
# generated there when missing.
monitoring_vault_mount: kv
monitoring_vault_path: "homelab/{{ inventory_hostname }}/grafana"
