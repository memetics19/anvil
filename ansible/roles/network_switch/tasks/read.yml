# Show commands only (switch-cli.sh --show-only refuses anything else). Sets network_switch__outputs.
- name: Show commands on the switch
  ansible.builtin.command:
    argv: ["{{ network_switch_cli }}", --show-only, "{{ network_switch__login.username }}", "{{ network_switch_host }}"]
    stdin: "{{ network_switch_ports | switch_read_commands(network_switch_dhcp_snooping) | join('\n') }}"
  environment:
    SSHPASS: "{{ network_switch__login.password }}"
    SWITCH_KNOWN_HOSTS: "{{ network_switch_known_hosts }}"
  register: network_switch__read
  changed_when: false
  failed_when: false
  no_log: true

- name: The show commands ran
  ansible.builtin.include_tasks: check.yml
  vars:
    network_switch__result: "{{ network_switch__read }}"
    network_switch__step: reading the state

- name: Switch outputs by command
  ansible.builtin.set_fact:
    network_switch__outputs: "{{ network_switch__read.stdout | switch_state }}"
