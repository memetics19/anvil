# Writes one compose file and brings up only the services whose container does not match
# it (never a project-wide `docker compose up`, never `down`, never removes anything).
# Compose stores each service's config hash as a container label. The wanted hashes come
# from the rendered file on stdin, so check mode names exactly the services a run would
# recreate, and a bring-up that failed after the file was written is retried by the next
# run (the hashes still differ).
# Containers of the project that the file does not name (orphans) and containers whose
# labels cannot be read are reported and left alone.
# Services in compose_project_skip_services are left to the caller.
# Result for the caller: compose_project_plan.up (the services brought up).

# The project directory and file must never be inside a protected path (the media library).
- name: Resolve the project paths on the host
  ansible.builtin.command:
    argv: "{{ ['realpath', '-m', '--', compose_project_dir, compose_project_file] + compose_project_protected_paths }}"
  register: compose_project_realpaths
  changed_when: false
  check_mode: false

- name: The project is outside every protected path
  ansible.builtin.assert:
    that:
      - compose_project_realpaths.stdout_lines | length == 2 + compose_project_protected_paths | length
      - >-
        compose_project_realpaths.stdout_lines[:2]
        | select('match', '^(' ~ (compose_project_realpaths.stdout_lines[2:] | map('regex_escape') | join('|')) ~ ')(/|$)')
        | list | length == 0
    fail_msg: "{{ compose_project_name }}: the project directory or file is inside a protected path"
    quiet: true

- name: Config hash of each service in the rendered file
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ compose_project_name }}"
      - --project-directory
      - "{{ compose_project_dir }}"
      - --file
      - "{{ '-' if compose_project_write_file | bool else compose_project_file }}"
      - config
      - --hash
      - "*"
    stdin: "{{ compose_project_content if compose_project_write_file | bool else omit }}"
  register: compose_project_hash_want
  changed_when: false
  check_mode: false

# One line per container: name|service|config-hash|compose-version (fields may be empty).
- name: Config hash of each container of the project
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --all
      - --filter
      - label=com.docker.compose.project={{ compose_project_name }}
      - --format
      - >-
        {{ '{{' }}.Names{{ '}}' }}|{{ '{{' }}.Label "com.docker.compose.service"{{ '}}'
        }}|{{ '{{' }}.Label "com.docker.compose.config-hash"{{ '}}'
        }}|{{ '{{' }}.Label "com.docker.compose.version"{{ '}}' }}
  register: compose_project_hash_have
  changed_when: false
  check_mode: false

# up: wanted service with no container, or a container whose hash differs.
# legacy: made by docker-compose v1 (another hash scheme): reported, not recreated.
# unknown: a container whose service or hash label is missing: reported, not recreated.
# orphans: containers of the project for a service the file does not name: reported only.
- name: Work out which services differ from the file
  ansible.builtin.set_fact:
    compose_project_plan: >-
      {%- set want = {} -%}
      {%- for l in compose_project_hash_want.stdout_lines if l.split() | length == 2 -%}
      {%- set _ = want.update({l.split()[0]: l.split()[1]}) -%}
      {%- endfor -%}
      {%- set have = {} -%}
      {%- set unknown = [] -%}
      {%- set unknown_services = [] -%}
      {%- set orphans = [] -%}
      {%- for l in compose_project_hash_have.stdout_lines -%}
      {%- set f = l.split('|') -%}
      {%- if f | length != 4 or f[1] == '' or f[2] == '' -%}
      {%- set _ = unknown.append(f[0] if f[0] else l) -%}
      {%- if f | length == 4 and f[1] -%}{%- set _ = unknown_services.append(f[1]) -%}{%- endif -%}
      {%- elif f[1] not in want -%}
      {%- set _ = orphans.append(f[0]) -%}
      {%- else -%}
      {%- set _ = have.update({f[1]: {'hash': f[2], 'version': f[3] or '0'}}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set up = [] -%}
      {%- set legacy = [] -%}
      {%- for name in want | sort if name not in unknown_services and name not in compose_project_skip_services -%}
      {%- if name not in have -%}{%- set _ = up.append(name) -%}
      {%- elif have[name].hash != want[name] and have[name].version is version('2', '<') -%}{%- set _ = legacy.append(name) -%}
      {%- elif have[name].hash != want[name] -%}{%- set _ = up.append(name) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ {'up': up, 'legacy': legacy, 'unknown': unknown, 'orphans': orphans} }}

- name: Compose services to bring up
  ansible.builtin.debug:
    msg: >-
      {{ compose_project_name }}: bring up {{ compose_project_plan.up | join(', ') if compose_project_plan.up else 'none' }}{{
      '; managed by the calling role: ' ~ compose_project_skip_services | join(', ') if compose_project_skip_services else '' }}{{
      '; created by docker-compose v1, hash not comparable (not recreated): '
      ~ compose_project_plan.legacy | join(', ') if compose_project_plan.legacy else '' }}{{
      '; WARNING labels unreadable (left alone): ' ~ compose_project_plan.unknown | join(', ')
      if compose_project_plan.unknown else '' }}{{
      '; WARNING running but not in the file (left alone): ' ~ compose_project_plan.orphans | join(', ')
      if compose_project_plan.orphans else '' }}
  # The bring-up below does not run in check mode; count it here instead.
  changed_when: ansible_check_mode and compose_project_plan.up | length > 0

- name: Compose file
  ansible.builtin.copy:
    content: "{{ compose_project_content }}"
    dest: "{{ compose_project_file }}"
    owner: "{{ compose_project_owner }}"
    group: "{{ compose_project_group }}"
    mode: "{{ compose_project_mode }}"
  when: compose_project_write_file | bool

- name: Bring up the services that differ
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'compose', '--project-name', compose_project_name, '--project-directory', compose_project_dir,
          '--file', compose_project_file, 'up', '--detach', '--no-deps'] + compose_project_plan.up }}
    chdir: "{{ compose_project_dir }}"
  when: not ansible_check_mode and compose_project_plan.up | length > 0
  changed_when: true
