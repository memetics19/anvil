# Watchers on the assistant VM: the package, its settings, the secrets from Vault as root-only
# files, and one systemd timer per watcher. Nothing runs here: the timers do.

# Missing is fine: the watchers then log what they would send, and eBay is skipped.
- name: The Gotify token and eBay keys from Vault (none yet is fine)
  ansible.builtin.set_fact:
    watchers_secret: >-
      {{ (lookup('community.hashi_vault.vault_kv2_get', watchers_vault_path,
                 engine_mount_point=watchers_vault_mount,
                 url=lookup('env', 'VAULT_ADDR'),
                 token=lookup('env', 'VAULT_TOKEN'),
                 ca_cert=lookup('env', 'VAULT_CACERT'),
                 errors='ignore') | default({}, true)).secret | default({}, true) }}
  no_log: true

- name: Directories of the watchers
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ watchers_dir }}", mode: "0755"}
    - {path: "{{ watchers_config_dir }}", mode: "0755"}

- name: The watchers package
  ansible.builtin.copy:
    src: watchers
    dest: "{{ watchers_dir }}/"
    owner: root
    group: root
    mode: u=rwX,go=rX

- name: Settings of the watchers
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ watchers_config_dir }}/config.json"
    owner: root
    group: root
    mode: "0644"

# Root-only. The units get them as systemd credentials, never in the environment or on argv.
- name: The secrets, root-only
  ansible.builtin.copy:
    content: "{{ watchers_secret[item.key] }}\n"
    dest: "{{ watchers_config_dir }}/{{ item.value }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ watchers_secret_files | dict2items | selectattr('key', 'in', watchers_secret | list) }}"
  loop_control:
    label: "{{ item.value }}"
  no_log: true

- name: Units of the watchers
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: watchers@.service.j2, dest: watchers@.service}
    - {src: watchers.timer.j2, dest: watchers-gpu.timer, name: gpu, interval: "{{ watchers_gpu_interval }}"}
    - {src: watchers.timer.j2, dest: watchers-yakshagana.timer, name: yakshagana,
       interval: "{{ watchers_yakshagana_interval }}"}
  loop_control:
    label: "{{ item.dest }}"
  register: watchers_units

- name: Timers of the watchers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: "{{ watchers_units.changed }}"
  loop: [watchers-gpu.timer, watchers-yakshagana.timer]
  when: not (ansible_check_mode and watchers_units.changed)
