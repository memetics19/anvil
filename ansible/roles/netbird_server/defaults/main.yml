# Self-hosted NetBird on the netbird VM (Task 13c), next to the NetBird cloud client.
# Compose project "netbird-server": the combined server (management, signal, relay and the
# embedded identity provider), the dashboard, and Caddy in front of both. The public name
# is site.netbird_domain, a DNS-only record for the home's public address. The router and
# the Proxmox host forward TCP 443 to Caddy here (docs/setup.md, Self-hosted NetBird). The site key is optional: without it the role does nothing.
netbird_server_dir: /opt/netbird-server
# Pinned by tag and digest. A bump is a deliberate change of these lines.
netbird_server_image: netbirdio/netbird-server:0.82.0@sha256:7b5b53b2dc8bc25639f791cf72d47cf86911894ff3f8a97cb79bab9be958109c
netbird_server_dashboard_image: netbirdio/dashboard:v2.96.0@sha256:340b13c00b84349572a2acc5605e907cb09250a9e6461c757097eabdb8e02f2c
# Role caddy's patched build, loaded by this role's tasks (caddy_image_resolved).
netbird_server_caddy_image: "{{ caddy_image_resolved }}"
# Memory caps (the VM has 3 GB for everything it runs).
netbird_server_mem_limit: 512m
netbird_server_dashboard_mem_limit: 96m
netbird_server_caddy_mem_limit: 96m
# Caddy on the VM's lab address. The Proxmox host forwards TCP 443 from the router here
# (role pve_network, pve_network_netbird_forward).
netbird_server_https_port: 8443
# Connections forwarded to Caddy are marked, and their replies go to the Proxmox host
# through a table of their own (rule priority below NetBird's 105 and 110), so a reply to a
# home address or a NetBird peer does not follow a NetBird client's route into its tunnel
# (tasks/reply_route.yml). NetBird's own table is 7120.
netbird_server_reply_mark: "0x2a1"
netbird_server_reply_rule_priority: 100
netbird_server_reply_table: 2601
netbird_server_reply_nft: /etc/anvil-netbird-reply.nft
# The server's plain HTTP port, on the VM's loopback only: the role's API calls.
netbird_server_api_port: 8089
# Its Prometheus metrics (management, signal and relay), on the VM's lab address for the
# monitoring VM's scrape (job netbird_server, the NetBird dashboard). port_guard lets only
# the monitoring VM and the gateway connect (inventory/host_vars/netbird.yml).
netbird_server_metrics_port: 9095
# The dashboard's Content-Security-Policy as Caddy sends it: the image's own rules with only
# this host as a source (no vendor or tracker domains). The script hash is the dashboard's
# inline script (from its image, /usr/local/init_react_envs.sh). Check it after a bump.
netbird_server_dashboard_csp: >-
  default-src 'none';
  connect-src 'self' https://{{ site.netbird_domain }} https://{{ site.netbird_domain }}/oauth2 wss://{{ site.netbird_domain }};
  frame-src 'self' https://{{ site.netbird_domain }} https://{{ site.netbird_domain }}/oauth2;
  script-src 'self' 'wasm-unsafe-eval' 'sha256-7knV6EIjKUvCpYWE2rCYx8dYV2WCNb2bpTuitFXzBcA=';
  font-src 'self'; img-src * data:; manifest-src 'self'; style-src 'self' 'unsafe-inline';
  frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;
# Public STUN only. Without local STUN the server opens no UDP port. The relay (WebSocket
# on TCP 443) carries a connection when hole punching fails.
netbird_server_stuns:
  - stun:stun.cloudflare.com:3478
  - stun:stun.l.google.com:19302
# Secrets: Vault KV v2, mount kv. The role generates missing keys (never displayed).
netbird_server_vault_mount: kv
netbird_server_vault_path: homelab/netbird-srv
netbird_server_repo_scripts: "{{ playbook_dir }}/../../scripts"
# Personal access token of the owner user (the role's API calls): replaced when it has
# fewer days left than this.
netbird_server_pat_days: 365
netbird_server_pat_renew_days: 30

# --- desired state of the self-hosted network (applied through the management API) ---------
# Groups of peers: operator (the owner's devices: every device the owner logs in joins it),
# routers (the routing peer) and tv (televisions away from home, enrolled with a setup key
# of that group). Groups of routed resources: lab, gateway (the apps VM's home address) and
# live-tv (the Proxmox host's home address). NetBird's All to All policy "Default" is
# deleted, so a peer reaches only what a policy below allows.
netbird_server_groups: [operator, routers, tv, lab, gateway, live-tv]
netbird_server_owner_auto_groups: [operator]
netbird_server_policies:
  - name: operator-to-routers
    description: The operator's devices reach the routing peer and every routed network
    sources: [operator]
    destinations: [routers, lab, gateway, live-tv]
  - name: operator-to-operator
    description: The operator's devices reach each other
    sources: [operator]
    destinations: [operator]
  - name: tv-to-gateway
    description: Televisions reach the service gateway over HTTPS (Jellyfin and the other apps)
    sources: [tv]
    destinations: [gateway]
    protocol: tcp
    ports: [443]
  - name: tv-to-live-tv
    description: Televisions reach live TV (Threadfin and the stream helper) on the Proxmox host
    sources: [tv]
    destinations: [live-tv]
    protocol: tcp
    ports: ["{{ iptv_threadfin_port }}", "{{ iptv_streams_port }}"]
netbird_server_delete_policies: [Default]
# The lab's /16 (masquerade on), the apps VM's home address (masquerade off, so the
# gateway's Caddy allowlist sees the peer's own address) and the Proxmox host's home address
# (masquerade off): the IPTV playlist and its stream redirects point there (role iptv,
# iptv_public_ip), and the host forwards those ports to the IPTV VM from any source. With the
# peer's own address the IPTV VM answers through the host, which undoes its forward and sends
# the reply back to the routing peer (pve_network_netbird_return_route). Masqueraded to the
# routing peer's lab address, the IPTV VM would answer it directly and the reply would be lost.
netbird_server_lab_route: "{{ (site.lan_cidr.split('/')[0].split('.')[:2] + ['0', '0']) | join('.') }}/16"
netbird_server_networks:
  - name: lab
    description: The lab network
    resources:
      - {name: lab, address: "{{ netbird_server_lab_route }}", groups: [lab]}
    routers:
      - {peer_groups: [routers], masquerade: true, metric: 9999}
  - name: home-gateway
    description: The service gateway's home address
    resources:
      - {name: apps-home, address: "{{ site.hosts.apps.home_ip | default('') }}/32", groups: [gateway]}
    routers:
      - {peer_groups: [routers], masquerade: false, metric: 9999}
  - name: home-tv
    description: The Proxmox host's home address, for live TV away from home
    resources:
      - {name: pve-home, address: "{{ site.pve.uplink_ip | default('') }}/32", groups: [live-tv]}
    routers:
      - {peer_groups: [routers], masquerade: false, metric: 9999}
# Pi-hole answers the gateway names (<name>.<gateway domain>) for the operator's devices.
netbird_server_nameservers:
  - name: gateway
    description: Pi-hole for the gateway names
    nameservers:
      - {ip: "{{ site.hosts.apps.home_ip | default('') }}", ns_type: udp, port: 53}
    domains: ["{{ gateway_domain }}"]
    groups: [operator, tv]
# What tasks/api.yml sends to the API helper (files/netbird_api.py).
netbird_server_desired:
  settings: >-
    {{ {'network_range': site.netbird_server.network_range}
       if (site.netbird_server | default({}, true)).network_range | default('') | length > 0 else {} }}
  groups: "{{ netbird_server_groups }}"
  owner_email: "{{ site.email }}"
  owner_auto_groups: "{{ netbird_server_owner_auto_groups }}"
  policies: "{{ netbird_server_policies }}"
  delete_policies: "{{ netbird_server_delete_policies }}"
  networks: "{{ netbird_server_networks }}"
  nameservers: "{{ netbird_server_nameservers }}"
