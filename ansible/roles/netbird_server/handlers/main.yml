- name: Apply the NetBird reply route
  ansible.builtin.systemd_service:
    name: anvil-netbird-reply
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart wazuh-agent for netbird
  ansible.builtin.systemd_service:
    name: wazuh-agent
    state: restarted
  when: not ansible_check_mode
