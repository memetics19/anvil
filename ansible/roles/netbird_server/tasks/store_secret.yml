# One key into kv/<netbird_server_vault_path> (patch, so the other keys stay). The value
# goes to Vault on stdin from the controller; it is never displayed or logged.
# In: netbird_server_store_key, netbird_server_store_value.
- name: Store a key in Vault ({{ netbird_server_store_key }})
  ansible.builtin.command:
    argv:
      - vault
      - kv
      - patch
      - -mount={{ netbird_server_vault_mount }}
      - "{{ netbird_server_vault_path }}"
      - "{{ netbird_server_store_key }}=-"
    stdin: "{{ netbird_server_store_value }}"
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  changed_when: true
  no_log: true
