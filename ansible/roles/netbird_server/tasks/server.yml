# --- checks ------------------------------------------------------------------------------------
- name: The site values the server needs
  ansible.builtin.assert:
    that:
      - site.netbird_domain is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$')
      - site.hosts.apps.home_ip | default('') | length > 0
      - site.email | default('') | length > 0
    fail_msg: >-
      site.netbird_domain must be a lower-case host name (for example sync.<domain>), and
      site.hosts.apps.home_ip and site.email must be set
    quiet: true

# --- secrets -----------------------------------------------------------------------------------
- name: Key digests stored in Vault
  ansible.builtin.command:
    argv: ["{{ netbird_server_repo_scripts }}/vault-kv-digests.sh", "{{ netbird_server_vault_path }}", "{{ netbird_server_vault_mount }}"]
  delegate_to: localhost
  become: false
  register: netbird_server_vault_digests
  changed_when: false
  check_mode: false

- name: Keys stored in Vault
  ansible.builtin.set_fact:
    netbird_server_vault_keys: "{{ netbird_server_vault_digests.stdout_lines | map('split', ' ') | map('first') | list }}"

# Each value goes from openssl straight into Vault; it is never displayed or logged.
# datastore_key: 32 bytes, base64. idp_session_key: 32 characters (an AES-256 key).
- name: Generate the missing server secrets into Vault
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      {{ item.value }} | tr -d '\n' |
      vault kv {{ 'patch' if (netbird_server_vault_keys or idx > 0) else 'put' }}
      -mount={{ netbird_server_vault_mount }} {{ netbird_server_vault_path }} {{ item.key }}=- >/dev/null
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: true
  loop: >-
    {{ {'relay_secret': 'openssl rand -hex 32',
        'datastore_key': 'openssl rand -base64 32',
        'idp_session_key': 'openssl rand -hex 16',
        'owner_password': 'openssl rand -hex 24'}
       | dict2items | rejectattr('key', 'in', netbird_server_vault_keys) | list }}
  loop_control:
    index_var: idx
    label: "{{ item.key }}"

# The owner's login name next to its password, so the credentials are in one place.
- name: Owner login name into Vault
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      printf '%s' {{ site.email | quote }} |
      vault kv patch -mount={{ netbird_server_vault_mount }} {{ netbird_server_vault_path }} owner_email=- >/dev/null
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: true
  when: >-
    not ansible_check_mode and (
    'owner_email' not in netbird_server_vault_keys
    or (netbird_server_vault_digests.stdout_lines | select('match', '^owner_email ') | first | split(' ') | last)
       != (site.email | hash('sha256')))

# In check mode secrets that would be generated above do not exist yet.
- name: The server secrets are readable
  ansible.builtin.set_fact:
    netbird_server_have_secrets: >-
      {{ not ansible_check_mode
         or (['relay_secret', 'datastore_key', 'idp_session_key', 'owner_password']
             | reject('in', netbird_server_vault_keys) | list | length == 0) }}

- name: Read the server secrets from Vault
  ansible.builtin.set_fact:
    netbird_server_secrets: >-
      {{ lookup('community.hashi_vault.vault_kv2_get', netbird_server_vault_path,
                engine_mount_point=netbird_server_vault_mount,
                url=lookup('env', 'VAULT_ADDR'),
                token=lookup('env', 'VAULT_TOKEN'),
                ca_cert=lookup('env', 'VAULT_CACERT')).secret }}
  no_log: true
  when: netbird_server_have_secrets | bool

- name: The server secrets are present
  ansible.builtin.assert:
    that:
      - netbird_server_secrets.relay_secret | default('') | length >= 32
      - netbird_server_secrets.datastore_key | default('') | b64decode | length == 32
      - netbird_server_secrets.idp_session_key | default('') | length == 32
      - netbird_server_secrets.owner_password | default('') | length >= 32
    fail_msg: "kv/{{ netbird_server_vault_path }}: a server secret is missing or malformed"
    quiet: true
  no_log: true
  when: netbird_server_have_secrets | bool

# --- files -------------------------------------------------------------------------------------
- name: Project directory
  ansible.builtin.file:
    path: "{{ netbird_server_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render the server configuration and the Caddyfile
  ansible.builtin.set_fact:
    netbird_server_config: "{{ lookup('ansible.builtin.template', 'config.yaml.j2') }}"
    netbird_server_caddyfile: "{{ lookup('ansible.builtin.template', 'Caddyfile.j2') }}"
  no_log: true
  when: netbird_server_have_secrets | bool

- name: Read the live server configuration
  ansible.builtin.stat:
    path: "{{ netbird_server_dir }}/config.yaml"
    checksum_algorithm: sha256
  register: netbird_server_config_stat

# Holds the relay secret and the store and session keys: never logged or diffed.
- name: Server configuration (secrets from Vault)
  ansible.builtin.copy:
    content: "{{ netbird_server_config }}"
    dest: "{{ netbird_server_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  when:
    - netbird_server_have_secrets | bool
    - >-
      not netbird_server_config_stat.stat.exists
      or netbird_server_config_stat.stat.checksum != (netbird_server_config | hash('sha256'))

- name: Server configuration mode
  ansible.builtin.file:
    path: "{{ netbird_server_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0600"
  when: netbird_server_config_stat.stat.exists or not ansible_check_mode

# The file names the public host: kept out of --diff output.
- name: GeoIP database folder
  ansible.builtin.file:
    path: "{{ netbird_server_geoip_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: GeoIP database, compressed (checksum pinned)
  ansible.builtin.get_url:
    url: "{{ netbird_server_geoip_url }}"
    dest: "{{ netbird_server_geoip_dir }}/{{ netbird_server_geoip_edition }}.mmdb.gz"
    checksum: "sha256:{{ netbird_server_geoip_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  register: netbird_server_geoip_gz
  # The folder above does not exist yet in a first check run.
  when: not ansible_check_mode

- name: GeoIP database, unpacked for Caddy
  ansible.builtin.shell: >-
    gunzip -c {{ netbird_server_geoip_dir }}/{{ netbird_server_geoip_edition }}.mmdb.gz
    > {{ netbird_server_geoip_dir }}/{{ netbird_server_geoip_edition }}.mmdb.tmp
    && mv {{ netbird_server_geoip_dir }}/{{ netbird_server_geoip_edition }}.mmdb.tmp
    {{ netbird_server_geoip_dir }}/{{ netbird_server_geoip_edition }}.mmdb
  args:
    creates: "{{ netbird_server_geoip_dir }}/{{ netbird_server_geoip_edition }}.mmdb"
  when: not ansible_check_mode

- name: Older GeoIP databases
  ansible.builtin.find:
    paths: "{{ netbird_server_geoip_dir }}"
    patterns: "dbip-city-lite-*"
    excludes: "{{ netbird_server_geoip_edition }}.*"
  register: netbird_server_geoip_old

- name: Remove older GeoIP databases
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ netbird_server_geoip_old.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Caddy's access log folder (shipped by the Wazuh agent)
  ansible.builtin.file:
    path: "{{ netbird_server_access_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Is the Wazuh agent here
  ansible.builtin.stat:
    path: "{{ netbird_server_wazuh_agent_conf }}"
  register: netbird_server_wazuh

- name: The Wazuh agent ships Caddy's access log
  ansible.builtin.blockinfile:
    path: "{{ netbird_server_wazuh_agent_conf }}"
    marker: "<!-- {mark} anvil netbird caddy -->"
    insertafter: EOF
    block: |
      <ossec_config>
        <localfile>
          <log_format>syslog</log_format>
          <location>{{ netbird_server_access_log_dir }}/access.log</location>
        </localfile>
      </ossec_config>
  notify: Restart wazuh-agent for netbird
  when: netbird_server_wazuh.stat.exists

- name: Caddyfile
  ansible.builtin.copy:
    content: "{{ netbird_server_caddyfile }}"
    dest: "{{ netbird_server_dir }}/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  diff: false
  when: netbird_server_have_secrets | bool

# --- compose project ------------------------------------------------------------------------------
# netbird-home, the routing peer on this VM, uses the public name. The router does not
# loop a connection to the home's own public address back in, so on this VM the name is
# Caddy on the loopback (published there by the compose file).
- name: The public name is this VM's own Caddy, for its NetBird client
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s{{ site.netbird_domain | regex_escape }}(\s|$)'
    line: "127.0.0.1 {{ site.netbird_domain }} # anvil: netbird_server"
    owner: root
    group: root
    mode: "0644"

# The file holds the VM's address and the public host name: no --diff output.
# The patched Caddy that role caddy builds (current Go and golang.org/x/net), not upstream's
# binary: built once on the build host, loaded here if this host does not have it yet.
- name: The patched Caddy image
  ansible.builtin.include_role:
    name: caddy
    tasks_from: image.yml
    public: true
  vars:
    caddy_dir: "{{ netbird_server_dir }}"

- name: NetBird server compose project
  ansible.builtin.include_role:
    name: compose_project
  vars:
    compose_project_dir: "{{ netbird_server_dir }}"
    compose_project_content: "{{ lookup('ansible.builtin.template', 'docker-compose.yaml.j2') }}"
    compose_project_diff: false
  when: netbird_server_have_secrets | bool

- name: The management API answers on the loopback port
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ netbird_server_api_port }}/api/instance"
  register: netbird_server_instance
  retries: 30
  delay: 3
  until: netbird_server_instance.status == 200
  when: not ansible_check_mode

- name: Caddy answers the login pages on the VM's lab address (open to every client)
  ansible.builtin.uri:
    url: "https://{{ site.hosts[inventory_hostname].ip }}:{{ netbird_server_https_port }}/oauth2/.well-known/openid-configuration"
    headers:
      Host: "{{ site.netbird_domain }}"
    validate_certs: false
  register: netbird_server_origin
  retries: 20
  delay: 3
  until: netbird_server_origin.status == 200
  when: not ansible_check_mode

- name: The REST API asks for a login
  ansible.builtin.uri:
    url: "https://{{ site.hosts[inventory_hostname].ip }}:{{ netbird_server_https_port }}/api/peers"
    headers:
      Host: "{{ site.netbird_domain }}"
    validate_certs: false
    status_code: 401
  when: not ansible_check_mode
