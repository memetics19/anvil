- name: Preconditions
  tags: [always]
  block:
    # disable_mlock is only safe without swap (secrets could be paged to disk).
    - name: Read active swap
      ansible.builtin.command: swapon --noheadings --show=NAME
      register: vault_server_swap
      changed_when: false
      check_mode: false

    - name: Swap is off
      ansible.builtin.assert:
        that: vault_server_swap.stdout | trim | length == 0
        fail_msg: Swap is active on the Vault VM; disable it (disable_mlock = true relies on that).
        quiet: true

- name: No HashiCorp apt repository here (no internet)
  tags: [repos]
  when: not vault_server_apt_repo | bool
  block:
    - name: The repository is not listed
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/hashicorp.list
        state: absent

    - name: Installed Vault version
      ansible.builtin.command: dpkg-query -W -f=${Version} vault
      register: vault_server_offline_version
      changed_when: false
      failed_when: false
      check_mode: false

    - name: The pinned Vault version is installed (no repository to install it from)
      ansible.builtin.assert:
        that: vault_server_offline_version.stdout | default('') == vault_server_version
        fail_msg: >-
          Vault {{ vault_server_version }} is not installed and this VM has no HashiCorp apt
          repository (secrets enclave). Install the package by hand first (README, Vault upgrades in
          the enclave), then rerun.
        quiet: true

- name: HashiCorp apt repository
  tags: [repos]
  when: vault_server_apt_repo | bool
  block:
    - name: HashiCorp signing key
      ansible.builtin.get_url:
        url: "{{ vault_server_apt_key_url }}"
        dest: "{{ vault_server_apt_keyring }}"
        mode: "0644"
        owner: root
        group: root

    - name: Read the signing key fingerprints
      ansible.builtin.command: gpg --show-keys --with-colons {{ vault_server_apt_keyring }}
      register: vault_server_key_info
      changed_when: false
      check_mode: false

    - name: Signing key has the expected fingerprint
      ansible.builtin.assert:
        that: vault_server_key_info.stdout is search('(?m)^fpr:+' ~ (vault_server_apt_key_fingerprint | replace(' ', '')) ~ ':')
        fail_msg: "{{ vault_server_apt_keyring }} does not contain key {{ vault_server_apt_key_fingerprint }}; refusing to use the repository."
        quiet: true

    - name: HashiCorp repository
      ansible.builtin.template:
        src: hashicorp.list.j2
        dest: /etc/apt/sources.list.d/hashicorp.list
        mode: "0644"
        owner: root
        group: root
      notify: Update apt cache

    - name: Refresh apt cache before installing
      ansible.builtin.meta: flush_handlers


# Restarting Vault seals it. When Vault is running, refuse a run that would restart it
# (new package version, config or unit change) unless vault_server_allow_restart is set.
- name: Restart guard
  tags: [always]
  block:
    - name: Read the Vault service state
      ansible.builtin.systemd_service:
        name: vault
      register: vault_server_unit
      failed_when: false
      check_mode: false

    - name: Note whether Vault is running
      ansible.builtin.set_fact:
        vault_server_active: "{{ (vault_server_unit.status | default({})).ActiveState | default('') == 'active' }}"

    - name: Read the installed Vault version
      ansible.builtin.command: dpkg-query -W -f=${Version} vault
      register: vault_server_installed
      changed_when: false
      failed_when: false
      check_mode: false
      when: vault_server_active | bool

    - name: Would the Vault configuration change
      ansible.builtin.template:
        src: vault.hcl.j2
        dest: /etc/vault.d/vault.hcl
        owner: root
        group: vault
        mode: "0640"
      check_mode: true
      register: vault_server_config_pending
      when: vault_server_active | bool

    - name: Read the systemd drop-in
      ansible.builtin.stat:
        path: "{{ vault_server_unit_dropin_path }}"
        checksum_algorithm: sha1
      register: vault_server_unit_current
      when: vault_server_active | bool

    - name: Refuse to restart (and so seal) a running Vault unless allowed
      ansible.builtin.assert:
        that: >-
          vault_server_allow_restart | bool
          or not (vault_server_active | bool)
          or not (vault_server_installed.stdout != vault_server_version
                  or vault_server_config_pending is changed
                  or not vault_server_unit_current.stat.exists
                  or vault_server_unit_current.stat.checksum != (vault_server_unit_dropin | hash('sha1')))
        fail_msg: >-
          This run would restart Vault (version, config or unit change), which seals it.
          Rerun with: make vault ARGS="-e vault_server_allow_restart=true", then make vault-unseal.
        quiet: true

- name: Vault package
  tags: [packages]
  block:
    - name: Install the pinned Vault version
      ansible.builtin.apt:
        name: "vault={{ vault_server_version }}"
        state: present
        allow_change_held_packages: true
      notify: Restart vault

    - name: Hold the Vault package at the pinned version
      ansible.builtin.dpkg_selections:
        name: vault
        selection: hold

- name: Raft data directory
  tags: [storage]
  ansible.builtin.file:
    path: "{{ vault_server_data_dir }}"
    state: directory
    owner: vault
    group: vault
    mode: "0700"

- name: TLS
  tags: [tls]
  block:
    - name: CA directory (root only, outside the vault user's tree)
      ansible.builtin.file:
        path: "{{ vault_server_ca_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Listener TLS directory
      ansible.builtin.file:
        path: "{{ vault_server_tls_dir }}"
        state: directory
        owner: vault
        group: vault
        mode: "0750"

    # The package generates a self-signed pair on install; it is unused, and an earlier
    # version of this role kept the CA under /opt/vault/ca.
    - name: Remove unused key material
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ vault_server_tls_dir }}/tls.crt"
        - "{{ vault_server_tls_dir }}/tls.key"
        - /opt/vault/ca

    - name: CA private key
      community.crypto.openssl_privatekey:
        path: "{{ vault_server_ca_dir }}/ca.key"
        type: ECC
        curve: secp384r1
        owner: root
        group: root
        mode: "0600"

    - name: CA signing request
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ vault_server_ca_dir }}/ca.key"
        common_name: homelab vault CA
        use_common_name_for_san: false
        basic_constraints: ["CA:TRUE", "pathlen:0"]
        basic_constraints_critical: true
        key_usage: [keyCertSign, cRLSign]
        key_usage_critical: true
      register: vault_server_ca_csr
      changed_when: false

    - name: CA certificate
      community.crypto.x509_certificate:
        path: "{{ vault_server_ca_dir }}/ca.crt"
        csr_content: "{{ vault_server_ca_csr.csr }}"
        privatekey_path: "{{ vault_server_ca_dir }}/ca.key"
        provider: selfsigned
        selfsigned_not_after: "+{{ vault_server_ca_days }}d"
        owner: root
        group: root
        mode: "0644"
      register: vault_server_ca_cert
      notify: Reload vault

    - name: Listener private key
      community.crypto.openssl_privatekey:
        path: "{{ vault_server_tls_dir }}/vault.key"
        type: ECC
        curve: secp256r1
        owner: vault
        group: vault
        mode: "0600"
      notify: Reload vault

    - name: Listener signing request
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ vault_server_tls_dir }}/vault.key"
        common_name: "{{ inventory_hostname }}"
        subject_alt_name: "{{ ([vault_server_ip] + vault_server_extra_ips) | map('regex_replace', '^', 'IP:') | list + ['DNS:' ~ inventory_hostname] }}"
        basic_constraints: ["CA:FALSE"]
        key_usage: [digitalSignature]
        extended_key_usage: [serverAuth]
      register: vault_server_csr
      changed_when: false

    - name: Check whether the listener certificate expires soon
      community.crypto.x509_certificate_info:
        path: "{{ vault_server_tls_dir }}/vault.crt"
        valid_at:
          renew: "+{{ vault_server_cert_renew_days }}d"
      register: vault_server_cert_info
      failed_when: false

    # Reissued when it is about to expire or when the CA changed. A cert change is
    # picked up with SIGHUP (no restart, no seal).
    - name: Listener certificate signed by the CA
      community.crypto.x509_certificate:
        path: "{{ vault_server_tls_dir }}/vault.crt"
        csr_content: "{{ vault_server_csr.csr }}"
        provider: ownca
        ownca_path: "{{ vault_server_ca_dir }}/ca.crt"
        ownca_privatekey_path: "{{ vault_server_ca_dir }}/ca.key"
        ownca_not_after: "+{{ vault_server_cert_days }}d"
        force: "{{ (vault_server_ca_cert is changed) or not (vault_server_cert_info.valid_at.renew | default(true)) }}"
        owner: vault
        group: vault
        mode: "0644"
      notify: Reload vault

- name: Vault configuration
  tags: [config]
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: /etc/vault.d/vault.hcl
    owner: root
    group: vault
    mode: "0640"
  notify: Restart vault

- name: Vault service
  tags: [service]
  block:
    - name: Systemd drop-in directory
      ansible.builtin.file:
        path: "{{ vault_server_unit_dropin_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Systemd drop-in (no core dumps of a process holding keys)
      ansible.builtin.copy:
        content: "{{ vault_server_unit_dropin }}"
        dest: "{{ vault_server_unit_dropin_path }}"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart vault

    - name: Apply a pending systemd reload before starting
      ansible.builtin.meta: flush_handlers

    - name: Vault enabled and running
      ansible.builtin.systemd_service:
        name: vault
        enabled: true
        state: started

    # 200 active, 429 standby, 472/473 DR/perf standby, 501 not initialised, 503 sealed.
    - name: Vault API answers over TLS
      ansible.builtin.uri:
        url: "https://{{ vault_server_ip }}:{{ vault_server_port }}/v1/sys/health"
        ca_path: "{{ vault_server_ca_dir }}/ca.crt"
        status_code: [200, 429, 472, 473, 501, 503]
      register: vault_server_health
      retries: 10
      delay: 3
      until: vault_server_health.status in [200, 429, 472, 473, 501, 503]
      changed_when: false
      check_mode: false

- name: CA certificate on the Mac
  tags: [ca]
  block:
    - name: Local config directory
      ansible.builtin.file:
        path: "{{ vault_server_ca_local_path | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Fetch the CA certificate (public)
      ansible.builtin.fetch:
        src: "{{ vault_server_ca_dir }}/ca.crt"
        dest: "{{ vault_server_ca_local_path }}"
        flat: true
      run_once: true

- name: Vault was not left sealed by this run
  tags: [service]
  ansible.builtin.assert:
    that: not (vault_server_restarted | default(false) | bool) or vault_server_health.status | default(0) != 503
    fail_msg: This run restarted Vault and it is now sealed. Run make vault-unseal.
    quiet: true
