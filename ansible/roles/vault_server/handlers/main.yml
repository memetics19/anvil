- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

# A restart seals Vault (unseal again with `make vault-unseal`); only config changes do it.
- name: Restart vault
  ansible.builtin.systemd_service:
    name: vault
    state: restarted

# SIGHUP reloads the listener certificate without sealing.
- name: Reload vault
  ansible.builtin.systemd_service:
    name: vault
    state: reloaded
