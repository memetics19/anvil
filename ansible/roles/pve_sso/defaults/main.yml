# Single sign-on for Proxmox VE (make cluster, playbooks/cluster.yml): an OpenID Connect realm
# that logs in through Authentik (role authentik, blueprint anvil-sso.yaml, app "Proxmox").
# The realm, its group and the group's permission live in /etc/pve, so they are set once for
# the whole cluster, from the main host. Every node pins Authentik's gateway name in
# /etc/hosts. Nothing happens when site.services has no Authentik entry.
pve_sso_auth_route: auth
pve_sso_enabled: >-
  {%- set ns = namespace(on=false) -%}
  {%- for s in site.services | default([]) if s.name | default('') == pve_sso_auth_route -%}
  {%- set ns.on = s.enabled | default(true) | bool -%}
  {%- endfor -%}
  {{ ns.on }}
pve_sso_auth_name: "{{ pve_sso_auth_route }}.{{ gateway_domain }}"
pve_sso_realm: authentik
# The same values as the authentik role's: authentik_proxmox_client_id (the client id and
# the app's slug) and authentik_sso_group.
pve_sso_client_id: proxmox
pve_sso_issuer: "https://{{ pve_sso_auth_name }}/application/o/{{ pve_sso_client_id }}/"
pve_sso_group: lab-admins
# Proxmox names a group from the claim <group>-<realm>. It gets this role on /.
pve_sso_pve_group: "{{ pve_sso_group }}-{{ pve_sso_realm }}"
pve_sso_pve_role: Administrator
# The client secret: generated by the authentik role into Vault.
pve_sso_vault_mount: kv
pve_sso_vault_path: homelab/identity/authentik
pve_sso_vault_key: proxmox_client_secret
# The realm's options (pveum realm add). Users are created at their first login and their
# groups follow Authentik on every login, so taking someone out of the group there takes
# their access away here. username-claim cannot change once the realm exists.
# default: the login page offers this realm first. root@pam keeps working.
pve_sso_realm_options:
  type: openid
  issuer-url: "{{ pve_sso_issuer }}"
  client-id: "{{ pve_sso_client_id }}"
  username-claim: preferred_username
  autocreate: true
  groups-claim: groups
  groups-autocreate: true
  groups-overwrite: true
  default: true
  comment: Authentik single sign-on (anvil)
# Authentik's gateway name in /etc/hosts, at the gateway VM's home address: the name exists
# only in Pi-hole, and the hosts do not ask Pi-hole.
pve_sso_gateway_host: apps
pve_sso_gateway_ip: "{{ site.hosts[pve_sso_gateway_host].home_ip }}"
