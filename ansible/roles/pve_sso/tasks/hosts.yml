# On every node: Authentik's gateway name resolves to the gateway, so the realm can reach it.
- name: Hosts | Authentik's gateway name
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} anvil pve_sso"
    block: "{{ pve_sso_gateway_ip }} {{ pve_sso_auth_name }}"
  when: pve_sso_enabled | bool
