# On the main host. The realm, the group and the permission are cluster-wide.
- name: Authentik's gateway name on this host
  ansible.builtin.import_tasks: hosts.yml

- name: The gateway address is an IPv4 address
  ansible.builtin.assert:
    that: pve_sso_gateway_ip is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
    fail_msg: "site.hosts.{{ pve_sso_gateway_host }}.home_ip is not an IPv4 address"
    quiet: true
  when: pve_sso_enabled | bool

- name: Read the client secret from Vault
  ansible.builtin.set_fact:
    pve_sso_client_key: >-
      {{ (lookup('community.hashi_vault.vault_kv2_get', pve_sso_vault_path,
                 engine_mount_point=pve_sso_vault_mount,
                 url=lookup('env', 'VAULT_ADDR'),
                 token=lookup('env', 'VAULT_TOKEN'),
                 ca_cert=lookup('env', 'VAULT_CACERT')).secret)[pve_sso_vault_key] | default('') }}
  no_log: true
  when: pve_sso_enabled | bool

- name: The client secret is there (the authentik role makes it)
  ansible.builtin.assert:
    that: pve_sso_client_key is match('^[A-Za-z0-9]{32,}$')
    fail_msg: "kv/{{ pve_sso_vault_path }} has no {{ pve_sso_vault_key }}: run make vm HOST=identity first"
    quiet: true
  no_log: true
  when: pve_sso_enabled | bool

# files/pve-realm.pl runs as `perl -e` (its code holds no secret) and gets the settings on
# stdin, so the client key is never on a command line or in a file on the host. In check
# mode it validates them and changes nothing.
- name: The realm
  ansible.builtin.command:
    argv: "{{ ['perl', '-e', lookup('ansible.builtin.file', 'pve-realm.pl'), '--'] + (['--check'] if ansible_check_mode else []) }}"
    # The code uses Perl's $_: keep the module from expanding it as an environment variable.
    expand_argument_vars: false
    stdin: >-
      {{ pve_sso_realm_options | combine({'realm': pve_sso_realm, 'client-key': pve_sso_client_key}) | to_json }}
  register: pve_sso_realm_result
  changed_when: pve_sso_realm_result.stdout is search('^(would )?(create|update)', multiline=true)
  check_mode: false
  no_log: true
  when: pve_sso_enabled | bool

- name: What happened to the realm
  ansible.builtin.debug:
    msg: "{{ pve_sso_realm }}: {{ pve_sso_realm_result.stdout | trim }}"
  when: pve_sso_enabled | bool

- name: The groups that exist
  ansible.builtin.command:
    argv: [pvesh, get, /access/groups, --output-format, json]
  register: pve_sso_groups
  changed_when: false
  check_mode: false
  when: pve_sso_enabled | bool

- name: The group for Authentik's group
  ansible.builtin.command:
    argv: [pveum, group, add, "{{ pve_sso_pve_group }}", --comment, "Members of {{ pve_sso_group }} in Authentik (anvil)"]
  changed_when: true
  when:
    - pve_sso_enabled | bool
    - pve_sso_pve_group not in (pve_sso_groups.stdout | from_json | map(attribute='groupid') | list)

- name: The permissions that exist
  ansible.builtin.command:
    argv: [pvesh, get, /access/acl, --output-format, json]
  register: pve_sso_acl
  changed_when: false
  check_mode: false
  when: pve_sso_enabled | bool

- name: The group's role on the whole cluster
  ansible.builtin.command:
    argv: [pveum, acl, modify, /, --groups, "{{ pve_sso_pve_group }}", --roles, "{{ pve_sso_pve_role }}", --propagate, "1"]
  changed_when: true
  when:
    - pve_sso_enabled | bool
    - >-
      pve_sso_acl.stdout | from_json | selectattr('type', 'equalto', 'group')
      | selectattr('ugid', 'equalto', pve_sso_pve_group) | selectattr('path', 'equalto', '/')
      | selectattr('roleid', 'equalto', pve_sso_pve_role) | selectattr('propagate', 'in', [1, '1', true])
      | list | length == 0

- name: The Ceph dashboard
  ansible.builtin.include_tasks: ceph.yml
  when: pve_sso_enabled | bool and pve_sso_ceph_enabled | bool
