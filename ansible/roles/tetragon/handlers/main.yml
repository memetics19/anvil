# Handlers run in this order.
- name: Reload systemd for tetragon
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart tetragon
  ansible.builtin.systemd_service:
    name: tetragon
    state: restarted
  when: not (ansible_check_mode and tetragon_installed.rc != 0)

- name: Restart wazuh-agent for tetragon
  ansible.builtin.systemd_service:
    name: wazuh-agent
    state: restarted
  when: not ansible_check_mode
