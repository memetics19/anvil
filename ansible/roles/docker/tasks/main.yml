- name: Docker apt signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_keyring }}"
    checksum: "sha256:{{ docker_gpg_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Docker apt repository
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
  notify: Update apt cache

- name: Refresh apt cache before installing
  ansible.builtin.meta: flush_handlers

- name: Docker CE and the compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Docker running and enabled
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
