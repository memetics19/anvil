# SMB for the media library: read-only, guest, the readers only. The guard loads before
# Samba; the library is only ever read.
- name: The readers are single addresses or /32s or a subnet
  ansible.builtin.assert:
    that:
      - smb_media_readers | length > 0
      - smb_media_readers | reject('match', '^([0-9]+\.){3}[0-9]+(/[0-9]{1,2})?$') | list | length == 0
    fail_msg: "smb_media needs site.admin_sources or a home_ip (for the home subnet)"
    quiet: true

- name: The library folders exist (read only, never created here)
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ smb_media_shares }}"
  register: smb_media_paths

- name: Every shared folder is there
  ansible.builtin.assert:
    that: smb_media_paths.results | selectattr('stat.isdir', 'defined') | rejectattr('stat.isdir') | list | length == 0
          and smb_media_paths.results | rejectattr('stat.isdir', 'defined') | list | length == 0
    fail_msg: "a folder in smb_media_shares is missing or not a directory"
    quiet: true

# --- firewall first ------------------------------------------------------------------------
- name: Config directory
  ansible.builtin.file:
    path: "{{ smb_media_guard_file | dirname }}"
    state: directory
    mode: "0755"

- name: SMB guard (checked with nft -c before it is installed)
  ansible.builtin.template:
    src: smb-guard.nft.j2
    dest: "{{ smb_media_guard_file }}"
    mode: "0644"
    validate: nft -c -f %s
  register: smb_media_guard

- name: Boot unit for the guard
  ansible.builtin.template:
    src: smb-guard.service.j2
    dest: /etc/systemd/system/smb-guard.service
    mode: "0644"
  register: smb_media_guard_unit

- name: The guard is loaded at boot
  ansible.builtin.systemd_service:
    name: smb-guard
    enabled: true
    daemon_reload: "{{ smb_media_guard_unit is changed }}"

- name: Is the guard loaded
  ansible.builtin.command:
    argv: [nft, list, table, inet, anvil_smb_guard]
  register: smb_media_guard_live
  changed_when: false
  failed_when: false
  check_mode: false

- name: Load the guard (one transaction)
  ansible.builtin.command:
    argv: [nft, -f, "{{ smb_media_guard_file }}"]
  changed_when: true
  when: smb_media_guard is changed or smb_media_guard_live.rc != 0

# --- Samba ---------------------------------------------------------------------------------
- name: Samba
  ansible.builtin.apt:
    name: samba
    state: present

- name: The share config
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    mode: "0644"
    validate: testparm -s %s
  notify: Restart samba

- name: Samba runs
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [smbd, nmbd]
  when: not ansible_check_mode

# --- The read-only user -------------------------------------------------------------------
# vault kv get exits 2 only when the path is absent. Any other failure stops the run, so a
# read that failed is never taken for "nothing there" and overwritten.
- name: User | its password in Vault
  ansible.builtin.command:
    argv: [vault, kv, get, -format=json, "-mount={{ smb_media_vault_mount }}", "{{ smb_media_vault_path }}"]
  delegate_to: localhost
  become: false
  register: smb_media_vault_get
  changed_when: false
  check_mode: false
  failed_when: smb_media_vault_get.rc not in [0, 2]
  no_log: true
  when: smb_media_user_password is not defined

- name: User | the password Vault holds
  ansible.builtin.set_fact:
    smb_media_vault_password: >-
      {{ ((smb_media_vault_get.stdout | from_json).data.data.password | default(''))
         if (smb_media_vault_get.rc | default(1)) == 0 else '' }}
  no_log: true
  when: smb_media_user_password is not defined

# A test's password, else Vault's, else a new one (written into Vault below).
- name: User | the password to use
  ansible.builtin.set_fact:
    smb_media_password: >-
      {{ smb_media_user_password if smb_media_user_password is defined
         else smb_media_vault_password if smb_media_vault_password | length > 0
         else lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}
    smb_media_password_new: "{{ smb_media_user_password is not defined and smb_media_vault_password | length == 0 }}"
  no_log: true

- name: User | write a new password into Vault
  ansible.builtin.command:
    argv: [vault, kv, "{{ 'patch' if smb_media_vault_get.rc == 0 else 'put' }}",
           "-mount={{ smb_media_vault_mount }}", "{{ smb_media_vault_path }}", "-"]
    stdin: "{{ smb_media_vault_doc | to_json }}"
  vars:
    smb_media_vault_doc: "{{ dict(['password'] | zip([smb_media_password])) }}"
  delegate_to: localhost
  become: false
  changed_when: true
  no_log: true
  when: smb_media_password_new | bool and not ansible_check_mode

- name: User | the system account (no shell, no home)
  ansible.builtin.user:
    name: "{{ smb_media_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: User | password last set
  ansible.builtin.slurp:
    src: "{{ smb_media_user_marker }}"
  register: smb_media_marker
  failed_when: false

- name: User | set the Samba password (stdin, twice)
  ansible.builtin.command:
    argv: [smbpasswd, -s, -a, "{{ smb_media_user }}"]
    stdin: "{{ smb_media_password }}\n{{ smb_media_password }}"
  changed_when: true
  no_log: true
  when: >-
    (smb_media_marker.content | default('') | b64decode | trim) != (smb_media_password | hash('sha256'))
  register: smb_media_pw_set

- name: User | remember which password is set
  ansible.builtin.copy:
    content: "{{ smb_media_password | hash('sha256') }}\n"
    dest: "{{ smb_media_user_marker }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: smb_media_pw_set is changed and not ansible_check_mode
