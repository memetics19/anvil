# The media library over SMB (Samba), read-only, for home devices: a phone or Fire TV finds
# it at once in VLC's Local Network, which NFS on Android often will not. Guest access (no
# password), restricted to the same readers as NFS by both Samba (hosts allow) and an
# nftables guard. The library is only ever read; the role never creates or changes a folder.
smb_media_shares:
  - {name: Movies, path: /home/ubuntu/media/movies}
  - {name: TV, path: /home/ubuntu/media/tv}
# Who may connect: the operator's lab devices (site.admin_sources), the operator's NetBird
# peers (site.admin_vpn_sources) and, when the VM has a home address (role nfs_media sets
# site.hosts.<vm>.home_ip), any device on the home Wi-Fi.
smb_media_lan_clients: "{{ site.admin_sources | default([]) }}"
# On the VPN, a phone opens the share at the VM's lab address: no VPN route reaches the home
# address. Both NetBird routing peers for the lab's /16, the netbird VM and the Proxmox host,
# masquerade: a VPN client arrives as the lab address of whichever its NetBird picked
# (site.hosts.netbird.ip, site.pve.ip), not as its own. Those addresses are readers. That
# lets in every peer NetBird's access policy lets onto the lab route, and what the Proxmox
# host masquerades from its VLANs: home devices, like the home Wi-Fi that reads the shares
# already. The operator's own peers (site.admin_vpn_sources) are readers too, for a route
# without masquerade. Empty routers and list turn VPN access off.
smb_media_vpn_routers: "{{ [site.hosts.netbird.ip | default(''), site.pve.ip | default('')] | select | list }}"
smb_media_vpn_clients: >-
  {{ (site.admin_vpn_sources | default([]))
     + (smb_media_vpn_routers | map('regex_replace', '$', '/32') | list) }}
smb_media_home_ip: "{{ site.hosts[inventory_hostname].home_ip | default('') }}"
smb_media_home_subnet: >-
  {{ (site.pve.uplink_ip | default('')).split('.')[:3] | join('.') }}.0/{{ site.pve.uplink_prefix | default('24') }}
smb_media_readers: >-
  {{ (smb_media_lan_clients + smb_media_vpn_clients
      + ([smb_media_home_subnet] if smb_media_home_ip | length > 0 else [])) | unique }}
# Everyone reads as the library's owner (the VM's first user): read-only.
smb_media_guest_user: ubuntu
# A real login too, for clients that sign every request. VLC on Android does, and a guest
# session has no signing key, so Samba drops it (smb2_signing_check_pdu). This user has a key.
# It reads as the library's owner as well, read-only. A system account: no shell, no home.
smb_media_user: media
# Its password: Vault kv/<smb_media_vault_path>, key password. Generated there when missing.
# A test passes smb_media_user_password instead.
smb_media_vault_mount: kv
smb_media_vault_path: "homelab/{{ inventory_hostname }}/smb"
# sha256 of the password last set, so a rerun sets it again only when Vault's changed.
smb_media_user_marker: /etc/anvil/smb-media-user.sha256
smb_media_guard_file: /etc/anvil/smb-guard.nft
