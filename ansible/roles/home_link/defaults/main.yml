# A WireGuard link from this VM to the operator's home router, for the home's own devices
# (the Switchy wall panels) and nothing else: only the home subnet goes through it, never a
# default route. The router's peer settings are in Vault kv/<home_link_vault_path>:
#   private_key, address (this VM's tunnel address with prefix), peer_public_key,
#   endpoint (host:port of the router), home_subnet, and optionally preshared_key.
# With that entry missing, the role does nothing. docs/services.md, Home link.
home_link_vault_mount: kv
home_link_vault_path: homelab/assistant/home-link
home_link_interface: home
home_link_keepalive: 25
