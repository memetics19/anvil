[defaults]
inventory = inventory
roles_path = roles
# Plays send the become password and secrets from Vault, so a host must prove its key.
# A new host is trusted on first contact and its key recorded. A changed key stops the
# run. After a deliberate rebuild: make forget-host HOST=<name>.
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
