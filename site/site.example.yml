# Structure of the `site` dict (documentation; example values use RFC 5737 ranges and example.com).
# The real copy lives in macOS Keychain (service homelab, account site-bootstrap) as this YAML,
# until Task 9 loads it into Vault at kv/homelab/site (KV v2, mount kv, key "site").
site:
  domain: example.com
  email: admin@example.com
  lan_cidr: 192.0.2.0/24
  guest_dns: [198.51.100.53, 198.51.100.54]
  pve:
    hostname: pve
    ip: 192.0.2.10
    gateway_alias_ip: 192.0.2.1
    uplink_ip: 198.51.100.250
    uplink_prefix: 24
    uplink_gw: 198.51.100.1
    # The server's BMC (iDRAC), on the lab network.
    idrac_ip: 192.0.2.123
  # Devices on the home network that are not hosts. switch_ip: the managed switch's web UI
  # (gateway name switch). Reserve it for the switch's MAC in the router's DHCP.
  # switch: the desired state of the switch's ports (make switch, role network_switch).
  # ports: {<port>: [roles]}, roles trunk (native VLAN 1 untagged, the vlans of
  # group_vars/proxmox.yml tagged) and protected (no traffic to another protected port).
  # Ports not listed are never touched. keep_ports: ports the plan must never name and that
  # must not be protected, such as the router uplink and the access point.
  # The Proxmox cluster (make cluster, role pve_cluster): the main host creates it, the
  # machines in members (entries of provision.machines) join. votes: the main host's 2
  # votes keep it in charge alone when a member is down.
  cluster: {name: lab, votes: {pve: 2}, members: [pve2]}
  network:
    switch_ip: 198.51.100.24
    # A second Proxmox server, for its gateway name (services: pve2).
    pve2_ip: 192.0.2.12
    switch:
      ports:
        gi10: [trunk, protected]
        gi11: [protected]
      keep_ports: [gi1, gi2]
      # DHCP snooping, optional: only these ports may send DHCP replies (the router uplink,
      # and the Proxmox host for anvil provision's netboot). Another router or access point
      # with its DHCP server left on then hands out nothing. vlans defaults to [1].
      dhcp_snooping: {trusted: [gi1, gi10], vlans: [1]}
  hosts:
    frigate: {ip: 192.0.2.114, vmid: 9001, mac: "02:00:00:00:00:01"}
    netbird: {ip: 192.0.2.115, vmid: 9002, mac: "02:00:00:00:00:02"}
    ragnarok: {ip: 192.0.2.119, vmid: 9003, mac: "02:00:00:00:00:03"}
    # Single sign-on and LDAP (terraform/vm_identity.tf), on the second node. Optional:
    # without it no identity VM is planned. datastore, cores and memory_mb have defaults.
    identity: {node: pve2, vmid: 9005, ip: 192.0.2.125, home_ip: 198.51.100.48, mac: "02:00:00:00:00:05", home_mac: "02:00:00:00:00:06", disk_gb: 32}
    # The local language model VM (one lab NIC). cores/memory_mb/disk_gb default to 4/16384/40.
    llm: {node: pve2, vmid: 9007, ip: 192.0.2.126, mac: "02:00:00:00:00:09"}
    # In the secrets enclave: ip is its enclave address, enclave_mac its enclave NIC. While it
    # keeps its first NIC on the lab network: lab_ip and mac (that NIC); lab_nic_retired: true
    # takes it out (docs/services.md, Vault on the enclave).
    vault: {ip: 203.0.113.20, lab_ip: 192.0.2.120, lab_nic_retired: true, vmid: 9004, mac: "02:00:00:00:00:07", enclave_mac: "02:00:00:00:00:08"}
    # In the secrets enclave (sdn.enclave.subnet, Terraform vm_vaultwarden.tf).
    vaultwarden: {ip: 203.0.113.21, vmid: 9006}
    # Two NICs: ip/mac on the lab network (default route), home_ip/home_mac on the home
    # network (pve.uplink_ip's /uplink_prefix, no gateway). Reserve home_ip for home_mac in
    # the router's DHCP. dns_subnet: the Pi-hole compose network, RFC 1918, /16../28, not
    # overlapping the lab or home network or Docker's default bridge (the role checks);
    # dns_unbound_ip: Unbound's fixed address in it (Pi-hole's upstream). The example range
    # is allowlisted in .gitleaks.toml for this file only.
    apps:
      ip: 192.0.2.121
      home_ip: 198.51.100.249
      vmid: 9005
      mac: "02:00:00:00:00:05"
      home_mac: "02:00:00:00:00:06"
      dns_subnet: 172.31.255.0/24
      dns_unbound_ip: 172.31.255.53
      # Caddy's own Docker network (role caddy): RFC 1918, /16../29, overlapping nothing
      # else; the gateway guard admits only this subnet on the bridge br-caddygw.
      gateway_subnet: 172.31.254.0/28
  # The secrets enclave (Terraform sdn.tf, roles pve_enclave and pve_segments): a vnet with
  # no physical port. The Proxmox host is its gateway and does no NAT for it.
  # subnets: VLANs 10, 20 and 30 (the vnets servers, cameras and personal, Terraform sdn.tf
  # and role pve_vlans). The Proxmox host holds each gateway and runs DHCP on each, handing
  # out dhcp_range. Keep static addresses outside the range. Real sites use a /24 each. The
  # example splits one documentation /24 so the ranges do not overlap.
  sdn:
    enclave: {subnet: 203.0.113.0/26, gateway: 203.0.113.1}
    subnets:
      servers: {cidr: 203.0.113.64/26, gateway: 203.0.113.65, dhcp_range: {start: 203.0.113.80, end: 203.0.113.119}}
      cameras: {cidr: 203.0.113.128/26, gateway: 203.0.113.129, dhcp_range: {start: 203.0.113.144, end: 203.0.113.183}}
      personal: {cidr: 203.0.113.192/26, gateway: 203.0.113.193, dhcp_range: {start: 203.0.113.208, end: 203.0.113.247}}
  # The operator's own devices, the only sources that may open connections to the enclave
  # (Vault, Vaultwarden) and use the gateway's pass and vault names; no VM ever is one.
  # admin_sources: the Mac's LAN addresses (/32s: home Wi-Fi, reserved in the router's DHCP;
  # USB LAN; Wi-Fi alias). admin_vpn_sources: the operator's NetBird peers (/32s).
  # enclave.vpn_only: true admits the NetBird peers only. A LAN /32 proves nothing: the lab and
  # home networks share one L2 segment, so any VM or home device can take over the Mac's LAN
  # addresses (ARP included) and finish a TCP connection as the Mac.
  admin_sources: [198.51.100.51/32, 192.0.2.30/32, 192.0.2.31/32]
  admin_vpn_sources: [100.64.0.7/32]
  enclave: {vpn_only: false}
  # Self-hosted NetBird (roles netbird_server and netbird_peer, docs/services.md): the
  # public name, routed by the Cloudflare tunnel (a hand step, docs/setup.md), a neutral
  # name that does not say what runs behind it, and the
  # network's peer address range, a /16 in 100.64.0.0/10 that differs from the cloud
  # network's. Without netbird_domain neither the server nor its client is set up.
  netbird_domain: sync.example.com
  netbird_server: {network_range: 100.64.0.0/16}
  # Bare-metal provisioning with the Proxmox automated installer (docs/provisioning.md,
  # scripts/provision.py). refuse: the current server, which is never a target. Its BMC
  # and host addresses come from pve. macs: its NICs. serials: what its BMC reports as the
  # Redfish SerialNumber and SKU, or the IPMI FRU serials. Every target is refused while
  # macs or serials is empty.
  # machines.<name>: a server to install. hostname defaults to the name (fqdn
  # <hostname>.<domain>). network: dhcp, or a static cidr, gateway and dns on the NIC with
  # mac. disks: one disk (ext4 on LVM), a udev filter such as {ID_SERIAL: ...} or a kernel
  # name, or two kernel names for a ZFS mirror. A filter value may not be only wildcards.
  # bmc.type: redfish, ipmi or none (power and boot by hand). media: pxe (a temporary
  # proxyDHCP netboot on the Proxmox host that answers only this machine's MAC), redfish
  # (standard VirtualMedia.InsertMedia over HTTP) or manual (USB stick or the BMC web UI).
  # mac: the NIC that boots from the network, when network is dhcp (else network.mac).
  # boot_mode: uefi or bios (IPMI boot device option). serial: optional, the serial its BMC
  # must report before anything changes. Credentials: kv/homelab/<name>/bmc.
  provision:
    refuse:
      macs: ["02:00:00:00:00:10", "02:00:00:00:00:11"]
      serials: [EXAMPLE0]
    machines:
      pve2:
        keyboard: en-us
        country: us
        timezone: UTC
        network: {cidr: 192.0.2.12/24, gateway: 192.0.2.1, dns: 192.0.2.1, mac: "02:00:00:00:00:20"}
        disks: [{ID_SERIAL: "EXAMPLE-DISK-0"}]
        bmc: {type: redfish, address: 192.0.2.124}
        media: redfish
        serial: EXAMPLE2
        # Dell only, optional: turn the RAID controller's Ready disks into Non-RAID disks
        # before the install (docs/provisioning.md, The RAID controller).
        # controller: {vendor: dell, mode: nonraid}
        # ZFS data pools after the install (make pools HOST=pve2, role zfs_pools). Disks by
        # their names under /dev/disk/by-id: anvil pools lists them. Layouts: mirror,
        # raidz1, raidz2, raidz3. proxmox_storage adds the pool for VM disks and containers.
        pools:
          - {name: vmdata, layout: mirror, disks: [wwn-0x5000c500aaaa0002, wwn-0x5000c500aaaa0003], proxmox_storage: true}
          - name: tank
            layout: raidz1
            disks: [wwn-0x5000c500aaaa0004, wwn-0x5000c500aaaa0005, wwn-0x5000c500aaaa0006, wwn-0x5000c500aaaa0007]
  # Addresses the frigate stack's config refers to (frigate_stack role).
  frigate_stack:
    genai_ollama_ip: 192.0.2.127
    # The camera's stream. Its login is in Vault (rtsp_user, rtsp_password).
    camera: {host: 192.0.2.107, port: 554, path: /stream1}
  # Pi-hole's local DNS records (pihole role), each <name>.lan.<domain>. `ref` is a dotted
  # path into this dict, so an address is written once; `ip` gives one directly.
  dns:
    local_records:
      - {name: pve, ref: pve.uplink_ip}
      - {name: vault, ref: hosts.vault.ip}
      - {name: apps, ref: hosts.apps.home_ip}
      - {name: printer, ip: 198.51.100.40}
    # Public resolvers Caddy uses to see its DNS-01 challenge record (role caddy).
    acme_resolvers: [198.51.100.53, 198.51.100.54]
  # The service gateway's names: <name>.<subdomain>.<domain> (inventory
  # group_vars/all/gateway.yml); empty or absent subdomain: <name>.<domain>.
  gateway:
    subdomain: internal
  # The service gateway (roles caddy and pihole): each enabled entry is served as
  # https://<name>.<gateway domain> by Caddy on the apps VM, and Pi-hole answers that name
  # with the apps home address. `host` is a dotted path into this dict (or `container`, a
  # container on a network Caddy shares). Field reference: ansible/roles/caddy/defaults/main.yml.
  # The Homepage dashboard (role homepage) lists every enabled entry except its own (home);
  # optional fields title, group, icon, description and widget override its catalog
  # (ansible/roles/homepage/defaults/main.yml; `widget: none` turns a widget off).
  # Machines that may mount the media library over NFS (role nfs_media): their NetBird IPs.
  nfs:
    clients: [100.64.0.7]
  services:
    - {name: pve, host: pve.ip, port: 8006, scheme: https, insecure_upstream: true, websocket: true}
    - {name: pve2, host: network.pve2_ip, port: 8006, scheme: https, insecure_upstream: true, websocket: true}
    - {name: vault, host: hosts.vault.ip, port: 8200, scheme: https, upstream_ca: vault}
    - {name: tv, host: hosts.ragnarok.ip, port: 34401, scheme: http, stream: true, description: Live TV}
    - {name: qbit, host: hosts.ragnarok.ip, port: 8080, scheme: http, host_header: upstream}
    - {name: dns, container: pihole, port: 80, scheme: http, home: /admin/}
    - {name: home, container: homepage, port: 3000, scheme: http}
    - {name: wiki, host: hosts.frigate.ip, port: 3000, scheme: http, websocket: true}
    - {name: pass, host: hosts.vaultwarden.ip, port: 8080, scheme: http, websocket: true}
    # Authentik (role authentik on the identity VM). Its admin pages use a WebSocket.
    - {name: auth, host: hosts.identity.ip, port: 9000, scheme: http, websocket: true}
    - {name: llm, host: hosts.llm.ip, port: 8080, scheme: http, websocket: true}
    - {name: switch, host: network.switch_ip, port: 80, scheme: http, rewrite_location: true}

  homepage:
    bookmarks:
      - {group: Security, name: VPN, href: "https://sync.example.com", icon: netbird.png}
