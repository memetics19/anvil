# Structure of the `site` dict (documentation; example values use RFC 5737 ranges and example.com).
# The real copy lives in macOS Keychain (service homelab, account site-bootstrap) as this YAML,
# until Task 9 loads it into Vault at kv/homelab/site (KV v2, mount kv, key "site").
site:
  domain: example.com
  email: admin@example.com
  lan_cidr: 192.0.2.0/24
  guest_dns: [198.51.100.53, 198.51.100.54]
  pve:
    hostname: pve
    ip: 192.0.2.10
    gateway_alias_ip: 192.0.2.1
    uplink_ip: 198.51.100.250
    uplink_prefix: 24
    uplink_gw: 198.51.100.1
    # The server's BMC (iDRAC), on the lab network.
    idrac_ip: 192.0.2.123
  hosts:
    frigate: {ip: 192.0.2.114, vmid: 9001, mac: "02:00:00:00:00:01"}
    netbird: {ip: 192.0.2.115, vmid: 9002, mac: "02:00:00:00:00:02"}
    ragnarok: {ip: 192.0.2.119, vmid: 9003, mac: "02:00:00:00:00:03"}
    vault: {ip: 192.0.2.120, vmid: 9004}
    # Two NICs: ip/mac on the lab network (default route), home_ip/home_mac on the home
    # network (pve.uplink_ip's /uplink_prefix, no gateway). Reserve home_ip for home_mac in
    # the router's DHCP. dns_subnet: the Pi-hole compose network, RFC 1918, /16../28, not
    # overlapping the lab or home network or Docker's default bridge (the role checks);
    # dns_unbound_ip: Unbound's fixed address in it (Pi-hole's upstream). The example range
    # is allowlisted in .gitleaks.toml for this file only.
    apps:
      ip: 192.0.2.121
      home_ip: 198.51.100.249
      vmid: 9005
      mac: "02:00:00:00:00:05"
      home_mac: "02:00:00:00:00:06"
      dns_subnet: 172.31.255.0/24
      dns_unbound_ip: 172.31.255.53
  # Addresses the frigate stack's config refers to (frigate_stack role).
  frigate_stack:
    genai_ollama_ip: 192.0.2.127
  # Pi-hole's local DNS records (pihole role), each <name>.lan.<domain>. `ref` is a dotted
  # path into this dict, so an address is written once; `ip` gives one directly.
  dns:
    local_records:
      - {name: pve, ref: pve.uplink_ip}
      - {name: vault, ref: hosts.vault.ip}
      - {name: apps, ref: hosts.apps.home_ip}
      - {name: printer, ip: 198.51.100.40}
    # Public resolvers Caddy uses to see its DNS-01 challenge record (role caddy).
    acme_resolvers: [198.51.100.53, 198.51.100.54]
  # The service gateway's names: <name>.<subdomain>.<domain> (inventory
  # group_vars/all/gateway.yml); empty or absent subdomain: <name>.<domain>.
  gateway:
    subdomain: internal
  # The service gateway (roles caddy and pihole): each enabled entry is served as
  # https://<name>.<gateway domain> by Caddy on the apps VM, and Pi-hole answers that name
  # with the apps home address. `host` is a dotted path into this dict (or `container`, a
  # container on a network Caddy shares). Field reference: ansible/roles/caddy/defaults/main.yml.
  # The Homepage dashboard (role homepage) lists every enabled entry except its own (home);
  # optional fields title, group, icon, description and widget override its catalog
  # (ansible/roles/homepage/defaults/main.yml; `widget: none` turns a widget off).
  services:
    - {name: pve, host: pve.ip, port: 8006, scheme: https, insecure_upstream: true, websocket: true}
    - {name: vault, host: hosts.vault.ip, port: 8200, scheme: https, upstream_ca: vault}
    - {name: tv, host: hosts.ragnarok.ip, port: 34401, scheme: http, stream: true, description: Live TV}
    - {name: qbit, host: hosts.ragnarok.ip, port: 8080, scheme: http, host_header: upstream}
    - {name: dns, container: pihole, port: 80, scheme: http, home: /admin/}
    - {name: home, container: homepage, port: 3000, scheme: http}
    - {name: pass, container: vaultwarden, port: 8080, scheme: http, websocket: true}
