# Read-only health of every host, for tests/smoke/test_hosts.sh. It runs with --check, and
# every command here only reads. Each host's problems are gathered and reported together.
# Messages name units, mounts and containers, never addresses.
#
# Two plays: the site lookup runs once per play and its facts reach every host in it,
# including the Python path Ansible found. The Proxmox hosts run Debian, not Ubuntu.
- name: Host health, Proxmox hosts
  hosts: proxmox
  gather_facts: false
  vars: &smoke_vars
    smoke_disk_limit: 95
  pre_tasks: &smoke_pre
    - name: Resolve the site dict once for this run
      ansible.builtin.import_tasks: ../../ansible/playbooks/tasks/site.yml
  tasks: &smoke_tasks
    - name: Failed systemd units
      ansible.builtin.command:
        argv: [systemctl, --failed, --no-legend, --plain]
      register: smoke_failed_units
      changed_when: false
      check_mode: false

    - name: Disk use
      ansible.builtin.command:
        argv: [df, "--output=pcent,target", -x, tmpfs, -x, devtmpfs, -x, overlay, -x, squashfs, -x, efivarfs]
      register: smoke_df
      changed_when: false
      check_mode: false

    - name: Is Docker here
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: smoke_docker

    - name: Containers
      ansible.builtin.command:
        argv: [docker, ps, -a, --format, "{{ '{{.Names}}\t{{.State}}\t{{.Status}}' }}"]
      register: smoke_containers
      changed_when: false
      check_mode: false
      when: smoke_docker.stat.exists

    - name: This host has no problem
      vars:
        smoke_units: "{{ smoke_failed_units.stdout_lines | map('split') | map('first') | list }}"
        smoke_full: >-
          {%- set out = [] -%}
          {%- for l in smoke_df.stdout_lines[1:] -%}
          {%- set f = l.split() -%}
          {%- if f | length == 2 and (f[0] | replace('%', '') | int) >= smoke_disk_limit -%}
          {%- set _ = out.append(f[1] ~ ' ' ~ f[0]) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out }}
        smoke_bad_containers: >-
          {{ (smoke_containers.stdout_lines | default([]))
             | select('search', '\trestarting\t|\(unhealthy\)')
             | map('split', '\t') | map('first') | list }}
        smoke_problems: >-
          {{ (['failed units: ' ~ smoke_units | join(', ')] if smoke_units else [])
             + (['filesystems ' ~ smoke_disk_limit ~ '% full or more: ' ~ smoke_full | join(', ')] if smoke_full else [])
             + (['containers restarting or unhealthy: ' ~ smoke_bad_containers | join(', ')] if smoke_bad_containers else []) }}
      ansible.builtin.assert:
        that: smoke_problems | length == 0
        fail_msg: "{{ smoke_problems | join('. ') }}"
        quiet: true

- name: Host health, VMs
  hosts: guests:apps_servers:identity_servers:llm_servers:enclave
  gather_facts: false
  become: true
  vars: *smoke_vars
  pre_tasks: *smoke_pre
  tasks: *smoke_tasks
