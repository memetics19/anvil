site_name: anvil
site_description: Terraform and Ansible for a single-node Proxmox homelab
repo_url: https://github.com/memetics19/anvil
edit_uri: edit/main/docs/
# scripts/docs-build.sh copies README.md and docs/*.md here, with links fixed for the site.
docs_dir: build/docs-src
site_dir: build/site
strict: true
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
  features: [navigation.sections, navigation.top, search.highlight, content.code.copy]
markdown_extensions: [admonition, attr_list, tables, toc: {permalink: true}, pymdownx.superfences, pymdownx.highlight]
nav:
  - Overview: index.md
  - Install: install.md
  - Setup: setup.md
  - Usage: usage.md
  - CLI: cli.md
  - Provisioning: provisioning.md
  - Hardware: hardware.md
  - Packer images (roadmap): packer.md
  - Services: services.md
  - Secrets: secrets.md
  - Cisco switch: cisco-switch.md
