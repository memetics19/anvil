name: ci
on:
  push:
  # A pull request that changes only the README runs no CI. Its merge still runs CI on
  # main, so the weekly release (release-please.yml) always finds main checked.
  pull_request:
    paths-ignore:
      - README.md
      - docs/assets/anvil-*.svg

permissions:
  contents: read

env:
  ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.collections

jobs:
  # The shell tests by layer (tests/README.md). Each layer finds its tests by folder, so a new
  # test runs without a line here. Unit also runs the linters and the secrets scan.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [unit, integration]
    name: tests (${{ matrix.layer }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@v3
        if: matrix.layer == 'unit'
      - uses: terraform-linters/setup-tflint@v4
        if: matrix.layer == 'unit'
      - name: Install linters
        run: |
          pipx install yamllint
          pipx install ansible-lint
          pipx install ansible-core
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      # The pinned collections, cached by requirements.yml: a Galaxy outage does not stop CI.
      - name: Cache Ansible collections
        id: collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.ANSIBLE_COLLECTIONS_PATH }}
          key: ansible-collections-${{ hashFiles('ansible/requirements.yml') }}
      - name: Install Ansible collections (Galaxy, else GitHub at the same tags)
        if: steps.collections.outputs.cache-hit != 'true'
        run: scripts/install-collections.sh "$ANSIBLE_COLLECTIONS_PATH"
      - name: Lint and secret scan
        if: matrix.layer == 'unit'
        run: make lint secrets-scan
      # Real tools for the integration layer: loop devices, ZFS, LVM, nftables, apt, age.
      - name: Install integration tools
        if: matrix.layer == 'integration'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age sqlite3 expect sshpass nftables apt-utils \
            gdisk cloud-guest-utils lvm2 parted zfsutils-linux
          sudo modprobe zfs
      - name: Run the ${{ matrix.layer }} tests
        run: tests/run.sh ${{ matrix.layer }}

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Keep in step with the go line in cli/go.mod.
          go-version: "1.27.3"
          cache-dependency-path: cli/go.sum
      - name: Vet and test the anvil CLI
        working-directory: cli
        run: |
          go vet ./...
          go test ./...
      - name: Build darwin/arm64 and linux/amd64 twice, and compare
        run: |
          for p in darwin/arm64 linux/amd64; do
            os=${p%/*} arch=${p#*/}
            GOOS=$os GOARCH=$arch make cli ANVIL_OUT="build/anvil-$os-$arch"
            GOOS=$os GOARCH=$arch make cli ANVIL_OUT="build/again/anvil-$os-$arch"
            cmp "build/anvil-$os-$arch" "build/again/anvil-$os-$arch"
          done
