name: ci
on:
  push:
  # A pull request that changes only the README runs no CI. Its merge still runs CI on
  # main, so the weekly release (release-please.yml) always finds main checked.
  pull_request:
    paths-ignore:
      - README.md
      - docs/assets/anvil-*.svg

permissions:
  contents: read

env:
  ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.collections

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@v3
      - uses: terraform-linters/setup-tflint@v4
      - name: Install linters
        run: |
          pipx install yamllint
          pipx install ansible-lint
          pipx install ansible-core
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      # The pinned collections, cached by requirements.yml: a Galaxy outage does not stop CI.
      - name: Cache Ansible collections
        id: collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.ANSIBLE_COLLECTIONS_PATH }}
          key: ansible-collections-${{ hashFiles('ansible/requirements.yml') }}
      - name: Install Ansible collections (Galaxy, else GitHub at the same tags)
        if: steps.collections.outputs.cache-hit != 'true'
        run: scripts/install-collections.sh "$ANSIBLE_COLLECTIONS_PATH"
      - name: Lint and secret scan
        run: make lint secrets-scan
      - name: Guardrail test
        run: tests/test_secrets_scan.sh
      - name: Media library test
        run: tests/test_media_untouched.sh
      - name: IPTV lineup test
        run: tests/test_iptv_lineup.sh
      - name: IPTV web page test
        run: tests/test_iptv_web.sh
      - name: Plan guard test
        run: tests/test_plan_guard.sh
      - name: Rotate test
        run: tests/test_rotate.sh
      - name: Sonarr and Radarr quality policy
        run: tests/test_arr_quality.sh
      - name: Pi-hole local records test
        run: tests/test_pihole_records.sh
      - name: Service gateway test
        run: tests/test_gateway.sh
      - name: LLM test
        run: tests/test_llm.sh
      - name: SMB media test
        run: tests/test_smb_media.sh
      - name: Port guard test
        run: tests/test_port_guard.sh
      - name: Proxmox single sign-on test
        run: tests/test_pve_sso.sh
      - name: Homepage dashboard test
        run: tests/test_homepage.sh
      - name: Self-hosted NetBird test
        run: tests/test_netbird_server.sh
      - name: Vaultwarden test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age sqlite3
          tests/test_vaultwarden.sh
      - name: Network rollback test
        run: tests/test_net_rollback.sh
      - name: Netplan rollback test
        run: tests/test_netplan_rollback.sh
      - name: Routed segments firewall test
        run: tests/test_segments.sh
      - name: Vault in the secrets enclave test
        run: tests/test_enclave_vault.sh
      - name: Switch plan and SSH helper test
        run: |
          sudo apt-get install -y -qq expect sshpass
          tests/test_switch.sh
      - name: Provisioning answer file and guard test
        run: tests/test_provision.sh
      - name: One-line installer test
        run: tests/test_install.sh
      - name: Pulse deploy test
        run: tests/test_pulse.sh
      - name: Every published port names its address
        run: tests/test_published_ports.sh
      - name: Docmost role
        run: tests/test_docmost.sh
      - name: Authentik role
        run: |
          sudo apt-get install -y -qq age
          tests/test_authentik.sh
      - name: Pulse agent role
        run: tests/test_pulse_agent.sh
      - name: NFS media role
        run: |
          sudo apt-get install -y -qq nftables
          tests/test_nfs_media.sh
      - name: Grow a disk online (loop devices, ext4 and LVM)
        run: |
          sudo apt-get install -y -qq gdisk cloud-guest-utils lvm2 parted
          tests/test_grow_disk.sh
      - name: ZFS data pools (loop devices, real ZFS)
        run: |
          sudo apt-get install -y -qq zfsutils-linux
          sudo modprobe zfs
          tests/test_zfs_pools.sh
      - name: SSH host keys are checked
        run: tests/test_host_keys.sh
      - name: forget-host removes one host's key
        run: tests/test_forget_host.sh
      - name: apt repository test
        run: |
          sudo apt-get install -y -qq apt-utils
          tests/test_apt_repo.sh

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Keep in step with the go line in cli/go.mod.
          go-version: "1.27.3"
          cache-dependency-path: cli/go.sum
      - name: Vet and test the anvil CLI
        working-directory: cli
        run: |
          go vet ./...
          go test ./...
      - name: Build darwin/arm64 and linux/amd64 twice, and compare
        run: |
          for p in darwin/arm64 linux/amd64; do
            os=${p%/*} arch=${p#*/}
            GOOS=$os GOARCH=$arch make cli ANVIL_OUT="build/anvil-$os-$arch"
            GOOS=$os GOARCH=$arch make cli ANVIL_OUT="build/again/anvil-$os-$arch"
            cmp "build/anvil-$os-$arch" "build/again/anvil-$os-$arch"
          done
