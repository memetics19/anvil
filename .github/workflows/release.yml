# GoReleaser (.goreleaser.yaml): archives, checksums, .deb, .rpm and the Homebrew formula.
#   a vX.Y.Z tag      the release: the files go onto the GitHub Release
#   release-please    calls this workflow with the tag it created (a tag pushed with the
#                     default token starts no workflow on its own)
#   pull requests     a snapshot that publishes nothing, so packaging breakage shows early
#   and pushes to main
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build, for example v0.1.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Keep in step with the go line in cli/go.mod.
          go-version: "1.27.2"
          cache-dependency-path: cli/go.sum
      - name: Snapshot, publishes nothing
        if: env.RELEASE != 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          # Keep in step with GORELEASER_VERSION in the Makefile.
          version: v2.18.2
          args: release --snapshot --clean --skip=publish
      - name: Release
        if: env.RELEASE == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          # Publishes the release and commits the Homebrew formula to Formula/ on main.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
